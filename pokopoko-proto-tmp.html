<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ミズーのほしぞらマッチ（試作v1）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:
      radial-gradient(1.8px 1.8px at 12% 18%, #ffffff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 32% 8%, #ffeeb0 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 58% 22%, #ffffff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 78% 10%, #cfe4ff 50%, transparent 51%),
      radial-gradient(1.8px 1.8px at 90% 30%, #ffffff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 45% 34%, #ffffff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 68% 40%, #ffeeb0 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 22% 44%, #cfe4ff 50%, transparent 51%),
      linear-gradient(180deg,#0d1a38 0%,#1d3461 58%,#2c4a7c 100%);
    color:#eaf2ff; overflow:hidden; touch-action:none;
    display:flex; flex-direction:column; align-items:center;
  }
  #app { width:100%; max-width:430px; height:100%; display:flex; flex-direction:column; align-items:center; padding:8px 10px 10px; }
  header { width:100%; display:flex; align-items:center; gap:8px; }
  h1 { font-size:16px; letter-spacing:.02em; flex:1; white-space:nowrap; }
  h1 .sub { font-size:10px; color:#9db8dd; display:block; font-weight:normal; }
  .stages { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .stage-btn {
    border:2px solid #7fa8d8; background:rgba(255,255,255,.12); color:#dceaff; border-radius:999px;
    font-size:12px; font-weight:bold; padding:5px 10px; cursor:pointer;
  }
  .stage-btn.active { background:#ff9f2e; color:#fff; border-color:#ff9f2e; }
  .stage-btn.cleared { border-color:#57b25e; }
  #hud {
    width:100%; display:flex; align-items:stretch; gap:8px; margin-top:8px;
  }
  .hud-box {
    background:rgba(13,26,56,.62); border:2px solid #46679c; border-radius:12px;
    padding:5px 10px; text-align:center; min-width:76px;
  }
  .hud-box .label { font-size:10px; color:#9db8dd; }
  .hud-box .value { font-size:19px; font-weight:bold; line-height:1.15; }
  #movesBox .value { color:#ff9d9d; }
  #scoreBox { flex:1; }
  #scoreBarWrap { height:6px; background:#2c4a7c; border-radius:3px; margin-top:3px; overflow:hidden; }
  #scoreBar { height:100%; width:0%; background:linear-gradient(90deg,#ffc93c,#ff9f2e); border-radius:3px; transition:width .3s; }
  #goalLine { font-size:11px; font-weight:bold; color:#ffd94d; margin-top:3px; white-space:nowrap; overflow:hidden; }
  #mizuBox {
    display:flex; align-items:center; gap:6px; background:rgba(13,26,56,.62);
    border:2px solid #46679c; border-radius:12px; padding:4px 8px 4px 4px; max-width:150px;
  }
  #mizuFace { width:44px; height:44px; flex:none; }
  #mizuMsg { font-size:11px; line-height:1.3; color:#dceaff; }
  #boardWrap { position:relative; margin-top:10px; background:rgba(10,22,48,.72); border:3px solid #46679c; border-radius:18px; padding:6px; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  #board { position:relative; }
  .block {
    position:absolute; border-radius:22%; display:flex; align-items:center; justify-content:center;
    transition:transform .18s ease-in-out, opacity .15s, scale .15s;
    cursor:pointer; will-change:transform; z-index:1;
  }
  /* --- 石板（障害物） --- */
  .slate {
    position:absolute; z-index:0; display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, scale .2s;
  }
  .slate svg { width:95%; height:95%; pointer-events:none; }
  .slate.breaking { opacity:0; scale:.4; }
  /* --- ヒント表示 --- */
  .block.hint { animation:hintpulse .8s ease-in-out infinite alternate; }
  @keyframes hintpulse {
    from { filter:brightness(1); }
    to { filter:brightness(1.3); box-shadow:0 0 14px 5px rgba(255,217,61,.9); }
  }
  /* --- プレイアイテム --- */
  #itemBar { display:flex; gap:8px; margin-top:10px; }
  .item-btn {
    display:flex; align-items:center; gap:6px;
    border:2px solid #7fa8d8; background:rgba(255,255,255,.12); color:#dceaff; border-radius:999px;
    font-size:13px; font-weight:bold; padding:6px 14px; cursor:pointer;
  }
  .item-btn svg { width:18px; height:18px; pointer-events:none; }
  .item-btn.active { background:#ff9f2e; color:#fff; border-color:#ff9f2e; }
  .block svg { width:82%; height:82%; pointer-events:none; }
  .block.selected { outline:3px solid #ff9f2e; outline-offset:-3px; scale:1.08; z-index:5; }
  .block.clearing { opacity:0; scale:.3; }
  .t0 { background:#fff0b8; box-shadow:inset 0 -3px 0 #f2cf6b, inset 0 2px 0 #fffbe8; }
  .t1 { background:#dfe6ff; box-shadow:inset 0 -3px 0 #a9bcf2, inset 0 2px 0 #f4f7ff; }
  .t2 { background:#d8f3ff; box-shadow:inset 0 -3px 0 #93d2f2, inset 0 2px 0 #f2fbff; }
  .t3 { background:#d9f6cf; box-shadow:inset 0 -3px 0 #95d67f, inset 0 2px 0 #f4ffec; }
  .t4 { background:#ffe0ef; box-shadow:inset 0 -3px 0 #f5a3c8, inset 0 2px 0 #fff2f8; }
  /* --- 特殊ブロックの見た目 --- */
  .block .mark { position:absolute; pointer-events:none; }
  .mark.full { width:97%; height:97%; left:1.5%; top:1.5%; }
  .mark.badge { width:58%; height:58%; right:-9%; top:-9%; z-index:3; }
  .block.sp-rainbow {
    background:linear-gradient(135deg,#ff8a8a 0%,#ffd93c 30%,#7be495 55%,#6ec6ff 80%,#c39bff 100%);
    box-shadow:inset 0 -3px 0 rgba(120,60,160,.45), inset 0 2px 0 #ffffff, 0 0 12px #ffd93c;
  }
  .block.born { animation:bornpop 1.2s ease; z-index:6; }
  @keyframes bornpop {
    0% { scale:.3; box-shadow:0 0 0 0 rgba(255,217,61,0); }
    20% { scale:1.24; box-shadow:0 0 0 4px #ffd93c, 0 0 22px 10px rgba(255,217,61,.95); }
    45% { scale:1; box-shadow:0 0 0 4px #ffd93c, 0 0 22px 10px rgba(255,217,61,.95); }
    100% { scale:1; box-shadow:0 0 0 0 rgba(255,217,61,0); }
  }
  /* --- 発動の予告表示（消える範囲が一瞬光る） --- */
  .block.willclear { filter:brightness(1.4); box-shadow:0 0 0 3px #ffffff, 0 0 18px 8px rgba(255,255,255,.9); z-index:6; }
  .slate.willhit { filter:brightness(1.35); box-shadow:0 0 0 3px #ffffff, 0 0 14px 6px rgba(255,255,255,.85); border-radius:18%; }
  /* --- 連鎖・クリアボーナスの大きな表示 --- */
  #chainBanner {
    position:absolute; left:50%; top:36%; transform:translate(-50%,-50%);
    font-size:42px; font-weight:bold; color:#ffd93c; white-space:nowrap;
    text-shadow:0 2px 0 #b85c1e, 0 0 18px rgba(255,157,46,.85), 0 3px 8px rgba(0,0,0,.55);
    opacity:0; pointer-events:none; z-index:40;
  }
  #chainBanner.show { animation:chainpop .95s ease forwards; }
  @keyframes chainpop {
    0% { opacity:0; transform:translate(-50%,-50%) scale(.5); }
    18% { opacity:1; transform:translate(-50%,-50%) scale(1.18); }
    32% { transform:translate(-50%,-50%) scale(1); }
    78% { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-62%) scale(1); }
  }
  #bonusBanner {
    position:absolute; left:50%; top:10%; transform:translateX(-50%);
    font-size:27px; font-weight:bold; color:#ff9f2e; white-space:nowrap;
    text-shadow:0 2px 0 #7a2d00, 0 0 16px rgba(255,159,46,.9), 0 3px 8px rgba(0,0,0,.55);
    display:none; pointer-events:none; z-index:40;
  }
  #bonusBanner.show { display:block; animation:bonuspulse .45s ease-in-out infinite alternate; }
  @keyframes bonuspulse { from { transform:translateX(-50%) scale(1); } to { transform:translateX(-50%) scale(1.07); } }
  #explainIcon { display:flex; justify-content:center; margin-bottom:8px; }
  #explainTitle { color:#2c4a7c; }
  .block.flying { transition:transform .45s ease-in-out !important; z-index:30; }
  #toast {
    margin-top:10px; min-height:22px; font-size:13px; font-weight:bold; color:#ffd94d;
    opacity:0; transition:opacity .25s;
  }
  #toast.show { opacity:1; }
  #hint { margin-top:2px; font-size:11px; color:#9db8dd; text-align:center; }
  .overlay {
    position:fixed; inset:0; background:rgba(30,50,80,.45); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show { display:flex; }
  .card {
    background:#fff; border-radius:20px; padding:26px 30px; text-align:center;
    box-shadow:0 12px 32px rgba(0,0,0,.25); max-width:82vw;
  }
  .card .big { font-size:26px; font-weight:bold; margin-bottom:6px; }
  .card .detail { font-size:13px; color:#567; margin-bottom:16px; line-height:1.6; }
  .card button {
    border:none; background:#ff9f2e; color:#fff; font-size:15px; font-weight:bold;
    border-radius:999px; padding:10px 22px; cursor:pointer; margin:0 4px;
  }
  .card button.sub { background:#e8eef4; color:#456; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ミズーのほしぞらマッチ<span class="sub">試作 v1 ・ 本家式の爆弾とスコア</span></h1>
    <div class="stages" id="stageBtns"></div>
  </header>

  <div id="hud">
    <div class="hud-box" id="movesBox">
      <div class="label">のこり手数</div>
      <div class="value" id="movesVal">--</div>
    </div>
    <div class="hud-box" id="scoreBox">
      <div class="label">スコア</div>
      <div class="value" id="scoreVal">0</div>
      <div id="scoreBarWrap"><div id="scoreBar"></div></div>
      <div id="goalLine"></div>
    </div>
    <div id="mizuBox">
      <div id="mizuFace"></div>
      <div id="mizuMsg">がんばれ！</div>
    </div>
  </div>

  <div id="boardWrap"><div id="board"></div><div id="chainBanner"></div><div id="bonusBanner">クリアボーナス！</div></div>
  <div id="itemBar">
    <button class="item-btn" id="hammerBtn"><svg viewBox="0 0 100 100"><rect x="36" y="6" width="42" height="21" rx="6" fill="#e07b39"/><rect x="27" y="6" width="15" height="21" rx="6" fill="#b85c1e"/><rect x="45" y="22" width="11" height="64" rx="5" transform="rotate(16 50 54)" fill="#c98d4e"/></svg>ハンマー</button>
    <button class="item-btn" id="shuffleBtn"><svg viewBox="0 0 100 100"><path d="M10,30 C35,30 55,68 84,68" fill="none" stroke="#6ec6ff" stroke-width="8" stroke-linecap="round"/><polygon points="84,54 84,82 66,68" fill="#6ec6ff"/><path d="M10,68 C35,68 55,30 84,30" fill="none" stroke="#ffd93c" stroke-width="8" stroke-linecap="round"/><polygon points="84,16 84,44 66,30" fill="#ffd93c"/></svg>シャッフル</button>
  </div>
  <div id="toast"></div>
  <div id="hint">ブロックをタップ→となりをタップ、またはドラッグで入れ替え。<br>3つそろうと消えるよ。4つ以上そろえると爆弾ができて、爆弾は入れ替えると発動するよ！<br>石板は、となりでブロックが消えると壊れるよ。</div>
</div>

<div class="overlay" id="clearOverlay">
  <div class="card">
    <div class="big">🎉 クリア！</div>
    <div class="detail" id="clearDetail"></div>
    <button id="nextBtn">つぎの面へ</button>
    <button class="sub" id="replayBtn1">もう一度</button>
  </div>
</div>

<div class="overlay" id="failOverlay">
  <div class="card">
    <div class="big">手数がなくなった…</div>
    <div class="detail" id="failDetail"></div>
    <button id="retryBtn">もう一度挑戦</button>
  </div>
</div>

<div class="overlay" id="introOverlay">
  <div class="card">
    <div class="big" id="introTitle">面1</div>
    <div class="detail" id="introDetail"></div>
    <button id="startBtn">スタート</button>
  </div>
</div>

<div class="overlay" id="continueOverlay">
  <div class="card">
    <div class="big">手数がなくなった…</div>
    <div class="detail" id="continueDetail"></div>
    <button id="continueBtn">広告を見て +5手</button>
    <button class="sub" id="giveUpBtn">やめる</button>
  </div>
</div>

<div class="overlay" id="explainOverlay">
  <div class="card">
    <div id="explainIcon"></div>
    <div class="big" id="explainTitle"></div>
    <div class="detail" id="explainDetail"></div>
    <button id="explainBtn">わかった！</button>
  </div>
</div>

<script>
"use strict";
/* ============ 基本設定 ============ */
const COLS = 7, ROWS = 8, TYPES = 5;
const NAMES = ["ほし","つき","ちきゅう","UFO","わくせい"];
/* 石板の配置（仮置き）: 面4は下部のピラミッド状に20枚、面6は中央下に10枚。
   石板のある列は落下の区切りになるため、固まりすぎると縦マッチが作れなくなる。
   上部は開けてマッチを作れる形にしてある。 */
const SLATES_20 = [
  [3,3],
  [4,2],[4,3],[4,4],
  [5,1],[5,2],[5,3],[5,4],[5,5],
  [6,1],[6,2],[6,3],[6,4],[6,5],
  [7,0],[7,1],[7,2],[7,3],[7,4],[7,5],
];
const SLATES_10 = [
  [4,3],
  [5,3],
  [6,2],[6,3],[6,4],
  [7,1],[7,2],[7,3],[7,4],[7,5],
];
const STAGES = [
  { moves: 17, goals: [{ kind: "score", target: 1500 }] },
  { moves: 25, goals: [{ kind: "score", target: 2400 }] },
  { moves: 5,  goals: [{ kind: "score", target: 2800 }] },
  { moves: 15, goals: [{ kind: "slate", target: 20 }], slates: SLATES_20 },
  { moves: 20, goals: [{ kind: "collect", type: 0, target: 35 }] },
  { moves: 20, goals: [{ kind: "score", target: 2000 }, { kind: "slate", target: 10 }], slates: SLATES_10 },
];

/* ============ 仮置きした規則（検証ドキュメントで未確定の点） ============
   ・特殊ブロックの生成位置: 動かしたブロックの到着マス（T/L字は交点）。
     連鎖中の生成はライン中央寄りで代替。到着マスが既に特殊なら同グループ内の通常マスへ。
   ・6つ以上の一直線はレインボー扱い。複数条件が同時成立した時の優先順位は
     レインボー > ダブル(T/L) > やじるし > ハチ(2×2)。
   ・ダブル×ダブルの範囲（7×7角丸→9×9角丸）はドキュメントに数値がないため仮置き。
   ・ハチの飛び先はランダム（本家は優先順位が未確認）。
   ・特殊ブロックが通常マッチに含まれたら、その効果が発動する（本家は未確認）。
   ・プレイ中の爆発で巻き込んだブロック/爆弾自体の得点は連鎖ティア単価で統一
     （本家は未確認。クリアボーナス時だけ爆弾1000点・巻き込み80点が確定値）。
   ・クリアボーナスで置く爆弾の種類はやじるし/ダブルからランダム。
   【P1で仮置きした規則】
   ・石板の配置は面4=下部ピラミッド20枚、面6=中央下10枚（本家の配置は未確認）。硬さは1段階のみ。
   ・石板の得点は検証ドキュメント§4の連鎖ティア別表（500/500/500/750/2000）。
     クリアボーナス中に壊れた石板は500点で統一（本家は未確認）。
   ・コンティニューは試作のため回数制限なし。ミズー版の正式仕様は広告で+5手・1面1回想定。
   ・ヒントの遅延は3秒（本家は「しばらく」で数値未確認）。全ステージで有効
     （本家は序盤のみの可能性あり）。
   ・ハンマーで特殊ブロックを消しても効果は発動しない（単純除去）。得点は通常単価（1連鎖80点）。
   ・ハチの飛び先は従来どおりランダムで、石板は対象に含めない。
   ・面5（指定消去35個/20手）・面6の数値は本家実例を目安にした仮置きで、
     クリア率は今後のボット試行で調整する。
*/

/* ============ ブロックの絵（SVG・絵文字なし／ほしぞらで統一） ============ */
function svgFor(t){
  switch(t){
    /* 0: ほし（黄色の星） */
    case 0: return '<svg viewBox="0 0 100 100"><polygon points="50,5 62,37 96,37 68,57 79,92 50,71 21,92 32,57 4,37 38,37" fill="#ffc93c" stroke="#d99400" stroke-width="4" stroke-linejoin="round"/></svg>';
    /* 1: つき（クリーム色の三日月） */
    case 1: return '<svg viewBox="0 0 100 100"><path d="M66,14 A40,40 0 1,0 66,86 A37,37 0 0,1 66,14 Z" fill="#ffe9a8" stroke="#d99400" stroke-width="4" stroke-linejoin="round"/><polygon points="66,24 68.5,30.5 75.5,30.5 70,34.8 72,41.5 66,37.4 60,41.5 62,34.8 56.5,30.5 63.5,30.5" fill="#ffc93c" stroke="#d99400" stroke-width="2.4" stroke-linejoin="round"/></svg>';
    /* 2: ちきゅう（青と緑の丸い地球・輪なし） */
    case 2: return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#3d9be9" stroke="#1f6fc2" stroke-width="4"/><g fill="#57b25e"><path d="M24,40 C19,29 29,19 39,21 C49,23 51,33 45,39 C39,45 28,48 24,40 Z"/><path d="M53,64 C53,54 63,48 71,52 C79,56 79,68 71,72 C63,76 53,72 53,64 Z"/><path d="M61,25 C65,19 75,19 77,25 C79,31 71,35 65,33 C59,31 58,29 61,25 Z"/><ellipse cx="31" cy="65" rx="6" ry="4.4"/></g><ellipse cx="36" cy="33" rx="9" ry="5" fill="#bfe3ff" opacity=".55"/></svg>';
    /* 3: UFO（円盤＋ドーム＋ライト。わくせいの輪とは形も色も別） */
    case 3: return '<svg viewBox="0 0 100 100"><path d="M27,56 A23,33 0 0,1 73,56 Z" fill="#cdeffd" stroke="#5ea9cf" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="44" r="7.5" fill="#69c24a"/><circle cx="47.3" cy="43" r="1.8" fill="#20401c"/><circle cx="52.7" cy="43" r="1.8" fill="#20401c"/><ellipse cx="50" cy="65" rx="45" ry="17" fill="#d9e1e6" stroke="#8fa3ad" stroke-width="4"/><circle cx="25" cy="65" r="4.2" fill="#35d461" stroke="#1e9e46" stroke-width="2"/><circle cx="50" cy="71.5" r="4.2" fill="#ffd93c" stroke="#d9a400" stroke-width="2"/><circle cx="75" cy="65" r="4.2" fill="#35d461" stroke="#1e9e46" stroke-width="2"/></svg>';
    /* 4: わくせい（ピンク色の土星型＝丸＋輪） */
    case 4: return '<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="44" ry="14" transform="rotate(-16 50 50)" fill="none" stroke="#e75480" stroke-width="7"/><circle cx="50" cy="48" r="25" fill="#f78fb8" stroke="#cf4d8b" stroke-width="4"/><path d="M12.5,59.5 A44,14 -16 0,0 87.5,40.5" fill="none" stroke="#e75480" stroke-width="7" stroke-linecap="round"/><ellipse cx="41" cy="39" rx="8" ry="5" fill="#ffd3e6" opacity=".85"/></svg>';
  }
  return "";
}

/* ============ 特殊ブロックの印 ============ */
function spName(kind){
  return kind === "arrow" ? "やじるし爆弾"
       : kind === "double" ? "ダブル爆弾"
       : kind === "bee" ? "ハチ爆弾" : "レインボー爆弾";
}
function rainbowSVG(){
  return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffffff" opacity=".9"/>'
    + '<path d="M14,68 A40,40 0 0,1 86,68" fill="none" stroke="#ff5252" stroke-width="8"/>'
    + '<path d="M22,72 A33,33 0 0,1 78,72" fill="none" stroke="#ff9800" stroke-width="8"/>'
    + '<path d="M30,75 A26,26 0 0,1 70,75" fill="none" stroke="#4caf50" stroke-width="8"/>'
    + '<path d="M38,77 A19,19 0 0,1 62,77" fill="none" stroke="#2196f3" stroke-width="8"/>'
    + '<polygon points="50,14 55,29 71,29 58.5,38.5 63,53 50,44 37,53 41.5,38.5 29,29 45,29" fill="#ffd93c" stroke="#d99400" stroke-width="2.6" stroke-linejoin="round"/></svg>';
}
function markSVG(b){
  if (!b.special) return "";
  if (b.special === "arrow"){
    const rot = b.arrowDir === "v" ? ' transform="rotate(90 50 50)"' : "";
    return '<svg class="mark full" viewBox="0 0 100 100"><g' + rot + '><polygon points="6,50 33,31 33,41 67,41 67,31 94,50 67,69 67,59 33,59 33,69" fill="#ff5722" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/></g></svg>';
  }
  if (b.special === "double"){

/* 石板の得点（連鎖ティア別表。検証ドキュメント§4） */
function slateUnit(chain){
  return chain <= 3 ? 500 : chain === 4 ? 750 : 2000;
}
/* 消えたブロック群に隣接する石板＋直接ヒットした石板の集合 */
function collectSlateHits(keys){
  const hits = new Set();
  for (const k of keys){
    const parts = k.split(",");
    const r = +parts[0], c = +parts[1];
    if (isSlate(r, c)){ hits.add(k); continue; }
    if (!grid[r] || !grid[r][c]) continue;
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr = r + dr, nc = c + dc;
      if (isSlate(nr, nc)) hits.add(key(nr, nc));
    }
  }
  return hits;
}
function applySlateDamage(hits, chain, mode){
  for (const k of hits){
    const parts = k.split(",");
    const r = +parts[0], c = +parts[1];
    if (!isSlate(r, c)) continue;
    slates[r][c]--;
    score += mode === "bonus" ? 500 : slateUnit(chain);
    if (slates[r][c] <= 0){
      slates[r][c] = 0;
      slatesBroken++;
      const el = slateEls[r][c];
      if (el){
        el.classList.add("breaking");
        setTimeout(() => el.remove(), 220);
        slateEls[r][c] = null;
      }
      toast("石板が壊れた！");
    }
  }
  if (hits.size) updateHUD();
}

/* ---------- マッチ検出（3つ以上のラン） ---------- */
function findMatches(){
  const hit = new Set();
  for (let r = 0; r < ROWS; r++){
    let run = 1;
    for (let c = 1; c <= COLS; c++){
      if (c < COLS && grid[r][c] && grid[r][c-1] && grid[r][c].type === grid[r][c-1].type) run++;
      else { if (run >= 3) for (let k = 1; k <= run; k++) hit.add(key(r, c-k)); run = 1; }
    }
  }
  for (let c = 0; c < COLS; c++){
    let run = 1;
    for (let r = 1; r <= ROWS; r++){
      if (r < ROWS && grid[r][c] && grid[r-1][c] && grid[r][c].type === grid[r-1][c].type) run++;
      else { if (run >= 3) for (let k = 1; k <= run; k++) hit.add(key(r-k, c)); run = 1; }
    }
  }
  return hit;
}
function findSquares(){
  const sq = [];
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++){
    const a = grid[r][c], b = grid[r][c+1], d = grid[r+1][c], e = grid[r+1][c+1];
    if (a && b && d && e && a.type === b.type && a.type === d.type && a.type === e.type)
      sq.push({ type: a.type, cells: [{r,c},{r,c:c+1},{r:r+1,c},{r:r+1,c:c+1}] });
  }
  return sq;
}

/* ---------- マッチ解析（ラン＋2×2をグループ化し、特殊ブロック生成を判定） ---------- */
function analyzeMatches(){
  const items = [];
  for (let r = 0; r < ROWS; r++){
    let c = 0;
    while (c < COLS){
      const b = grid[r][c];
      if (!b){ c++; continue; }
      let len = 1;
      while (c + len < COLS && grid[r][c+len] && grid[r][c+len].type === b.type) len++;
      if (len >= 3) items.push({ kind: "run", dir: "h", type: b.type,
        cells: Array.from({length: len}, (_, i) => ({ r, c: c + i })) });
      c += len;
    }
  }
  for (let c = 0; c < COLS; c++){
    let r = 0;
    while (r < ROWS){
      const b = grid[r][c];
      if (!b){ r++; continue; }
      let len = 1;
      while (r + len < ROWS && grid[r+len][c] && grid[r+len][c].type === b.type) len++;
      if (len >= 3) items.push({ kind: "run", dir: "v", type: b.type,
        cells: Array.from({length: len}, (_, i) => ({ r: r + i, c })) });
      r += len;
    }
  }
  for (const sq of findSquares()) items.push({ kind: "square", type: sq.type, cells: sq.cells });
  if (!items.length) return [];

  /* セルを共有する同種アイテムをグループ化（Union-Find） */
  const parent = items.map((_, i) => i);
  const findRoot = (x) => { while (parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const owner = new Map();
  items.forEach((it, i) => {
    for (const cl of it.cells){
      const k = key(cl.r, cl.c);
      if (owner.has(k)){
        const ri = findRoot(i), rj = findRoot(owner.get(k));
        if (ri !== rj) parent[ri] = rj;
      } else owner.set(k, i);
    }
  });
  const byRoot = new Map();
  items.forEach((it, i) => {
    const root = findRoot(i);
    if (!byRoot.has(root)) byRoot.set(root, []);
    byRoot.get(root).push(it);
  });

  const groups = [];
  for (const members of byRoot.values()){
    const cellMap = new Map();
    for (const m of members) for (const cl of m.cells) cellMap.set(key(cl.r, cl.c), cl);
    const runs = members.filter(m => m.kind === "run");
    const squares = members.filter(m => m.kind === "square");
    const hRuns = runs.filter(x => x.dir === "h"), vRuns = runs.filter(x => x.dir === "v");
    let kind = null, arrowDir = null, genRunCells = null, intersection = null, squareCells = null;
    const longRun = runs.find(x => x.cells.length >= 5);
    if (longRun){
      kind = "rainbow"; genRunCells = longRun.cells;
    } else if (hRuns.length && vRuns.length){
      kind = "double";
      const hSet = new Set(hRuns.flatMap(x => x.cells.map(cl => key(cl.r, cl.c))));
      for (const vr of vRuns){
        for (const cl of vr.cells) if (hSet.has(key(cl.r, cl.c))){ intersection = cl; break; }
        if (intersection) break;
      }
    } else {
      const r4 = runs.find(x => x.cells.length === 4);
      if (r4){ kind = "arrow"; arrowDir = r4.dir === "h" ? "v" : "h"; genRunCells = r4.cells; }
      else if (squares.length){ kind = "bee"; squareCells = squares[0].cells; }
    }
    groups.push({ type: members[0].type, cellsList: [...cellMap.values()],
                  kind, arrowDir, genRunCells, intersection, squareCells });
  }
  return groups;
}
function pickGenCell(g, pref){
  const free = (cl) => { const b = grid[cl.r][cl.c]; return !!b && !b.special; };
  const inList = (list, cl) => list.some(x => x.r === cl.r && x.c === cl.c);
  let ordered = [];
  if (g.kind === "double"){
    if (g.intersection) ordered.push(g.intersection);
  } else if (g.kind === "rainbow" || g.kind === "arrow"){
    const run = g.genRunCells;
    if (pref) for (const p of pref) if (inList(run, p)) ordered.push(p);
    ordered.push(run[Math.floor(run.length / 2)]);
    ordered = ordered.concat(run);
  } else if (g.kind === "bee"){
    const sq = g.squareCells;
    if (pref) for (const p of pref) if (inList(sq, p)) ordered.push(p);
    ordered = ordered.concat(sq);
  }
  ordered = ordered.concat(g.cellsList);
  for (const cl of ordered) if (free(cl)) return cl;
  return null;
}
function hasGroup(){ return analyzeMatches().length > 0; }
function boardHasSpecial(){
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (grid[r][c] && grid[r][c].special) return true;
  return false;
}
function swapInGrid(a, b){
  const ba = grid[a.r][a.c], bb = grid[b.r][b.c];
  grid[a.r][a.c] = bb; grid[b.r][b.c] = ba;
  if (bb){ bb.r = a.r; bb.c = a.c; }
  if (ba){ ba.r = b.r; ba.c = b.c; }
  return [ba, bb];
}
function findValidMoves(){
  const res = [];
  const dirs = [[0,1],[1,0]];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    if (!grid[r][c]) continue;   /* 石板マスは対象外 */
    for (const [dr,dc] of dirs){
      const r2 = r+dr, c2 = c+dc;
      if (r2 >= ROWS || c2 >= COLS) continue;
      if (!grid[r2][c2]) continue;
      swapInGrid({r,c},{r:r2,c:c2});
      if (hasGroup()) res.push({a:{r,c}, b:{r:r2,c:c2}});
      swapInGrid({r,c},{r:r2,c:c2});
    }
  }
  return res;
}
function findInvalidSwap(){
  const dirs = [[0,1],[1,0]];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    for (const [dr,dc] of dirs){
      const r2 = r+dr, c2 = c+dc;
      if (r2 >= ROWS || c2 >= COLS) continue;
      if (!grid[r][c] || !grid[r2][c2]) continue;  /* 石板マスは対象外 */
      if (grid[r][c].special || grid[r2][c2].special) continue;  /* 特殊同士・特殊との入れ替えは発動するので無効手にしない */
      swapInGrid({r,c},{r:r2,c:c2});
      const ok = hasGroup();
      swapInGrid({r,c},{r:r2,c:c2});
      if (!ok) return {a:{r,c}, b:{r:r2,c:c2}};
    }
  }
  return null;
}

/* ---------- 盤面生成（初期マッチ・2×2なし＋有効手3手以上を保証） ---------- */
function genBoard(){
  for (let attempt = 0; attempt < 300; attempt++){
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      if (isSlate(r, c)) continue;   /* 石板マスにはブロックを置かない */
      let t;
      do { t = rnd(TYPES); }
      while (
        (c >= 2 && grid[r][c-1] && grid[r][c-2] && grid[r][c-1].type === t && grid[r][c-2].type === t) ||
        (r >= 2 && grid[r-1][c] && grid[r-2][c] && grid[r-1][c].type === t && grid[r-2][c].type === t)
      );
      grid[r][c] = { id: 0, type: t, special: null, arrowDir: null, r, c, el: null };
    }
    if (findSquares().length === 0 && findValidMoves().length >= 3) return;
  }
}

/* ---------- シャッフル（詰み回避） ---------- */
function shuffleBoard(){
  const blocks = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (grid[r][c]) blocks.push(grid[r][c]);   /* 石板マスは混ぜない */
  const types = blocks.map(b => b.type);
  for (let attempt = 0; attempt < 300; attempt++){
    for (let i = types.length - 1; i > 0; i--){ const j = rnd(i+1); [types[i],types[j]] = [types[j],types[i]]; }
    blocks.forEach((b, i) => { b.type = types[i]; renderBlock(b); });
    if (findMatches().size === 0 && findSquares().length === 0 && findValidMoves().length >= 1) return;
  }
}

function updateHUD(){
  movesVal.textContent = movesLeft;
  scoreVal.textContent = score;
  const def = STAGES[stage];
  goalLineEl.textContent = def.goals.map(g => goalText(g)).join(" ・ ");
  const barGoal = def.goals.find(g => g.kind === "score") || def.goals[0];
  scoreBar.style.width = Math.min(100, goalCurrent(barGoal) / barGoal.target * 100) + "%";
  document.querySelectorAll(".stage-btn").forEach((el, i) => {
    el.classList.toggle("active", i === stage);
    el.classList.toggle("cleared", clearedStages.has(i));
  });
}

/* ---------- スコア（連鎖ティア式） ---------- */
function tierUnit(chain){
  return chain <= 1 ? 80 : chain === 2 ? 120 : chain === 3 ? 160 : chain === 4 ? 200 : 320;
}

/* ---------- 特殊ブロックの効果範囲 ---------- */
function lineCells(r, c, dir){
  const s = new Set();
  if (dir === "h"){
    if (r < 0 || r >= ROWS) return s;
    for (let cc = 0; cc < COLS; cc++) s.add(key(r, cc));
  } else {
    if (c < 0 || c >= COLS) return s;
    for (let rr = 0; rr < ROWS; rr++) s.add(key(rr, c));
  }
  return s;
}
function boxCells(r, c, rad, rounded){
  const s = new Set();
  for (let rr = r - rad; rr <= r + rad; rr++) for (let cc = c - rad; cc <= c + rad; cc++){
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
    const dx = Math.abs(rr - r), dy = Math.abs(cc - c);
    if (rounded && rad >= 3 &&
        ((dx === rad && dy === rad) || (dx === rad && dy === rad - 1) || (dx === rad - 1 && dy === rad))) continue;
    s.add(key(rr, cc));
  }
  return s;
}
function pickBeeTarget(bee, exclude){
  const cands = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const b = grid[r][c];
    if (b && b !== bee && !exclude.has(key(r, c))) cands.push(key(r, c));
  }
  return cands.length ? cands[rnd(cands.length)] : null;
}
async function flyBee(bee, targetKey){
  const parts = targetKey.split(",");
  const tr = +parts[0], tc = +parts[1];
  bee.el.classList.add("flying");
  bee.el.style.transform = "translate(" + (tc * cell) + "px," + (tr * cell) + "px)";
  await wait(480);
  bee.el.classList.remove("flying");
}

/* ---------- 落下＋補充（石板マスが列の区切りになる） ---------- */
function applyGravity(){
  for (let c = 0; c < COLS; c++){
    let segBottom = ROWS - 1;
    for (let r = ROWS - 1; r >= -1; r--){
      if (r !== -1 && !isSlate(r, c)) continue;
      const segTop = r + 1;
      let write = segBottom;
      for (let rr = segBottom; rr >= segTop; rr--){
        if (grid[rr][c]){
          const b = grid[rr][c];
          if (write !== rr){ grid[write][c] = b; grid[rr][c] = null; setBlockPos(b, write, c); }
          write--;
        }
      }
      const missing = write - segTop + 1;
      for (let rr = write; rr >= segTop; rr--){
        const b = makeBlock(rnd(TYPES), rr, c);
        grid[rr][c] = b;
        b.el.style.transition = "none";
        b.el.style.transform = "translate(" + (c * cell) + "px," + ((rr - missing) * cell) + "px)";
        void b.el.offsetWidth;
        b.el.style.transition = "";
        place(b, true);
      }
      segBottom = r - 1;
    }
  }
}

/* ---------- 消去の波（効果の展開・誘爆・ダブルの2段階目まで処理） ----------
   mode "tier": 通常プレイ。消したブロックは連鎖ティア単価で得点。
   mode "bonus": クリアボーナス。爆弾1000点・巻き込みブロック80点。 */
async function clearWave(initialKeys, chain, mode, depth, preTriggered){
  const toClear = new Set();
  const triggered = new Set(preTriggered || []);
  const queue = [];
  const addKey = (k) => { if (!toClear.has(k)){ toClear.add(k); queue.push(k); } };
  for (const k of initialKeys) addKey(k);
  while (queue.length){
    const k = queue.shift();
    const parts = k.split(",");
    const r = +parts[0], c = +parts[1];
    const b = grid[r] && grid[r][c];
    if (!b || !b.special || triggered.has(b.id)) continue;
    triggered.add(b.id);
    if (b.special === "arrow"){
      lineCells(r, c, b.arrowDir).forEach(addKey);
    } else if (b.special === "double"){
      boxCells(r, c, 2, false).forEach(addKey);
      pendingStage2.push({ r, c, rad: 3 });
    } else if (b.special === "bee"){
      const t = pickBeeTarget(b, toClear);
      if (t) addKey(t);
    } else if (b.special === "rainbow"){
      for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++){
        const bb = grid[rr][cc];
        if (bb && bb.type === b.type) addKey(key(rr, cc));
      }
    }
  }
  if (!toClear.size) return;
  const slateHits = collectSlateHits(toClear);
  /* 発動の予告表示: 消える範囲を一瞬光らせてから消す（因果を目で追えるように） */
  for (const k of toClear){
    const parts = k.split(",");
    const fb = grid[+parts[0]] && grid[+parts[0]][+parts[1]];
    if (fb) fb.el.classList.add("willclear");
  }
  for (const k of slateHits){
    const parts = k.split(",");
    const se = slateEls[+parts[0]] && slateEls[+parts[0]][+parts[1]];
    if (se) se.classList.add("willhit");
  }
  if (toClear.size || slateHits.size) await wait(230);
  for (const k of toClear){
    const parts = k.split(",");
    const b = grid[+parts[0]] && grid[+parts[0]][+parts[1]];
    if (!b) continue;
    score += mode === "bonus" ? (b.special ? 1000 : 80) : tierUnit(chain);
    b.el.classList.add("clearing");
  }
  updateHUD();
  await wait(180);
  for (const k of toClear){
    const parts = k.split(",");
    const b = grid[+parts[0]] && grid[+parts[0]][+parts[1]];
    if (b){ collected[b.type]++; b.el.remove(); grid[+parts[0]][+parts[1]] = null; }
  }
  applySlateDamage(slateHits, chain, mode);
  applyGravity();
  await wait(240);
  if (pendingStage2.length && depth < 4){
    const centers = pendingStage2;
    pendingStage2 = [];
    const s2 = new Set();
    for (const ctr of centers) boxCells(ctr.r, ctr.c, ctr.rad, true).forEach(k => s2.add(k));
    await clearWave(s2, chain, mode, depth + 1, null);
  }
}

/* ---------- 盤面解決（マッチ→特殊生成→消去→連鎖） ---------- */
async function resolveBoard(pref){
  let chain = 1;
  let preferred = pref || null;
  while (true){
    const groups = analyzeMatches();
    if (!groups.length) break;
    const clearSet = new Set();
    const gens = [];
    for (const g of groups){
      let genCell = null;
      if (g.kind) genCell = pickGenCell(g, preferred);
      if (genCell) gens.push({ cell: genCell, kind: g.kind, arrowDir: g.arrowDir });
      for (const cl of g.cellsList){
        if (!genCell || cl.r !== genCell.r || cl.c !== genCell.c) clearSet.add(key(cl.r, cl.c));
      }
    }
    for (const gen of gens){
      const b = grid[gen.cell.r][gen.cell.c];
      if (b && !b.special){
        b.special = gen.kind;
        if (gen.kind === "arrow") b.arrowDir = gen.arrowDir;
        renderBlock(b);
        b.el.classList.add("born");
        setTimeout(() => b.el.classList.remove("born"), 1250);
      }
    }
    if (gens.length){
      toast(spName(gens[0].kind) + "ができた！");
      say(SP_SHORT[gens[0].kind], true);
      /* 初めて生まれた種類は、ポップを見せてから説明カードで遊びを止めて教える */
      let waitedPop = false;
      for (const gen of gens){
        if (seenSpecials.has(gen.kind)) continue;
        seenSpecials.add(gen.kind);
        if (!waitedPop){ await wait(500); waitedPop = true; }
        const gb = grid[gen.cell.r][gen.cell.c];
        await showExplainCard(gen.kind, gb ? gb.type : 0, gen.arrowDir);
      }
    } else if (chain >= 2){
      say(chain + "れんさ！すごい！", true);
      toast(chain + " れんさ！");
    }
    if (chain >= 2) showChain(chain);
    await clearWave(clearSet, chain, "tier", 0, null);
    preferred = null;
    chain++;
  }
}

/* ---------- ヒント表示（しばらく操作しないと有効手のペアが光る） ---------- */
function clearHint(){
  if (hintPair){
    for (const p of [hintPair.a, hintPair.b]){
      const b = grid[p.r] && grid[p.r][p.c];
      if (b) b.el.classList.remove("hint");
    }
    hintPair = null;
  }
}
function showHint(){
  if (hintPair) return;
  const moves = findValidMoves();
  if (!moves.length) return;
  hintPair = moves[0];
  for (const p of [hintPair.a, hintPair.b]){
    const b = grid[p.r][p.c];
    if (b) b.el.classList.add("hint");
  }
}
setInterval(() => {
  if (busy || hintPair || anyOverlayOpen()) return;
  if (Date.now() - lastActionAt >= 3000) showHint();
}, 400);

/* ---------- プレイアイテム ---------- */
/* ハンマー用の単純除去（特殊ブロックでも効果は発動しない） */
async function removePlain(keys){
  const slateHits = collectSlateHits(keys);
  for (const k of keys){
    const parts = k.split(",");
    const b = grid[+parts[0]] && grid[+parts[0]][+parts[1]];
    if (!b) continue;
    collected[b.type]++;
    score += tierUnit(1);
    b.el.classList.add("clearing");
  }
  updateHUD();
  await wait(180);
  for (const k of keys){
    const parts = k.split(",");
    const b = grid[+parts[0]] && grid[+parts[0]][+parts[1]];
    if (b){ b.el.remove(); grid[+parts[0]][+parts[1]] = null; }
  }
  applySlateDamage(slateHits, 1, "tier");
  applyGravity();
  await wait(200);
}
async function useHammer(r, c){
  if (busy) return;
  busy = true;
  deselect();
  clearHint();
  if (isSlate(r, c)){
    applySlateDamage(new Set([key(r, c)]), 1, "tier");
    await wait(200);
    applyGravity();
    await wait(200);
  } else if (grid[r][c]){
    toast("ハンマー！");
    await removePlain(new Set([key(r, c)]));
  }
  await resolveBoard(null);
  await finishTurn();
  lastActionAt = Date.now();
  busy = false;
}
async function useShuffleItem(){
  if (busy) return;
  busy = true;
  deselect();
  clearHint();
  toast("シャッフル！");
  say("シャッフルするね！");
  shuffleBoard();
  await wait(150);
  await finishTurn();
  lastActionAt = Date.now();
  busy = false;
}

/* ---------- 特殊ブロック同士・特殊×通常の入れ替え発動 ---------- */
async function activateSwap(na, nb){
  const sp = [na, nb].filter(b => b && b.special);
  if (sp.length === 1){
    const s = sp[0];
    toast(spName(s.special) + "！");
    say(spName(s.special) + "、発動！", true);
    if (s.special === "rainbow"){
      /* レインボー×通常ブロック: 入れ替えた相手の種類を全消しする */
      const partner = s === na ? nb : na;
      const T = partner.type;
      const initial = new Set([key(s.r, s.c)]);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
        const b = grid[r][c];
        if (b && b.type === T) initial.add(key(r, c));
      }
      await clearWave(initial, 1, "tier", 0, new Set([s.id]));
    } else if (s.special === "bee"){
      const target = pickBeeTarget(s, new Set());
      if (target){
        await flyBee(s, target);
        await clearWave(new Set([key(s.r, s.c), target]), 1, "tier", 0, new Set([s.id]));
      } else {
        await clearWave(new Set([key(s.r, s.c)]), 1, "tier", 0, new Set([s.id]));
      }
    } else {
      await clearWave(new Set([key(s.r, s.c)]), 1, "tier", 0, null);
    }
    return;
  }
  const s1 = sp[0], s2 = sp[1];
  const rb = sp.find(b => b.special === "rainbow");
  if (rb && sp.every(b => b.special === "rainbow")){
    toast("レインボー×レインボー！");
    say("ぜんぶ消えた！", true);
    const all = new Set();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c]) all.add(key(r, c));
    await clearWave(all, 1, "tier", 0, new Set([s1.id, s2.id]));
    return;
  }
  if (rb){
    const other = sp.find(b => b !== rb);
    const T = other.type;
    toast("レインボー×" + spName(other.special) + "！");
    say("すごい組み合わせ！", true);
    const initial = new Set([key(rb.r, rb.c), key(other.r, other.c)]);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      const b = grid[r][c];
      if (b && b !== other && b.type === T && !b.special){
        b.special = other.special;
        if (other.special === "arrow") b.arrowDir = rnd(2) === 0 ? "h" : "v";
        renderBlock(b);
        b.el.classList.add("born");
        setTimeout(() => b.el.classList.remove("born"), 1250);
        initial.add(key(r, c));
      }
    }
    await clearWave(initial, 1, "tier", 0, new Set([rb.id]));
    return;
  }
  const kinds = sp.map(b => b.special);
  if (kinds.includes("arrow") && kinds.includes("double")){
    const ctr = sp.find(b => b.special === "double");
    toast("やじるし×ダブル！");
    const s = new Set();
    for (let d = -1; d <= 1; d++){
      lineCells(ctr.r + d, ctr.c, "h").forEach(k => s.add(k));
      lineCells(ctr.r, ctr.c + d, "v").forEach(k => s.add(k));
    }
    await clearWave(s, 1, "tier", 0, new Set([s1.id, s2.id]));
    return;
  }
  if (kinds.every(k => k === "arrow")){
    toast("やじるし×やじるし！");
    const s = new Set([...lineCells(s1.r, s1.c, "h"), ...lineCells(s1.r, s1.c, "v")]);
    await clearWave(s, 1, "tier", 0, new Set([s1.id, s2.id]));
    return;
  }
  if (kinds.every(k => k === "double")){
    toast("ダブル×ダブル！");
    pendingStage2.push({ r: s1.r, c: s1.c, rad: 4 });
    await clearWave(boxCells(s1.r, s1.c, 3, true), 1, "tier", 0, new Set([s1.id, s2.id]));
    return;
  }
  /* ハチを含む組み合わせ: それぞれの効果がその場で発動する */
  toast("組み合わせ発動！");
  await clearWave(new Set([key(s1.r, s1.c), key(s2.r, s2.c)]), 1, "tier", 0, null);
}

/* ---------- 入れ替え ---------- */
async function trySwap(a, b){
  if (busy) return false;
  if (!grid[a.r][a.c] || !grid[b.r][b.c]) return false;
  busy = true;
  deselect();
  const [ba, bb] = swapInGrid(a, b);
  if (ba) place(ba, true);
  if (bb) place(bb, true);
  await wait(190);
  const na = grid[a.r][a.c], nb = grid[b.r][b.c];
  if ((na && na.special) || (nb && nb.special)){
    movesLeft--;
    updateHUD();
    await activateSwap(na, nb);
    await resolveBoard(null);
    await finishTurn();
    busy = false;
    return true;
  }
  if (!hasGroup()){
    const [ca, cb] = swapInGrid(a, b);
    if (ca) place(ca, true);
    if (cb) place(cb, true);
    await wait(190);
    busy = false;
    return false;   /* マッチなし: 手数を消費せず戻る */
  }
  movesLeft--;
  updateHUD();
  await resolveBoard([{ r: b.r, c: b.c }, { r: a.r, c: a.c }]);
  await finishTurn();
  busy = false;
  return true;
}
async function finishTurn(){
  lastActionAt = Date.now();
  clearHint();
  if (goalsMet()){ await onClear(); return; }
  if (movesLeft <= 0){ onOutOfMoves(); return; }
  if (findValidMoves().length === 0 && !boardHasSpecial()){
    toast("手がなくなったのでシャッフル！");
    say("シャッフルするね！");
    shuffleBoard();
    await wait(60);
  }
  say("がんばれ！");
}

/* ---------- クリア/失敗 ---------- */
async function runClearBonus(n){
  const normals = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const b = grid[r][c];
    if (b && !b.special) normals.push(b);
  }
  for (let i = normals.length - 1; i > 0; i--){ const j = rnd(i + 1); [normals[i], normals[j]] = [normals[j], normals[i]]; }
  const picks = normals.slice(0, Math.min(n, normals.length));
  const before = score;
  for (const b of picks){
    if (rnd(2) === 0){ b.special = "arrow"; b.arrowDir = rnd(2) === 0 ? "h" : "v"; }
    else b.special = "double";
    renderBlock(b);
    b.el.classList.add("born");
    setTimeout(() => b.el.classList.remove("born"), 1250);
  }
  if (picks.length){
    bonusBannerEl.classList.add("show");   /* 爆発が終わるまで「クリアボーナス！」を出し続ける */
    toast("のこり手数ボーナス！");
    say("ボーナス！爆弾がさくれつ！", true);
    updateHUD();
    await wait(550);
    for (const b of picks){
      if (grid[b.r][b.c] !== b) continue;   /* 誘爆で発動済みなら二重に数えない */
      await clearWave(new Set([key(b.r, b.c)]), 1, "bonus", 0, null);
    }
    bonusBannerEl.classList.remove("show");
  }
  return score - before;
}
async function onClear(){
  clearedStages.add(stage);
  const leftMoves = movesLeft;
  say("クリア！やったね！", true);
  let bonus = 0;
  if (leftMoves > 0) bonus = await runClearBonus(leftMoves);
  document.getElementById("clearDetail").innerHTML =
    STAGES[stage].goals.map(g => goalText(g) + " ✓").join("<br>") +
    "<br>スコア " + score + " 点" + (bonus > 0 ? "<br>のこり手数ボーナス +" + bonus + " 点（爆弾" + leftMoves + "個）" : "");
  document.getElementById("nextBtn").style.display = stage < STAGES.length - 1 ? "" : "none";
  document.getElementById("clearOverlay").classList.add("show");
  updateHUD();
}
/* 手数切れ: まずコンティニューを提示し、断られたら失敗確定 */
function onOutOfMoves(){
  say("手数がなくなった…");
  document.getElementById("continueDetail").innerHTML =
    STAGES[stage].goals.map(g => goalText(g)).join("<br>") +
    "<br>広告を見ると +5手 で続けられます";
  document.getElementById("continueOverlay").classList.add("show");
}
function onFail(){
  say("つぎはできるよ！");
  document.getElementById("failDetail").innerHTML =
    STAGES[stage].goals.map(g => goalText(g)).join("<br>") +
    "<br>スコア " + score + " 点";
  document.getElementById("failOverlay").classList.add("show");
}

/* ---------- 選択・入力 ---------- */
function select(r, c){
  deselect();
  selected = { r, c };
  const b = grid[r][c];
  if (b) b.el.classList.add("selected");
}
function deselect(){
  if (selected){
    const b = grid[selected.r] && grid[selected.r][selected.c];
    if (b) b.el.classList.remove("selected");
  }
  selected = null;
}
function cellFromEvent(e){
  const rect = boardEl.getBoundingClientRect();
  const x = (e.clientX - rect.left), y = (e.clientY - rect.top);
  const c = Math.floor(x / cell), r = Math.floor(y / cell);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return { r, c };
}
let pStart = null, pDragged = false;
boardEl.addEventListener("pointerdown", e => {
  lastActionAt = Date.now();
  clearHint();
  if (busy) return;
  const p = cellFromEvent(e);
  if (!p) return;
  pStart = { p, x: e.clientX, y: e.clientY };
  pDragged = false;
});
boardEl.addEventListener("pointermove", e => {
  if (!pStart || busy || pDragged) return;
  const dx = e.clientX - pStart.x, dy = e.clientY - pStart.y;
  if (Math.hypot(dx, dy) < cell * 0.45) return;
  pDragged = true;
  const dir = Math.abs(dx) > Math.abs(dy) ? { r: 0, c: Math.sign(dx) } : { r: Math.sign(dy), c: 0 };
  const a = pStart.p, b = { r: a.r + dir.r, c: a.c + dir.c };
  pStart = null;
  if (b.r >= 0 && b.r < ROWS && b.c >= 0 && b.c < COLS) trySwap(a, b);
});
boardEl.addEventListener("pointerup", e => {
  if (!pStart) return;
  const wasDrag = pDragged;
  const p = pStart.p;
  pStart = null; pDragged = false;
  if (busy) return;
  if (hammerMode){
    if (!wasDrag){
      hammerMode = false;
      hammerBtn.classList.remove("active");
      useHammer(p.r, p.c);
    }
    return;
  }
  if (wasDrag) return;
  /* タップ式（石板マスは選択しない） */
  if (isSlate(p.r, p.c)){ deselect(); return; }
  if (!selected){ select(p.r, p.c); return; }
  if (selected.r === p.r && selected.c === p.c){ deselect(); return; }
  const dist = Math.abs(selected.r - p.r) + Math.abs(selected.c - p.c);
  if (dist === 1){ const a = selected; deselect(); trySwap(a, p); }
  else select(p.r, p.c);
});
boardEl.addEventListener("pointercancel", () => { pStart = null; pDragged = false; });

/* ---------- ステージ開始 ---------- */
function startStage(i){
  stage = i;
  score = 0;
  movesLeft = STAGES[i].moves;
  collected = [0, 0, 0, 0, 0];
  selected = null;
  pendingStage2 = [];
  hammerMode = false;
  hammerBtn.classList.remove("active");
  clearHint();
  boardEl.innerHTML = "";
  slateEls = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  initSlates(STAGES[i].slates || []);
  genBoard();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    if (!grid[r][c]) continue;   /* 石板マス */
    const t = grid[r][c].type;
    grid[r][c] = makeBlock(t, r, c);
    place(grid[r][c], false);
  }
  document.getElementById("clearOverlay").classList.remove("show");
  document.getElementById("failOverlay").classList.remove("show");
  document.getElementById("continueOverlay").classList.remove("show");
  bonusBannerEl.classList.remove("show");
  /* 開始前に目標を提示する */
  document.getElementById("introTitle").textContent = "面" + (i + 1);
  document.getElementById("introDetail").innerHTML =
    "もくひょう<br>" + STAGES[i].goals.map(g => goalLongText(g)).join("<br>") +
    "<br>手数 " + STAGES[i].moves;
  document.getElementById("introOverlay").classList.add("show");
  lastActionAt = Date.now();
  say("がんばれ！");
  updateHUD();
}
const btnWrap = document.getElementById("stageBtns");
STAGES.forEach((s, i) => {
  const btn = document.createElement("button");
  btn.className = "stage-btn";
  btn.textContent = "面" + (i + 1);
  btn.addEventListener("click", () => { if (!busy) startStage(i); });
  btnWrap.appendChild(btn);
});
document.getElementById("nextBtn").addEventListener("click", () => startStage(Math.min(stage + 1, STAGES.length - 1)));
document.getElementById("replayBtn1").addEventListener("click", () => startStage(stage));
document.getElementById("retryBtn").addEventListener("click", () => startStage(stage));
document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("introOverlay").classList.remove("show");
  lastActionAt = Date.now();
});
document.getElementById("explainBtn").addEventListener("click", closeExplain);
document.getElementById("explainOverlay").addEventListener("click", e => {
  if (e.target.id === "explainOverlay") closeExplain();
});
document.getElementById("continueBtn").addEventListener("click", () => {
  document.getElementById("continueOverlay").classList.remove("show");
  movesLeft += 5;   /* 試作では広告の代わりにそのまま+5手 */
  updateHUD();
  say("あと5手！がんばれ！", true);
  lastActionAt = Date.now();
  if (findValidMoves().length === 0 && !boardHasSpecial()){
    toast("手がなくなったのでシャッフル！");
    shuffleBoard();
  }
});
document.getElementById("giveUpBtn").addEventListener("click", () => {
  document.getElementById("continueOverlay").classList.remove("show");
  onFail();
});
hammerBtn.addEventListener("click", () => {
  if (busy || anyOverlayOpen()) return;
  hammerMode = !hammerMode;
  hammerBtn.classList.toggle("active", hammerMode);
  say(hammerMode ? "消したいマスをタップ！" : "がんばれ！");
  lastActionAt = Date.now();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  if (busy || anyOverlayOpen()) return;
  if (hammerMode){ hammerMode = false; hammerBtn.classList.remove("active"); }
  useShuffleItem();
});
window.addEventListener("resize", layout);

say("がんばれ！");
layout();
startStage(0);

/* ---------- 検証用デバッグAPI ---------- */
window.POKO = {
  state(){
    return {
      stage, score, movesLeft,
      target: (STAGES[stage].goals.find(g => g.kind === "score") || {}).target ?? null,
      goals: STAGES[stage].goals.map(g => ({
        kind: g.kind, type: g.type != null ? g.type : null,
        target: g.target, current: goalCurrent(g),
      })),
      collected: collected.slice(),
      slates: slates.map(row => row.slice()),
      slatesBroken,
      types: grid.map(row => row.map(b => b ? b.type : -1)),
      specials: grid.map(row => row.map(b => b
        ? (b.special ? (b.special === "arrow" ? "arrow:" + b.arrowDir : b.special) : null)
        : null)),
      filled: grid.flat().filter(Boolean).length,
    };
  },
  hintCells(){
    return hintPair ? [hintPair.a, hintPair.b] : [];
  },
  findValidMoves,
  findInvalidSwap,
  cellPoint(r, c){
    const rect = boardEl.getBoundingClientRect();
    return { x: rect.left + (c + 0.5) * cell, y: rect.top + (r + 0.5) * cell };
  },
  boardRect(){
    const rect = boardEl.getBoundingClientRect();
    return { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, cell };
  },
  isBusy: () => busy,
  /* 決め打ちの盤面を置く（検証専用）: spec = {types, specials, slates, moves, score, stage}
     slates は [[r,c],...]。省略時はステージ定義の配置を使う。石板マスにはブロックを置かない。 */
  debugSetup(spec){
    if (spec.stage != null) stage = spec.stage;
    boardEl.innerHTML = "";
    slateEls = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    initSlates(spec.slates != null ? spec.slates : (STAGES[stage].slates || []));
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    pendingStage2 = [];
    collected = [0, 0, 0, 0, 0];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      if (isSlate(r, c)) continue;
      const b = makeBlock(spec.types[r][c], r, c);
      const sp = spec.specials && spec.specials[r] ? spec.specials[r][c] : null;
      if (sp){
        if (sp.indexOf("arrow") === 0){ b.special = "arrow"; b.arrowDir = sp.split(":")[1] === "v" ? "v" : "h"; }
        else b.special = sp;
        renderBlock(b);
      }
      grid[r][c] = b;
      place(b, false);
    }
    score = spec.score != null ? spec.score : 0;
    movesLeft = spec.moves != null ? spec.moves : STAGES[stage].moves;
    selected = null;
    busy = false;
    hammerMode = false;
    hammerBtn.classList.remove("active");
    clearHint();
    lastActionAt = Date.now();
    document.getElementById("clearOverlay").classList.remove("show");
    document.getElementById("failOverlay").classList.remove("show");
    document.getElementById("continueOverlay").classList.remove("show");
    document.getElementById("introOverlay").classList.remove("show");
    say("がんばれ！");
    updateHUD();
  },
};
</script>
</body>
