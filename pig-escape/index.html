    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}

    <circle cx="79.4" cy="53" r="1.8" fill="#c9506c"/>
    <circle cx="60" cy="45" r="2.4" fill="#59303a"/>
    <rect x="30" y="72" width="7" height="8" rx="3" fill="#f28ba0"/>
    <rect x="58" y="72" width="7" height="8" rx="3" fill="#f28ba0"/>
  </svg>`;
}

/* ----- core slide logic (same as solver) ----- */
function slideDest(p, state) {
  const [dx, dy] = DIRS[p.d];
  const occ = new Set();
  state.forEach((q, j) => { if (q !== p && !q.out) occ.add(q.y * W + q.x); });
  let cx = p.x, cy = p.y;
  for (;;) {
    const nx = cx + dx, ny = cy + dy;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) return { out: true, x: cx, y: cy };
    if (occ.has(ny * W + nx)) break;
    cx = nx; cy = ny;
  }
  if (cx === p.x && cy === p.y) return null;
  return { out: false, x: cx, y: cy };
}
function canMove(p, state) { return slideDest(p, state) !== null; }

/* ----- screens ----- */
const $ = id => document.getElementById(id);
function showTitle() {
  $('screen-game').style.display = 'none';
  $('screen-title').style.display = 'block';
  $('overlay').classList.remove('show');
  renderLvGrid();
}
function renderLvGrid() {
  const g = $('lvgrid'); g.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    const locked = i > save.unlocked;
    b.className = 'lvbtn' + (locked ? ' locked' : '');
    const st = save.stars[i] || 0;
    b.innerHTML = (locked ? '🔒' : (i + 1)) +
      `<span class="stars">${[1,2,3].map(s => `<span class="${s <= st ? '' : 'off'}">★</span>`).join('')}</span>`;
    if (!locked) b.onclick = () => startLevel(i);
    g.appendChild(b);
  });
}

function startLevel(idx) {
  cur = idx;
  const lv = LEVELS[idx];
  W = lv.w; H = lv.h;
  taps = 0; stuck = 0; busy = false; window.__busy = false;
  $('screen-title').style.display = 'none';
  $('screen-game').style.display = 'block';
  $('overlay').classList.remove('show');
  $('chip-level').textContent = (idx + 1) + '面';
  $('msg').textContent = '';
  const board = $('board');
  board.style.backgroundSize = `${100 / W}% ${100 / H}%`;
  board.innerHTML = '';
  pigs = lv.pigs.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'pig'; el.dataset.i = i;
    el.innerHTML = pigSVG() + '<div class="arrow"></div>';
    el.addEventListener('click', () => tapPig(i));
    board.appendChild(el);
    return { x: p.x, y: p.y, d: p.d, out: false, el };
  });
  layoutAll(false);
  refreshHints();
  updateLeft();
}
function cellPct() { return 100 / W; }
function placeEl(p, animate) {
  const c = cellPct();
  p.el.style.width = c + '%'; p.el.style.height = c + '%';
  p.el.style.left = (p.x * c) + '%'; p.el.style.top = (p.y * c) + '%';
  const inner = p.el.querySelector('svg');
  inner.style.transform = `rotate(${ROT[p.d]}deg)`;
  const ar = p.el.querySelector('.arrow');
  const s = Math.max(9, c * 0.9);
  ar.style.borderLeft = (s * 0.55) + 'px solid transparent';
  ar.style.borderRight = (s * 0.55) + 'px solid transparent';
  ar.style.borderBottom = s + 'px solid ' + (p.el.classList.contains('movable') ? '#2fbf4f' : '#c3cbd1');
  ar.style.transform = `translate(-50%,-50%) rotate(${(ROT[p.d] + 90) % 360}deg) translateY(-${c * 1.9}px)`;
}
function layoutAll() { pigs.forEach(p => { if (!p.out) placeEl(p); }); }
function refreshHints() {
  pigs.forEach(p => {
    if (p.out) return;
    p.el.classList.toggle('movable', canMove(p, pigs));
  });
  layoutAll();
}
function updateLeft() {
  const n = pigs.filter(p => !p.out).length;
  $('chip-left').textContent = n;
  window.__remaining = n;
}

function tapPig(i) {
  if (busy) return;
  const p = pigs[i];
  if (!p || p.out) return;
  const dest = slideDest(p, pigs);
  taps++;
  if (!dest) {
    stuck++;
    sndStuck();
    p.el.classList.remove('shake'); void p.el.offsetWidth; p.el.classList.add('shake');
    $('msg').textContent = 'そのぶたは つかえてる！';
    return;
  }
  $('msg').textContent = '';
  busy = true; window.__busy = true;
  const [dx, dy] = DIRS[p.d];
  if (dest.out) {
    sndOut();
    // run one more cell beyond the edge, then fade
    const c = cellPct();
    let ex = p.x, ey = p.y;
    while (ex >= 0 && ey >= 0 && ex < W && ey < H) { ex += dx; ey += dy; }
    p.el.style.left = (ex * c) + '%'; p.el.style.top = (ey * c) + '%';
    p.out = true;
    setTimeout(() => { p.el.classList.add('gone'); }, 130);
  } else {
    sndMove();
    p.x = dest.x; p.y = dest.y;
    placeEl(p);
  }
  setTimeout(() => {
    busy = false; window.__busy = false;
    refreshHints(); updateLeft();
    if (pigs.every(q => q.out)) onClear();
  }, 240);
}

function onClear() {
  const lv = LEVELS[cur];
  let stars = 3;
  if (stuck >= 3 || taps > lv.par + 3) stars = 1;
  else if (stuck >= 1 || taps > lv.par) stars = 2;
  if ((save.stars[cur] || 0) < stars) save.stars[cur] = stars;
  if (save.unlocked < cur + 1 && cur + 1 < LEVELS.length) save.unlocked = cur + 1;
  storeSave();
  sndClear();
  $('clear-stars').innerHTML = [1, 2, 3].map(s => `<span class="${s <= stars ? '' : 'off'}">★</span>`).join('');
  $('clear-text').textContent = `${taps}タップで脱出（お手本は${lv.par}タップ）`;
  $('btn-next').style.display = (cur + 1 < LEVELS.length) ? '' : 'none';
  $('overlay').classList.add('show');
}

$('btn-play').onclick = () => startLevel(Math.min(save.unlocked, LEVELS.length - 1));
$('btn-back').onclick = showTitle;
$('btn-reset').onclick = () => startLevel(cur);
$('btn-tomap').onclick = showTitle;
$('btn-next').onclick = () => startLevel(cur + 1);
renderLvGrid();
</script>
</body>
