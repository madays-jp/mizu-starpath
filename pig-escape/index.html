<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ぶた脱出！｜ミズー牧場</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:#8ec9e8;
    color:#4a3520;
    overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  #app { max-width:480px; margin:0 auto; min-height:100vh; position:relative; }

  /* ---------- title screen ---------- */
  #screen-title { padding:18px 16px 30px; text-align:center;
    background:linear-gradient(#7ec3ec 0%, #a8d8f0 45%, #bfe3a8 45.2%, #a5d68f 100%); min-height:100vh; }
  .barn { font-size:15px; color:#fff; background:#c0453e; display:inline-block; padding:3px 14px;
    border-radius:12px; letter-spacing:.2em; box-shadow:0 2px 0 #93322d; }
  h1.title { font-size:44px; color:#fff; margin:10px 0 2px; letter-spacing:.04em;
    text-shadow:0 3px 0 #e2703a, 0 6px 12px rgba(0,0,0,.25); }
  .subtitle { color:#5b4632; font-weight:bold; font-size:15px; margin-bottom:6px;
    text-shadow:0 1px 0 rgba(255,255,255,.6); }
  .scene { position:relative; margin:6px auto 4px; width:300px; height:170px; }
  .scene .mizu { position:absolute; left:8px; bottom:6px; width:104px; }
  .scene .pigbig { position:absolute; right:16px; bottom:14px; width:150px; }
  .scene .fence { position:absolute; left:0; right:0; bottom:0; height:26px;
    background:repeating-linear-gradient(90deg,#b07a45 0 14px,#96622f 14px 28px);
    border-top:6px solid #c98d54; border-radius:4px; }
  .howto { background:rgba(255,255,255,.88); border-radius:14px; padding:10px 14px; margin:10px auto 14px;
    font-size:13.5px; line-height:1.65; max-width:400px; text-align:left; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .btn { display:inline-block; border:none; cursor:pointer; font-family:inherit; font-weight:bold;
    background:#ff8c42; color:#fff; font-size:20px; padding:12px 42px; border-radius:999px;
    box-shadow:0 4px 0 #d96f27; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #d96f27; }
  .btn.sub { background:#fff; color:#e2703a; font-size:15px; padding:9px 22px; box-shadow:0 3px 0 #d8cfc4; }
  .lvgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:400px; margin:14px auto 0; }
  .lvbtn { position:relative; border:none; cursor:pointer; font-family:inherit; font-weight:bold; font-size:17px;
    background:#fff; color:#5b4632; border-radius:12px; padding:9px 0 7px; box-shadow:0 3px 0 #cfc4b4; }
  .lvbtn.locked { background:#d9d2c6; color:#9a8f7d; box-shadow:none; }
  .lvbtn .stars { display:block; font-size:10px; color:#f5a623; height:13px; letter-spacing:1px; }
  .lvbtn .stars .off { color:#ddd3c2; }

  /* ---------- game screen ---------- */
  #screen-game { display:none; min-height:100vh; padding:10px 12px 22px;
    background:linear-gradient(#8ec9e8,#cdeffd 30%,#bfe3a8 30.2%,#a5d68f); }
  .ghead { display:flex; align-items:center; gap:8px; max-width:440px; margin:2px auto 8px; }
  .ghead .spacer { flex:1; }
  .chip { background:rgba(255,255,255,.92); border-radius:999px; padding:6px 13px; font-weight:bold; font-size:14px;
    box-shadow:0 2px 4px rgba(0,0,0,.12); }
  .iconbtn { border:none; cursor:pointer; background:rgba(255,255,255,.92); border-radius:999px;
    width:38px; height:38px; font-size:18px; box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #boardwrap { position:relative; max-width:440px; margin:0 auto; }
  #fence { position:absolute; inset:-13px; border-radius:16px; pointer-events:none; z-index:1;
    border:13px solid #b07a45;
    border-image:repeating-linear-gradient(90deg,#b07a45 0 26px,#96622f 26px 52px) 13;
    box-shadow:0 4px 10px rgba(0,0,0,.25), inset 0 0 0 2px rgba(0,0,0,.08); }
  #board { position:relative; width:100%; border-radius:6px; z-index:2;
    background:
      linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px),
      radial-gradient(circle at 30% 20%, #9ccc7a, #86bd63 70%);
    background-color:#8fc473; }
  .pig { position:absolute; cursor:pointer; transition:left .22s ease-in, top .22s ease-in, opacity .25s;
    will-change:left,top; z-index:2; }
  .pig svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .pig .arrow { position:absolute; width:0; height:0; left:50%; top:50%; z-index:3; pointer-events:none;
    transition:transform .22s ease-in; }
  .pig.movable .arrow { filter:drop-shadow(0 0 3px rgba(255,255,255,.9)); }
  .pig.shake { animation:shake .3s; }
  @keyframes shake { 0%,100%{margin-left:0} 25%{margin-left:-4px} 75%{margin-left:4px} }
  .pig.gone { opacity:0; pointer-events:none; }
  .pig.sleeping svg { filter:saturate(.55) brightness(.97) drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .pig .zzz { position:absolute; right:-2px; top:-8px; font-size:15px; font-weight:bold; color:#3a6fd8;
    z-index:4; pointer-events:none; text-shadow:0 1px 0 #fff; animation:zfloat 1.6s ease-in-out infinite; }
  @keyframes zfloat { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-4px) rotate(6deg)} }
  .pig.woke { animation:wokepop .35s ease-out; }
  @keyframes wokepop { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
  .pig.hint svg { animation:hintpulse 1.1s ease-in-out infinite; }
  @keyframes hintpulse { 0%,100%{filter:drop-shadow(0 0 2px rgba(255,255,120,.0))} 50%{filter:drop-shadow(0 0 9px rgba(255,240,130,.95))} }
  .hay { position:absolute; z-index:1; pointer-events:none; }
  .hay svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .gate { position:absolute; z-index:6; pointer-events:none; }
  .gate svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .gfoot { max-width:440px; margin:12px auto 0; text-align:center; font-size:13.5px; color:#4a5d23;
    background:rgba(255,255,255,.75); border-radius:12px; padding:8px 10px; line-height:1.6; }
  #msg { min-height:20px; font-weight:bold; color:#c0453e; }
  #note { color:#4a5d23; }

  /* ---------- clear overlay ---------- */
  #overlay { display:none; position:fixed; inset:0; background:rgba(60,40,20,.45); z-index:50;
    align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .card { background:#fffaf0; border-radius:22px; padding:26px 30px 22px; text-align:center; width:84%; max-width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,.3); animation:pop .25s ease-out; }
  @keyframes pop { from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1} }
  .card h2 { font-size:27px; color:#e2703a; margin-bottom:4px; }
  .card .bigstars { font-size:38px; color:#f5a623; letter-spacing:4px; margin:6px 0 2px; }
  .card .bigstars .off { color:#e3d9c8; }
  .card p { font-size:14px; color:#7a6a55; margin-bottom:14px; }
  .card .row { display:flex; gap:10px; justify-content:center; }
</style>

function beep(freq, dur, type, vol, when) {
  try {

    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}

/* ----- core model (identical rules to the solver) ----- */
function slideResult(posArr, i) {
  const p = L.pigs[i];
  const dx = DIRS[p.d][0], dy = DIRS[p.d][1];
  let cx = posArr[i] % L.w, cy = Math.floor(posArr[i] / L.w);

  for (;;) {

      const idx = (p.d === 'U' || p.d === 'D') ? cx : cy;
      const gc = L.gates.get(p.d + ',' + idx);
      if (gc === (p.color || 0)) return { dest: -1, blocker: null };
      return { dest: cy * L.w + cx, blocker: 'wall' };
    }
    const cell = ny * L.w + nx;
    if (L.obstacles.has(cell)) return { dest: cy * L.w + cx, blocker: 'obs' };
    if (occ.has(cell)) return { dest: cy * L.w + cx, blocker: occ.get(cell) };
    cx = nx; cy = ny;
  }
}

    const px = posArr[j] % L.w, py = Math.floor(posArr[j] / L.w);
    if (Math.abs(px - x) + Math.abs(py - y) === 1) res.push(j);
  }
  return res.sort((a, b) => a - b);
}

    const j = queue.shift();

    const cell = posArr[j];

}

  else if (r.dest !== start) { npos[i] = r.dest; effect = true; }
  if (typeof r.blocker === 'number' && L.pigs[r.blocker].type === 1 && !naw[r.blocker]) {
    naw[r.blocker] = true; woke = r.blocker; effect = true;
  }
  if (!effect) return null;
  let chain = [];
  if (npos[i] === -1 && L.pigs[i].type === 2) chain = runChain(npos, naw, start);
  return { pos: npos, awake: naw, woke, chain };
}

/* ----- screens ----- */
const $ = id => document.getElementById(id);
function showTitle() {
  $('screen-game').style.display = 'none';
  $('screen-title').style.display = 'block';
  $('overlay').classList.remove('show');
  renderLvGrid();
}
function renderLvGrid() {
  const g = $('lvgrid'); g.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    const locked = i > save.unlocked;
    b.className = 'lvbtn' + (locked ? ' locked' : '');
    const st = save.stars[i] || 0;
    b.innerHTML = (locked ? '🔒' : (i + 1)) +
      `<span class="stars">${[1,2,3].map(s => `<span class="${s <= st ? '' : 'off'}">★</span>`).join('')}</span>`;
    if (!locked) b.onclick = () => startLevel(i);
    g.appendChild(b);
  });
}

function startLevel(idx) {
  cur = idx;
  const lv = LEVELS[idx];
  const gateMap = new Map();
  if (lv.gates) for (const g of lv.gates) gateMap.set(g.side + ',' + g.idx, g.color || 0);
  L = {
    w: lv.w, h: lv.h, pigs: lv.pigs,
    obstacles: new Set((lv.obstacles || []).map(o => o.y * lv.w + o.x)),
    gates: gateMap, gateMode: !!lv.gates,
  };
  taps = 0; stuck = 0; busy = false; window.__busy = false;
  lastAct = Date.now();
  $('screen-title').style.display = 'none';
  $('screen-game').style.display = 'block';
  $('overlay').classList.remove('show');
  $('chip-level').textContent = (idx + 1) + '面';
  $('msg').textContent = '';
  $('note').textContent = lv.note || 'みどりの矢印のぶたは動けるよ。タップで走らせる！';
  const board = $('board');
  board.style.aspectRatio = lv.w + ' / ' + lv.h;
  board.style.backgroundSize = `${100 / lv.w}% ${100 / lv.h}%`;
  board.innerHTML = '';
  // obstacles
  (lv.obstacles || []).forEach(o => {
    const el = document.createElement('div');
    el.className = 'hay';
    el.innerHTML = haySVG();
    el.style.width = (100 / lv.w) + '%'; el.style.height = (100 / lv.h) + '%';
    el.style.left = (o.x * 100 / lv.w) + '%'; el.style.top = (o.y * 100 / lv.h) + '%';
    board.appendChild(el);
  });
  // gates
  (lv.gates || []).forEach(g => {
    const el = document.createElement('div');
    el.className = 'gate';
    el.innerHTML = gateSVG(g.color || 0);
    el.style.width = (100 / lv.w * 0.8) + '%'; el.style.height = (100 / lv.h * 0.8) + '%';
    if (g.side === 'U') { el.style.left = ((g.idx + 0.5) * 100 / lv.w) + '%'; el.style.top = '0'; el.style.transform = 'translate(-50%,-64%)'; }
    if (g.side === 'D') { el.style.left = ((g.idx + 0.5) * 100 / lv.w) + '%'; el.style.top = '100%'; el.style.transform = 'translate(-50%,-36%)'; }
    if (g.side === 'L') { el.style.left = '0'; el.style.top = ((g.idx + 0.5) * 100 / lv.h) + '%'; el.style.transform = 'translate(-64%,-50%)'; }
    if (g.side === 'R') { el.style.left = '100%'; el.style.top = ((g.idx + 0.5) * 100 / lv.h) + '%'; el.style.transform = 'translate(-36%,-50%)'; }
    board.appendChild(el);
  });
  // pigs
  pos = lv.pigs.map(p => p.y * lv.w + p.x);
  awake = lv.pigs.map(p => (p.type || 0) !== 1);
  pigEls = lv.pigs.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'pig'; el.dataset.i = i;
    el.innerHTML = pigSVG(p.color || 0, p.type === 2) + '<div class="arrow"></div>' +
      ((p.type === 1) ? '<div class="zzz">Zzz</div>' : '');
    el.addEventListener('click', () => tapPig(i));
    board.appendChild(el);
    return el;
  });
  layoutAll();
  refreshHints();
  updateLeft();
}
function placeEl(i) {
  const p = L.pigs[i], el = pigEls[i];
  const cw = 100 / L.w, ch = 100 / L.h;
  el.style.width = cw + '%'; el.style.height = ch + '%';
  el.style.left = ((pos[i] % L.w) * cw) + '%';
  el.style.top = (Math.floor(pos[i] / L.w) * ch) + '%';
  const inner = el.querySelector('svg');
  inner.style.transform = `rotate(${ROT[p.d]}deg)`;
  el.classList.toggle('sleeping', p.type === 1 && !awake[i]);
  const zzz = el.querySelector('.zzz');
  if (zzz) zzz.style.display = (p.type === 1 && !awake[i]) ? '' : 'none';
  const ar = el.querySelector('.arrow');
  const s = Math.max(8, cw * 0.85);
  ar.style.borderLeft = (s * 0.55) + 'px solid transparent';
  ar.style.borderRight = (s * 0.55) + 'px solid transparent';
  ar.style.borderBottom = s + 'px solid ' + (el.classList.contains('movable') ? '#2fbf4f' : '#c3cbd1');
  ar.style.transform = `translate(-50%,-50%) rotate(${(ROT[p.d] + 90) % 360}deg) translateY(-${cw * 1.9}px)`;
}
function layoutAll() { for (let i = 0; i < pos.length; i++) if (pos[i] >= 0) placeEl(i); }
function refreshHints() {
  for (let i = 0; i < pos.length; i++) {
    if (pos[i] < 0) continue;
    pigEls[i].classList.toggle('movable', applyTap(pos, awake, i) !== null);
  }
  layoutAll();
}
function updateLeft() {
  const n = pos.filter(v => v >= 0).length;
  $('chip-left').textContent = n;
  window.__remaining = n;
}
function clearHintGlow() { pigEls.forEach(el => el.classList.remove('hint')); }

function animateExit(i, delay) {
  const p = L.pigs[i], el = pigEls[i];
  const cw = 100 / L.w, ch = 100 / L.h;
  const dx = DIRS[p.d][0], dy = DIRS[p.d][1];
  let ex = pos[i] === -1 ? null : null;
  // start from the pig's last in-board cell: recompute from element's current style
  const curX = parseFloat(el.style.left) / cw, curY = parseFloat(el.style.top) / ch;
  let tx = curX, ty = curY;
  while (tx >= 0 && ty >= 0 && tx < L.w && ty < L.h) { tx += dx; ty += dy; }
  setTimeout(() => {
    el.style.left = (tx * cw) + '%'; el.style.top = (ty * ch) + '%';
    setTimeout(() => el.classList.add('gone'), 130);
  }, delay || 0);
}

function tapPig(i) {
  if (busy) return;
  clearHintGlow();
  lastAct = Date.now();
  if (pos[i] < 0) return;
  const p = L.pigs[i];
  taps++;
  if (p.type === 1 && !awake[i]) {
    stuck++;
    sndStuck();
    const el = pigEls[i];
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    $('msg').textContent = 'ねむってる… ほかのぶたが ぶつかると おきるよ';
    taps--; // a tap on a sleeper is not counted as a move attempt
    return;
  }
  const res = applyTap(pos, awake, i);
  if (!res) {
    stuck++;
    sndStuck();
    const el = pigEls[i];
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    $('msg').textContent = 'そのぶたは つかえてる！';
    return;
  }
  $('msg').textContent = '';
  busy = true; window.__busy = true;
  const mainOut = res.pos[i] === -1;
  const oldPos = pos[i];
  pos = res.pos; awake = res.awake;
  if (mainOut) { sndOut(); animateExit(i, 0); }
  else { sndMove(); placeEl(i); }
  // chain exits, staggered
  res.chain.forEach((j, k) => { setTimeout(() => sndOut(), 120 * (k + 1)); animateExit(j, 130 * (k + 1)); });
  const totalMs = 260 + res.chain.length * 140;
  if (res.woke >= 0) {
    setTimeout(() => {
      sndWake();
      const el = pigEls[res.woke];
      el.classList.remove('woke'); void el.offsetWidth; el.classList.add('woke');
      $('msg').textContent = 'ぶつかって おきた！';
      placeEl(res.woke);
    }, 230);
  }
  setTimeout(() => {
    busy = false; window.__busy = false;
    refreshHints(); updateLeft();
    if (pos.every(v => v < 0)) onClear();
  }, totalMs);
}

function onClear() {
  const lv = LEVELS[cur];
  let stars = 3;
  if (stuck >= 3 || taps > lv.par + 3) stars = 1;
  else if (stuck >= 1 || taps > lv.par) stars = 2;
  if ((save.stars[cur] || 0) < stars) save.stars[cur] = stars;
  if (save.unlocked < cur + 1 && cur + 1 < LEVELS.length) save.unlocked = cur + 1;
  storeSave();
  sndClear();
  $('clear-stars').innerHTML = [1, 2, 3].map(s => `<span class="${s <= stars ? '' : 'off'}">★</span>`).join('');
  $('clear-text').textContent = `${taps}タップで脱出（お手本は${lv.par}タップ）`;
  $('btn-next').style.display = (cur + 1 < LEVELS.length) ? '' : 'none';
  $('overlay').classList.add('show');
}

/* ----- idle hint: gently glow one movable pig after a while ----- */
setInterval(() => {
  if ($('screen-game').style.display === 'none') return;
  if (busy || $('overlay').classList.contains('show')) return;
  if (Date.now() - lastAct < HINT_IDLE_MS) return;
  if (pigEls.some(el => el.classList.contains('hint'))) return;
  for (let i = 0; i < pos.length; i++) {
    if (pos[i] < 0) continue;
    if (applyTap(pos, awake, i) !== null) { pigEls[i].classList.add('hint'); break; }
  }
}, 700);

$('btn-play').onclick = () => startLevel(Math.min(save.unlocked, LEVELS.length - 1));
$('btn-back').onclick = showTitle;
$('btn-reset').onclick = () => startLevel(cur);
$('btn-tomap').onclick = showTitle;
$('btn-next').onclick = () => startLevel(cur + 1);
renderLvGrid();
</script>
</body>
</html>
