<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ミズーのおたから脱出</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:#171221; color:#fff; overflow-x:hidden;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .screen { display:none; max-width:480px; margin:0 auto; padding:12px 12px 28px; }
  .screen.active { display:block; }

  /* ---------- title / select ---------- */
  .game-title {
    text-align:center; font-size:30px; font-weight:900; letter-spacing:.04em;
    color:#ffd94d; text-shadow:0 2px 0 #a86e00, 0 4px 14px rgba(0,0,0,.6); margin:6px 0 2px;
  }
  .game-sub { text-align:center; font-size:13px; color:#cfc4e8; margin-bottom:10px; }
  .scene-wrap { border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.55); border:3px solid #4a3a1e; }
  .scene-wrap svg { display:block; width:100%; height:auto; }
  .howto {
    background:#241b38; border:2px solid #3d2f5c; border-radius:12px;
    padding:10px 12px; font-size:13px; line-height:1.65; color:#e8e2f7; margin:12px 0;
  }
  .howto b { color:#ffd94d; }
  .tabs { display:flex; gap:6px; margin:10px 0; }
  .tab {
    flex:1; padding:10px 2px; border-radius:10px; border:2px solid #3d2f5c; background:#241b38;
    color:#cfc4e8; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .tab.active { background:#ffd94d; color:#4a3200; border-color:#ffd94d; }
  .daily-date { text-align:center; font-size:12px; color:#9f92c4; margin:2px 0 8px; min-height:15px; }
  .stage-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .stage-btn {
    aspect-ratio:1; border-radius:12px; border:2px solid #3d2f5c; background:#2b2145;
    color:#fff; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px;
  }
  .stage-btn .s-stars { font-size:10px; color:#ffd94d; letter-spacing:1px; min-height:12px; }
  .stage-btn .s-opt { font-size:9px; color:#9f92c4; font-weight:400; }
  .stage-btn.cleared { border-color:#ffd94d; background:#3a2c14; }

  /* ---------- play ---------- */
  .play-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .icon-btn {
    width:44px; height:44px; border-radius:12px; border:2px solid #3d2f5c; background:#241b38;
    color:#fff; font-size:19px; cursor:pointer; flex:none; font-family:inherit;
  }
  .stage-name { flex:1; font-size:16px; font-weight:800; color:#ffd94d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .comment-row { display:flex; align-items:flex-end; gap:8px; margin-bottom:10px; }
  .mizu-face { width:54px; height:54px; flex:none; border-radius:50%; background:#ffe9c9; border:2px solid #a86e00; overflow:hidden; }
  .mizu-face svg { width:100%; height:100%; }
  .bubble {
    position:relative; flex:1; background:#fff; color:#333; border-radius:12px;
    padding:8px 10px; font-size:13px; line-height:1.5; min-height:40px;
  }
  .bubble::before {
    content:""; position:absolute; left:-7px; bottom:12px; width:14px; height:14px;
    background:#fff; transform:rotate(45deg);
  }
  .board-outer {
    background:linear-gradient(180deg,#4c3a22,#33260f);
    border-radius:14px; padding:10px 10px 4px; box-shadow:0 10px 26px rgba(0,0,0,.6), inset 0 2px 0 #7a5c2e;
    margin:0 auto;
  }
  #board {
    position:relative; margin:0 auto;
    background:
      radial-gradient(ellipse at 50% 0%, #3b2f55 0%, #241b38 70%);
    border-radius:6px; overflow:visible;
    box-shadow:inset 0 0 0 3px #191024, inset 0 6px 18px rgba(0,0,0,.7);
  }
  #board::before { /* stone cells */
    content:""; position:absolute; inset:0; border-radius:6px;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent calc(20% - 1px), rgba(0,0,0,.35) calc(20% - 1px), rgba(0,0,0,.35) 20%),
      repeating-linear-gradient(90deg, transparent 0, transparent calc(25% - 1px), rgba(0,0,0,.35) calc(25% - 1px), rgba(0,0,0,.35) 25%);
  }
  .exit-zone {
    position:absolute; left:25%; width:50%; bottom:-4px; height:10px;
    background:linear-gradient(180deg,#ffe98a,#ffb52e); border-radius:0 0 6px 6px;
    box-shadow:0 0 18px 6px rgba(255,205,60,.55); z-index:1;
  }
  .exit-label { text-align:center; font-size:12px; color:#ffd94d; padding:3px 0 5px; letter-spacing:.35em; font-weight:800; }
  .piece {
    position:absolute; border-radius:9px; cursor:grab; z-index:2;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -5px 0 rgba(0,0,0,.28), 0 4px 8px rgba(0,0,0,.45);
    transition:left .13s ease, top .13s ease;
    touch-action:none;
  }
  .piece.dragging { transition:none; cursor:grabbing; z-index:5; }
  .piece.selected { outline:3px solid #ffd94d; outline-offset:-1px; box-shadow:0 0 0 4px rgba(255,217,77,.35), inset 0 3px 0 rgba(255,255,255,.35), inset 0 -5px 0 rgba(0,0,0,.28), 0 4px 8px rgba(0,0,0,.45); }
  .piece.hinting { animation:hintPulse .45s ease-in-out 4 alternate; z-index:4; }
  @keyframes hintPulse { from { filter:brightness(1); } to { filter:brightness(1.65); } }
  .wood-0 { background:linear-gradient(180deg,#c98d4e,#a96f33), repeating-linear-gradient(0deg, transparent 0 14px, rgba(90,50,10,.25) 14px 16px); background-blend-mode:multiply; }
  .wood-1 { background:linear-gradient(180deg,#b87f43,#96622a), repeating-linear-gradient(90deg, transparent 0 14px, rgba(90,50,10,.25) 14px 16px); background-blend-mode:multiply; }
  .wood-2 { background:linear-gradient(180deg,#d29c58,#b57e3a), repeating-linear-gradient(0deg, transparent 0 10px, rgba(90,50,10,.22) 10px 12px); background-blend-mode:multiply; }
  .wood-3 { background:linear-gradient(180deg,#a9743a,#87591f), repeating-linear-gradient(90deg, transparent 0 10px, rgba(70,40,5,.28) 10px 12px); background-blend-mode:multiply; }
  .piece::after { /* corner studs */
    content:""; position:absolute; inset:5px; border-radius:6px; pointer-events:none;
    background:
      radial-gradient(circle 3px at 6px 6px, rgba(60,35,5,.55) 98%, transparent),
      radial-gradient(circle 3px at calc(100% - 6px) 6px, rgba(60,35,5,.55) 98%, transparent),
      radial-gradient(circle 3px at 6px calc(100% - 6px), rgba(60,35,5,.55) 98%, transparent),
      radial-gradient(circle 3px at calc(100% - 6px) calc(100% - 6px), rgba(60,35,5,.55) 98%, transparent);
  }
  .piece.treasure {
    background:linear-gradient(180deg,#ffe066 0%,#ffc61a 45%,#e69c00 55%,#ffb52e 100%);
    box-shadow:0 0 22px 4px rgba(255,197,26,.5), inset 0 3px 0 rgba(255,255,255,.65), inset 0 -6px 0 rgba(146,90,0,.45), 0 4px 10px rgba(0,0,0,.5);
    animation:treasureGlow 1.6s ease-in-out infinite alternate;
  }
  @keyframes treasureGlow { from { box-shadow:0 0 12px 2px rgba(255,197,26,.35), inset 0 3px 0 rgba(255,255,255,.65), inset 0 -6px 0 rgba(146,90,0,.45), 0 4px 10px rgba(0,0,0,.5);} to { box-shadow:0 0 26px 8px rgba(255,197,26,.65), inset 0 3px 0 rgba(255,255,255,.65), inset 0 -6px 0 rgba(146,90,0,.45), 0 4px 10px rgba(0,0,0,.5);} }
  .piece.treasure::before { /* chest band + gem */
    content:""; position:absolute; inset:0; border-radius:9px; pointer-events:none;
    background:
      linear-gradient(180deg, transparent 42%, rgba(146,90,0,.75) 42%, rgba(146,90,0,.75) 58%, transparent 58%);
  }
  .piece.treasure::after {
    content:""; position:absolute; left:50%; top:50%; width:26%; aspect-ratio:1;
    transform:translate(-50%,-50%) rotate(45deg); border-radius:22%;
    background:radial-gradient(circle at 35% 30%, #bffcff, #29b6f6 55%, #0277bd);
    box-shadow:0 0 10px 2px rgba(80,200,255,.8), inset 0 0 4px rgba(255,255,255,.9);
    border:3px solid #fff3b0;
  }
  .hint-arrow {
    position:absolute; z-index:6; pointer-events:none; font-size:34px; color:#ffd94d;
    text-shadow:0 0 8px rgba(255,180,0,.9), 0 2px 3px rgba(0,0,0,.7); display:none;
    animation:arrowBob .4s ease-in-out infinite alternate;
  }
  @keyframes arrowBob { from { transform:scale(1); opacity:.85; } to { transform:scale(1.22); opacity:1; } }

  .hud { display:flex; align-items:center; gap:8px; margin:12px 0 8px; }
  .hud .moves { font-size:15px; font-weight:800; }
  .hud .moves small { color:#9f92c4; font-weight:400; font-size:12px; }
  .hud .spacer { flex:1; }
  .tool-btn {
    min-width:64px; height:44px; padding:0 10px; border-radius:12px; border:2px solid #3d2f5c;
    background:#241b38; color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .tool-btn:disabled { opacity:.38; cursor:default; }
  .pad-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px; }
  .pad-note { font-size:11px; color:#9f92c4; text-align:center; margin-top:6px; }
  .pad-btn {
    width:52px; height:52px; border-radius:14px; border:2px solid #3d2f5c; background:#2b2145;
    color:#ffd94d; font-size:21px; cursor:pointer; font-family:inherit;
  }
  .pad-btn:active { background:#3d2f5c; }
  .pad-btn:disabled { opacity:.35; }

  /* ---------- clear overlay ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(10,6,20,.78); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay.show { display:flex; }
  .clear-card {
    background:linear-gradient(180deg,#2e2150,#1d1436); border:3px solid #ffd94d; border-radius:20px;
    max-width:400px; width:100%; padding:16px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.7); max-height:92vh; overflow-y:auto;
  }
  .clear-card h2 { color:#ffd94d; font-size:27px; margin-bottom:4px; text-shadow:0 2px 0 #a86e00; }
  .clear-card .c-sub { font-size:13px; color:#cfc4e8; margin-bottom:8px; }
  .clear-card svg.scene { width:100%; height:auto; border-radius:12px; }
  .stars-big { font-size:38px; color:#ffd94d; letter-spacing:6px; margin:8px 0 2px; text-shadow:0 0 16px rgba(255,197,26,.7); }
  .stars-big .off { color:#4c4270; text-shadow:none; }
  .clear-stats { font-size:14px; color:#e8e2f7; margin-bottom:12px; }
  .clear-btns { display:flex; gap:8px; }
  .clear-btns button {
    flex:1; height:48px; border-radius:12px; border:none; font-size:15px; font-weight:800;
    cursor:pointer; font-family:inherit;
  }
  .btn-next { background:#ffd94d; color:#4a3200; }
  .btn-sub { background:#3d2f5c; color:#fff; }
  .confetti { position:absolute; font-size:19px; animation:fall linear forwards; pointer-events:none; }
  @keyframes fall { to { transform:translateY(105vh) rotate(560deg); opacity:.4; } }
</style>
</head>

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, when, slideTo) {
  if (!save.sound) return;
  const ctx = ac(); if (!ctx) return;
  const t = ctx.currentTime + (when || 0);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

/* ---------------- daily selection ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dailyStages() {
  const seed = Number(todayStr().replace(/-/g, ''));
  const rnd = mulberry32(seed);
  const idx = DATA.pool.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, 10).map(i => DATA.pool[i]);
}

/* ---------------- solver (for hints) ---------------- */
function puzzleOf(pieces) {
  const groups = new Map();
  for (const p of pieces) {
    const k = p.w + 'x' + p.h;
    if (!groups.has(k)) groups.set(k, { w: p.w, h: p.h, count: 0 });
    groups.get(k).count++;
  }
  const keys = [...groups.keys()].sort((a, b) => (a === '2x2' ? -1 : b === '2x2' ? 1 : a < b ? -1 : 1));
  const shapes = [], ranges = [], byGroup = new Map(keys.map(k => [k, []]));
  for (const k of keys) {
    const g = groups.get(k);
    ranges.push({ start: shapes.length, count: g.count });
    for (let i = 0; i < g.count; i++) shapes.push({ w: g.w, h: g.h });
  }
  for (const p of pieces) byGroup.get(p.w + 'x' + p.h).push(p.y * BW + p.x);
  const start = [];
  for (const k of keys) start.push(...byGroup.get(k).sort((a, b) => a - b));
  return { shapes, ranges, start };
}
function solveFirstMove(pieces) {
  const pz = puzzleOf(pieces);
  const { shapes, ranges } = pz;
  const start = pz.start;
  if (start[0] === GOAL_POS) return null;
  const sk = start.join(',');
  const parent = new Map([[sk, null]]);
  let queue = [start], qkeys = [sk], budget = 1500000;
  while (queue.length) {
    const nq = [], nk = [];
    for (let qi = 0; qi < queue.length; qi++) {
      const pos = queue[qi], pk = qkeys[qi];
      const occ = new Int8Array(BW * BH).fill(-1);
      for (let i = 0; i < pos.length; i++) {
        const s = shapes[i], x = pos[i] % BW, y = (pos[i] / BW) | 0;
        for (let dy = 0; dy < s.h; dy++) for (let dx = 0; dx < s.w; dx++) occ[(y + dy) * BW + x + dx] = i;
      }
      for (let i = 0; i < pos.length; i++) {
        const s = shapes[i], x = pos[i] % BW, y = (pos[i] / BW) | 0;
        for (let d = 0; d < 4; d++) {
          const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
          if (nx < 0 || ny < 0 || nx + s.w > BW || ny + s.h > BH) continue;
          let ok = true;
          for (let dy = 0; dy < s.h && ok; dy++) for (let dx = 0; dx < s.w && ok; dx++) {
            const o = occ[(ny + dy) * BW + nx + dx];
            if (o !== -1 && o !== i) ok = false;
          }
          if (!ok) continue;
          const npos = pos.slice(); npos[i] = ny * BW + nx;
          const gr = ranges.find(g => i >= g.start && i < g.start + g.count);
          const seg = npos.slice(gr.start, gr.start + gr.count).sort((a, b) => a - b);
          for (let j = 0; j < gr.count; j++) npos[gr.start + j] = seg[j];
          const key = npos.join(',');
          if (parent.has(key)) continue;
          parent.set(key, { prev: pk, fromPos: pos[i], dir: d });
          if (npos[0] === GOAL_POS) {
            let k = key, first = null;
            while (parent.get(k)) { first = parent.get(k); k = first.prev; }
            return first; // {fromPos, dir}
          }
          nq.push(npos); nk.push(key);
          if (parent.size > budget) return null;
        }
      }
    }
    queue = nq; qkeys = nk;
  }
  return null;
}

function occupancy(exceptId) {
  const occ = new Array(BW * BH).fill(-1);
  for (const p of cur.pieces) {
    if (p.id === exceptId) continue;
    for (let dy = 0; dy < p.h; dy++) for (let dx = 0; dx < p.w; dx++) occ[(p.y + dy) * BW + p.x + dx] = p.id;
  }
  return occ;
}
// how many cells can piece p slide in dir d (max >= 0)
function slideRoom(p, d) {
  const occ = occupancy(p.id);
  const [dx, dy] = DIRS[d];
  let n = 0;
  for (let step = 1; step < 5; step++) {
    const nx = p.x + dx * step, ny = p.y + dy * step;
    if (nx < 0 || ny < 0 || nx + p.w > BW || ny + p.h > BH) break;
    let ok = true;
    for (let cy = 0; cy < p.h && ok; cy++) for (let cx = 0; cx < p.w && ok; cx++) {
      if (occ[(ny + cy) * BW + nx + cx] !== -1) ok = false;
    }
    if (!ok) break;
    n = step;
  }
  return n;
}

  cur.selectedId = id;
  for (const p of cur.pieces) p.el.classList.toggle('selected', p.id === id);
  if (id !== null && !silent) sfx.select();
  updateHud();
}

function applyMove(p, d, cells, silent, instant) {
  const from = { x: p.x, y: p.y };
  p.x += DIRS[d][0] * cells;
  p.y += DIRS[d][1] * cells;
  cur.undoStack.push({ id: p.id, from, steps: cells });
  cur.moves += cells;
  if (instant) {
    p.el.style.transition = 'none';
    positionPiece(p, false);
    void p.el.offsetWidth;
    p.el.style.transition = '';
  } else {
    positionPiece(p, true);
  }
  if (!silent) sfx.slide();
  updateHud();
  if (p.treasure && p.x === 1 && p.y === 3) {
    cur.locked = true;
    setTimeout(onClear, 260);
  }
}

function tryPadMove(d) {
  if (!cur || cur.locked || cur.selectedId === null) return;
  const p = cur.pieces[cur.selectedId];
  if (slideRoom(p, d) >= 1) { applyMove(p, d, 1); say('move'); }
  else { sfx.bump(); say('bump'); }
}
document.querySelectorAll('.pad-btn').forEach(b => {
  b.addEventListener('click', () => tryPadMove(Number(b.dataset.dir)));
});
window.addEventListener('keydown', (e) => {
  if (!cur || !$('screen-play').classList.contains('active')) return;
  const map = { ArrowRight: 0, ArrowLeft: 1, ArrowDown: 2, ArrowUp: 3 };
  if (e.key in map) { e.preventDefault(); tryPadMove(map[e.key]); }
});

/* drag */
function attachDrag(p) {
  const el = p.el;
  let drag = null;
  el.addEventListener('pointerdown', (e) => {
    if (!cur || cur.locked) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    drag = { sx: e.clientX, sy: e.clientY, axis: null, cells: 0, moved: false };
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.axis && Math.hypot(dx, dy) > 7) {
      drag.axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
      // screen-positive direction: x+ => dir 0 (right), y+ => dir 2 (down)
      drag.posDir = drag.axis === 'x' ? 0 : 2;
      drag.negDir = drag.axis === 'x' ? 1 : 3;
      drag.initDir = drag.axis === 'x' ? (dx > 0 ? 0 : 1) : (dy > 0 ? 2 : 3);
      drag.roomPos = slideRoom(p, drag.posDir);
      drag.roomNeg = slideRoom(p, drag.negDir);
    }
    if (!drag.axis) return;
    drag.moved = true;
    let off = drag.axis === 'x' ? dx : dy;
    off = Math.max(-drag.roomNeg * cell, Math.min(drag.roomPos * cell, off));
    drag.offPx = off;
    el.style.transform = drag.axis === 'x' ? `translate(${off}px,0)` : `translate(0,${off}px)`;
  });
  const finish = (e) => {
    if (!drag) return;
    const wasDrag = drag.moved && drag.axis;
    el.classList.remove('dragging');
    if (wasDrag) {
      const cells = Math.round((drag.offPx || 0) / cell);
      if (cells !== 0) {
        const d = cells > 0 ? drag.posDir : drag.negDir;
        el.style.transform = '';
        selectPiece(p.id, true);
        applyMove(p, d, Math.abs(cells), false, true);
        say('move');
      } else {
        el.style.transition = 'transform .12s ease';
        el.style.transform = 'translate(0,0)';
        setTimeout(() => { el.style.transition = ''; el.style.transform = ''; }, 130);
        if (slideRoom(p, drag.initDir) === 0) { sfx.bump(); say('bump'); }
      }
    } else {
      el.style.transform = '';
      selectPiece(p.id);
    }
    drag = null;
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
}

/* ---------------- tools ---------------- */
$('btn-undo').addEventListener('click', () => {
  if (!cur || cur.locked || !cur.undoStack.length) return;
  const last = cur.undoStack.pop();
  const p = cur.pieces[last.id];
  p.x = last.from.x; p.y = last.from.y;
  cur.moves -= last.steps;
  positionPiece(p, true);
  sfx.undo(); say('undo');
  updateHud();
});
$('btn-reset').addEventListener('click', () => { if (cur) { const d = cur.diff, i = cur.idx; openStage(d, i); } });

const hintArrowEl = $('hint-arrow');
function hideHintArrow() { hintArrowEl.style.display = 'none'; }
$('btn-hint').addEventListener('click', () => {
  if (!cur || cur.locked || cur.hints <= 0) return;
  const btn = $('btn-hint');
  btn.disabled = true;
  $('comment').textContent = '考え中…';
  setTimeout(() => {
    const mv = solveFirstMove(cur.pieces.map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h })));
    if (!mv) { $('comment').textContent = 'ヒントが見つからなかった…ごめんね。'; btn.disabled = false; return; }
    cur.hints--;
    const target = cur.pieces.find(p => (p.y * BW + p.x) === mv.fromPos);
    if (target) {
      selectPiece(target.id, true);
      target.el.classList.add('hinting');
      setTimeout(() => target.el.classList.remove('hinting'), 1900);
      const cx = (target.x + target.w / 2) * cell, cy = (target.y + target.h / 2) * cell;
      hintArrowEl.textContent = DIR_ARROW[mv.dir];
      hintArrowEl.style.left = (cx - 17 + DIRS[mv.dir][0] * cell * 0.55) + 'px';
      hintArrowEl.style.top = (cy - 20 + DIRS[mv.dir][1] * cell * 0.55) + 'px';
      hintArrowEl.style.display = 'block';
      setTimeout(hideHintArrow, 1900);
    }
    sfx.hint(); say('hint');
    updateHud();
  }, 30);
});

/* ---------------- clear ---------------- */
function starCount(moves, opt) {
  if (moves <= opt) return 3;
  if (moves <= Math.ceil(opt * 1.6)) return 2;
  return 1;
}
function onClear() {
  const st = cur.stage;
  const stars = starCount(cur.moves, st.opt);
  if ((save.stars[cur.key] || 0) < stars) save.stars[cur.key] = stars;
  if (!save.best[cur.key] || cur.moves < save.best[cur.key]) save.best[cur.key] = cur.moves;
  persist();
  sfx.clear();
  $('clear-stars').innerHTML = [1, 2, 3].map(i => i <= stars ? '★' : '<span class="off">★</span>').join('');
  $('clear-stats').textContent = cur.moves + ' 手でクリア！（最短 ' + st.opt + ' 手）';
  $('clear-sub').textContent = stars === 3 ? '最短クリア！すごい！' : 'やったね！一家みんなで大喜び！';
  $('btn-next').style.display = cur.idx + 1 < stageList(cur.diff).length ? '' : 'none';
  $('clear-overlay').classList.add('show');
  confetti();
}
function confetti() {
  const ov = $('clear-overlay');
  ov.querySelectorAll('.confetti').forEach(e => e.remove());
  const glyphs = ['⭐', '✨', '🎉', '💛'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = Math.random() * 96 + 'vw';
    s.style.top = (-4 - Math.random() * 10) + 'vh';
    s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    s.style.animationDelay = (Math.random() * 0.5) + 's';
    ov.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
}
$('btn-replay').addEventListener('click', () => { const d = cur.diff, i = cur.idx; openStage(d, i); });
$('btn-tolist').addEventListener('click', () => {
  $('clear-overlay').classList.remove('show');
  $('screen-play').classList.remove('active');
  $('screen-title').classList.add('active');
  curTab = cur ? cur.diff : curTab;
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('active', x.dataset.diff === curTab));
  cur = null;
  renderGrid();
});
$('btn-next').addEventListener('click', () => { if (cur) openStage(cur.diff, cur.idx + 1); });
$('btn-back').addEventListener('click', () => $('btn-tolist').click());
$('btn-sound').addEventListener('click', () => {
  save.sound = !save.sound; persist();
  $('btn-sound').textContent = save.sound ? '♪' : '✕';
  $('btn-sound').style.opacity = save.sound ? '1' : '.5';
  if (save.sound) sfx.select();
});
$('btn-sound').textContent = save.sound ? '♪' : '✕';
$('btn-sound').style.opacity = save.sound ? '1' : '.5';

/* debug/test handle */
window.GAME = { DATA, save, dailyStages, stageList, solveFirstMove, get cur() { return cur; }, openStage };

renderGrid();
layoutBoard();
</script>
