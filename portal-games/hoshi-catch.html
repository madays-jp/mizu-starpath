<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>ミズーのほしキャッチ</title>
<style>
  :root{
    --bg:#0d1430; --panel:#18204a; --panel2:#1f2a5e; --ink:#f4f6ff; --sub:#aeb9e8;
    --gold:#ffd94d; --gold2:#ffb52e; --pink:#ff7d9c; --line:#33407e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #1b2560 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:10px 10px calc(14px + env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none;
  }
  button{min-height:44px; font-family:inherit; cursor:pointer;}
  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:8px;}
  /* HUD */
  .hud{display:flex; align-items:stretch; gap:8px;}
  .hud .box{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:6px 10px; display:flex; flex-direction:column; justify-content:center; min-width:0;
  }
  .hud .scoreBox{flex:1.2;}
  .hud .lab{font-size:11px; color:var(--sub); letter-spacing:.06em; line-height:1;}
  .hud .val{font-size:24px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums;}
  .hud .bestVal{font-size:17px; font-weight:700;}
  .hearts{font-size:19px; letter-spacing:2px; line-height:1.3; white-space:nowrap;}
  .hearts .off{opacity:.22; filter:grayscale(1);}
  #muteBtn{
    background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px;
    font-size:19px; width:52px; padding:0;
  }
  .speedRow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); padding:0 2px;}
  .speedBar{flex:1; height:8px; background:#131a42; border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .speedFill{height:100%; width:0%; background:linear-gradient(90deg,#5ec8ff,var(--gold)); border-radius:99px; transition:width .3s linear;}
  /* Stage */
  .stage{position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.45);}
  canvas{display:block; width:100%; height:auto; touch-action:none; background:#0d1430;}
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:20px; background:rgba(10,14,40,.72); backdrop-filter:blur(2px);
  }
  .overlay[hidden]{display:none;}
  .overlay h1{margin:0; font-size:30px; font-weight:800; letter-spacing:.02em; text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .overlay h1 .star{color:var(--gold);}
  .overlay p{margin:0; font-size:14px; line-height:1.7; color:#dbe2ff;}
  .rules{display:flex; flex-direction:column; gap:5px; font-size:13.5px; background:rgba(24,32,74,.85); border:1px solid var(--line); border-radius:12px; padding:10px 16px;}
  .rules b{color:var(--gold);}
  .rules .bad{color:var(--pink); font-weight:700;}
  .bigBtn{
    background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#4a2c00; border:none; border-radius:99px;
    font-size:19px; font-weight:800; padding:12px 38px; box-shadow:0 4px 0 #a86e00, 0 8px 18px rgba(0,0,0,.35);
  }
  .bigBtn:active{transform:translateY(2px); box-shadow:0 2px 0 #a86e00;}
  .finalScore{font-size:46px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  .starsRate{font-size:34px; letter-spacing:6px; color:var(--gold); line-height:1;}
  .starsRate .off{color:#3c467c;}
  .rateMsg{font-size:15px; font-weight:700;}
  .newBest{background:var(--pink); color:#fff; font-size:12.5px; font-weight:800; border-radius:99px; padding:3px 12px;}
  .hint{font-size:12px; color:var(--sub);}
  .underRow{display:flex; justify-content:space-between; align-items:center; padding:0 2px;}
  .underRow .hint{flex:1;}
  #restartBtn{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:99px;
    font-size:14px; font-weight:700; padding:8px 18px; min-height:40px;
  }
  #restartBtn[disabled]{opacity:.4;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="box scoreBox"><span class="lab">スコア</span><span class="val" id="scoreVal">0</span></div>
    <div class="box"><span class="lab">ベスト</span><span class="val bestVal" id="bestVal">0</span></div>
    <div class="box"><span class="lab">ライフ</span><span class="hearts" id="heartsVal">❤️❤️❤️</span></div>
    <button id="muteBtn" type="button" aria-label="おと オン・オフ">🔊</button>
  </div>
  <div class="speedRow"><span>スピード</span><div class="speedBar"><div class="speedFill" id="speedFill"></div></div><span id="speedLab">Lv.1</span></div>

  <div class="stage">
    <canvas id="cv" width="400" height="600"></canvas>

    <div class="overlay" id="startOv">
      <h1><span class="star">★</span> ミズーの<br>ほしキャッチ</h1>
      <div class="rules">
        <div>⭐ ほし … <b>+10点</b></div>
        <div>🌟 金のほし … <b>+50点</b>（はやい！）</div>
        <div>🪨 いわ … <span class="bad">ライフ −1</span></div>
        <div>ほしを取り逃しても だいじょうぶ</div>
      </div>
      <p>ミズーを ゆびでドラッグして<br>落ちてくる ほしを キャッチしよう！</p>
      <button class="bigBtn" id="startBtn" type="button">▶ スタート</button>
      <span class="hint">時間がたつと どんどん速くなるよ</span>
    </div>

    <div class="overlay" id="overOv" hidden>
      <h1>ゲームオーバー</h1>
      <div class="starsRate" id="rateStars">★★★</div>
      <div class="rateMsg" id="rateMsg"></div>
      <div><span class="lab" style="font-size:12px;color:var(--sub)">スコア</span><div class="finalScore" id="finalScore">0</div></div>
      <div class="newBest" id="newBest" hidden>🎉 ベストスコア更新！</div>
      <div class="hint" id="overBest">ベスト：0</div>
      <button class="bigBtn" id="againBtn" type="button">↻ もう一度あそぶ</button>
    </div>
  </div>

  <div class="underRow">
    <span class="hint">ゆび（マウス）でミズーを左右にドラッグ</span>
    <button id="restartBtn" type="button" disabled>↻ リスタート</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ===== 基本設定 ===== */
var W=400, H=600, STEP=1/120; // 固定タイムステップ（120Hz）
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var mizuImg=document.getElementById('mizuImg');
var scoreEl=document.getElementById('scoreVal'), bestEl=document.getElementById('bestVal'),
    heartsEl=document.getElementById('heartsVal'), speedFill=document.getElementById('speedFill'),
    speedLab=document.getElementById('speedLab');
var startOv=document.getElementById('startOv'), overOv=document.getElementById('overOv');

/* ===== 記録（localStorage） ===== */
var LS_BEST='hosicatch_best_v1', LS_MUTE='hosicatch_muted_v1';
var best=0, muted=false;
try{ best=parseInt(localStorage.getItem(LS_BEST)||'0',10)||0; muted=localStorage.getItem(LS_MUTE)==='1'; }catch(e){}
bestEl.textContent=best;

/* ===== 音（WebAudio生成） ===== */
var AC=null, master=null, bgmTimer=null, bgmStep=0;
function ensureAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.5; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
function tone(freq,t0,dur,type,vol,slideTo){
  if(!AC||muted) return;
  var o=AC.createOscillator(), g=AC.createGain(), now=AC.currentTime+t0;
  o.type=type||'square'; o.frequency.setValueAtTime(freq,now);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,now+dur);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(vol||0.16,now+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g); g.connect(master); o.start(now); o.stop(now+dur+0.05);
}
function sfxCatch(){ tone(880,0,0.09,'square',0.14); tone(1318,0.06,0.12,'square',0.14); }
function sfxGold(){ tone(1046,0,0.08,'square',0.15); tone(1318,0.06,0.08,'square',0.15); tone(1568,0.12,0.16,'square',0.15); }
function sfxRock(){ tone(140,0,0.22,'sawtooth',0.22,60); tone(70,0,0.25,'square',0.18,40); }
function sfxOver(){ var n=[523,440,349,262]; for(var i=0;i<4;i++) tone(n[i],i*0.16,0.2,'triangle',0.2); }
var BGM=[262,330,392,523,392,330,392,440, 262,330,392,523,659,523,392,330];
function bgmTick(){
  if(!AC||muted||state!=='play') return;
  var f=BGM[bgmStep%BGM.length];
  tone(f,0,0.22,'triangle',0.055);
  if(bgmStep%2===0) tone(f/2,0,0.3,'sine',0.05);
  bgmStep++;
}
function startBgm(){ stopBgm(); bgmStep=0; bgmTimer=setInterval(bgmTick,240); }
function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }

/* ミュート切替 */
var muteBtn=document.getElementById('muteBtn');
function applyMute(){ muteBtn.textContent=muted?'🔇':'🔊'; if(master) master.gain.value=muted?0:0.5; try{localStorage.setItem(LS_MUTE,muted?'1':'0');}catch(e){} }
muteBtn.addEventListener('click',function(){ ensureAudio(); muted=!muted; applyMute(); });
applyMute();

/* ===== ゲーム状態（世代管理でリスタート残留を防ぐ） ===== */
var state='title'; // title | play | over
var gen=0;
var score, lives, elapsed, items, popups, playerX, targetX, spawnT, shake, flash, invuln, caught, finalScore;
var MIZU_W=104, MIZU_H=118, GROUND_Y=H-14, BASKET_Y=H-128;

function reset(){
  score=0; lives=3; elapsed=0; items=[]; popups=[];
  playerX=W/2; targetX=W/2; spawnT=0.55; shake=0; flash=0; invuln=0; caught=0; finalScore=0;
  updateHud();
}
function updateHud(){
  scoreEl.textContent=score;
  bestEl.textContent=Math.max(best,score);
  var h=''; for(var i=0;i<3;i++) h+= i<lives ? '❤️' : '<span class="off">🖤</span>';
  heartsEl.innerHTML=h;
  var lv=level();
  speedFill.style.width=Math.min(100,(lv-1)/9*100)+'%';
  speedLab.textContent='Lv.'+lv;
}
function level(){ return Math.min(10, 1+Math.floor(elapsed/12)); } // 12秒ごとにLvアップ
function speedMul(){ return 1 + (level()-1)*0.22; }                 // Lv10で約3倍
function spawnInterval(){ return Math.max(0.36, 0.92 - (level()-1)*0.062); }

/* 簡易決定的乱数（プレイごとに同じ種から開始） */
var rngS=123456789;
function rnd(){ rngS=(rngS*1664525+1013904223)>>>0; return rngS/4294967296; }

function spawnItem(forceType, forceX){
  var r=rnd(), type;
  if(forceType) type=forceType;
  else if(r<0.10) type='gold';
  else if(r<0.10+0.15+(level()-1)*0.012) type='rock';
  else type='star';
  var base=(150+rnd()*70)*speedMul();
  var vy= type==='gold' ? base*1.45 : base;
  items.push({type:type, x:(forceX!=null?forceX:26+rnd()*(W-52)), y:-26, vy:vy,
              rot:(rnd()-0.5)*0.6, vr:(rnd()-0.5)*1.6, size:type==='rock'?21:20});
}

function catchCheck(it){
  // カゴの位置（ミズーの頭上）に来たら判定
  return it.y>=BASKET_Y-6 && it.y<=BASKET_Y+26 && Math.abs(it.x-playerX)<=48;
}

function step(dt){
  if(state!=='play') return;
  elapsed+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*26);
  if(flash>0) flash=Math.max(0,flash-dt*2.4);
  if(invuln>0) invuln-=dt;

  // ミズーは目標へ滑らかに追随（固定ステップ内で決定的）
  playerX += (targetX-playerX)*Math.min(1,dt*18);
  if(playerX<MIZU_W/2-14) playerX=MIZU_W/2-14;
  if(playerX>W-MIZU_W/2+14) playerX=W-MIZU_W/2+14;

  // 出現
  spawnT-=dt;
  if(spawnT<=0){ spawnItem(); spawnT=spawnInterval()*(0.75+rnd()*0.5); }

  // 落下と判定
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];
    it.y+=it.vy*dt; it.rot+=it.vr*dt;
    if(catchCheck(it)){
      if(it.type==='rock'){
        if(invuln<=0){
          lives--; invuln=0.7; shake=9; flash=0.55; sfxRock();
          popups.push({x:it.x,y:BASKET_Y-34,txt:'ライフ −1',col:'#ff7d9c',t:0});
          updateHud();
          if(lives<=0){ gameOver(); }
        }
      }else{
        var pts= it.type==='gold'?50:10;
        score+=pts; caught++;
        if(it.type==='gold') sfxGold(); else sfxCatch();
        popups.push({x:it.x,y:BASKET_Y-34,txt:'+'+pts,col:it.type==='gold'?'#ffd94d':'#ffffff',t:0});
        updateHud();
      }
      items.splice(i,1); continue;
    }
    if(it.y>H+30) items.splice(i,1); // 取り逃し：ペナルティなし
  }
  for(var j=popups.length-1;j>=0;j--){ popups[j].t+=dt; popups[j].y-=34*dt; if(popups[j].t>0.85) popups.splice(j,1); }
}

function gameOver(){
  state='over'; finalScore=score; stopBgm(); sfxOver();
  var isBest=score>best;
  if(isBest){ best=score; try{localStorage.setItem(LS_BEST,String(best));}catch(e){} }
  bestEl.textContent=best;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('overBest').textContent='ベスト：'+best+' 点';
  document.getElementById('newBest').hidden=!isBest;
  var st= score>=750?3 : score>=400?2 : score>=150?1 : 0;
  var stars=''; for(var i=0;i<3;i++) stars+= i<st ? '★' : '<span class="off">★</span>';
  document.getElementById('rateStars').innerHTML=stars;
  document.getElementById('rateMsg').textContent=
    st===3?'すごい！ほしキャッチ名人！': st===2?'とっても上手！あと少しで名人！': st===1?'いい調子！金のほしを狙おう': 'まずは ほし10個を めざそう';
  overOv.hidden=false;
  document.getElementById('restartBtn').disabled=true;
}

function startGame(){
  gen++;                 // 世代を進める：旧ループ・旧状態は無効化
  reset(); rngS=123456789+gen*7919;
  state='play';
  startOv.hidden=true; overOv.hidden=true;
  document.getElementById('restartBtn').disabled=false;
  ensureAudio(); startBgm();
}

/* ===== 描画 ===== */
var bgStars=[];
for(var i=0;i<70;i++) bgStars.push({x:Math.random()*W,y:Math.random()*(H-90),r:Math.random()*1.6+0.4,p:Math.random()*6.28});
function drawStarShape(x,y,r,col){
  ctx.beginPath();
  for(var k=0;k<10;k++){
    var ang=-Math.PI/2+k*Math.PI/5, rr=k%2===0?r:r*0.48;
    var px=x+Math.cos(ang)*rr, py=y+Math.sin(ang)*rr;
    if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(90,55,0,.55)'; ctx.stroke();
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // 空
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#131c52'); g.addColorStop(0.7,'#0d1430'); g.addColorStop(1,'#0a0f28');
  ctx.fillStyle=g; ctx.fillRect(-12,-12,W+24,H+24);
  var t=performance.now()/1000;
  for(var i=0;i<bgStars.length;i++){ var s=bgStars[i];
    ctx.globalAlpha=0.35+0.3*Math.sin(t*1.7+s.p); ctx.fillStyle='#dfe7ff';
    ctx.fillRect(s.x,s.y,s.r,s.r); }
  ctx.globalAlpha=1;
  // 月
  ctx.beginPath(); ctx.arc(W-52,54,22,0,6.29); ctx.fillStyle='#f7ecc8'; ctx.fill();
  ctx.beginPath(); ctx.arc(W-62,48,19,0,6.29); ctx.fillStyle='#131c52'; ctx.fill();
  // 地面
  ctx.fillStyle='#1d2a63'; ctx.fillRect(-12,GROUND_Y,W+24,H-GROUND_Y+12);
  ctx.fillStyle='#2a3a85'; ctx.fillRect(-12,GROUND_Y,W+24,3);

  // 落下物
  for(var j=0;j<items.length;j++){ var it=items[j];
    ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot);
    if(it.type==='rock'){
      ctx.beginPath();
      ctx.moveTo(-it.size,-2); ctx.lineTo(-it.size*0.5,-it.size*0.8); ctx.lineTo(it.size*0.4,-it.size);
      ctx.lineTo(it.size,0); ctx.lineTo(it.size*0.55,it.size*0.8); ctx.lineTo(-it.size*0.45,it.size*0.85);
      ctx.closePath(); ctx.fillStyle='#8d8fa3'; ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle='#565870'; ctx.stroke();
      ctx.fillStyle='#a9abc0'; ctx.beginPath(); ctx.arc(-6,-6,4.5,0,6.29); ctx.fill();
    }else{
      if(it.type==='gold'){ ctx.shadowColor='#ffd94d'; ctx.shadowBlur=14; }
      drawStarShape(0,0,it.size, it.type==='gold'?'#ffd94d':'#ffe97a');
      ctx.shadowBlur=0;
      ctx.fillStyle='#7a5200'; ctx.beginPath(); ctx.arc(-4,-2,2.2,0,6.29); ctx.arc(5,-2,2.2,0,6.29); ctx.fill();
      ctx.strokeStyle='#7a5200'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(0.5,2,4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  // ミズー＋カゴ
  var mx=playerX, my=GROUND_Y-MIZU_H+8;
  if(mizuImg.complete && mizuImg.naturalWidth>0){
    if(invuln>0 && Math.floor(performance.now()/90)%2===0) ctx.globalAlpha=0.45;
    ctx.drawImage(mizuImg, mx-MIZU_W/2, my, MIZU_W, MIZU_H);
    ctx.globalAlpha=1;
  }else{
    ctx.font='64px sans-serif'; ctx.textAlign='center'; ctx.fillText('🧒',mx,GROUND_Y-8);
  }
  // カゴ（頭上・両手の先）
  var bx=mx, by=BASKET_Y;
  ctx.beginPath();
  ctx.moveTo(bx-50,by-12); ctx.lineTo(bx+50,by-12); ctx.lineTo(bx+38,by+16); ctx.lineTo(bx-38,by+16);
  ctx.closePath(); ctx.fillStyle='#c98a3d'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#8a5a1d'; ctx.stroke();
  ctx.strokeStyle='rgba(138,90,29,.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx-44,by-2); ctx.lineTo(bx+44,by-2); ctx.moveTo(bx-41,by+7); ctx.lineTo(bx+41,by+7); ctx.stroke();
  ctx.fillStyle='#a86e00'; ctx.fillRect(bx-53,by-17,106,7);

  // ポップアップ
  ctx.textAlign='center'; ctx.font='800 17px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  for(var p=0;p<popups.length;p++){ var pp=popups[p];
    ctx.globalAlpha=Math.max(0,1-pp.t/0.85);
    ctx.fillStyle=pp.col; ctx.fillText(pp.txt,pp.x,pp.y); }
  ctx.globalAlpha=1;

  if(flash>0){ ctx.fillStyle='rgba(255,60,80,'+(flash*0.35)+')'; ctx.fillRect(-12,-12,W+24,H+24); }
  ctx.restore();
}

/* ===== メインループ（固定タイムステップ） ===== */
var lastTs=0, acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs=ts;
  var frame=(ts-lastTs)/1000; lastTs=ts;
  if(frame>0.25) frame=0.25;
  acc+=frame;
  var myGen=gen;
  while(acc>=STEP){ step(STEP); acc-=STEP; if(myGen!==gen) break; }
  draw();
}
requestAnimationFrame(loop);

/* ===== 操作：ドラッグで左右移動 ===== */
var dragging=false;
function toLogicalX(clientX){
  var r=cv.getBoundingClientRect();
  return (clientX-r.left)/r.width*W;
}
cv.addEventListener('pointerdown',function(e){ dragging=true; cv.setPointerCapture(e.pointerId); targetX=toLogicalX(e.clientX); });
cv.addEventListener('pointermove',function(e){ if(dragging) targetX=toLogicalX(e.clientX); });
cv.addEventListener('pointerup',function(){ dragging=false; });
cv.addEventListener('pointercancel',function(){ dragging=false; });
document.addEventListener('keydown',function(e){
  if(state!=='play') return;
  if(e.key==='ArrowLeft') targetX=Math.max(0,targetX-34);
  if(e.key==='ArrowRight') targetX=Math.min(W,targetX+34);
});

/* ボタン */
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',function(){ if(state==='play') startGame(); });

reset();

/* 検証用フック（実プレイと同じ経路を通す） */
window.__hosicatch={
  start:startGame,
  state:function(){ return {state:state,score:score,lives:lives,elapsed:elapsed,level:level(),playerX:playerX,best:best,items:items.length,gen:gen,finalScore:finalScore,caught:caught}; },
  spawn:function(type,x){ spawnItem(type,x); },
  setTarget:function(x){ targetX=x; },
  stepFor:function(sec){ var n=Math.round(sec/STEP); for(var i=0;i<n;i++) step(STEP); },
  constants:{W:W,H:H,BASKET_Y:BASKET_Y}
};
})();
</script>
