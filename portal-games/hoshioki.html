<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ミズー一家のほしおき</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#10172e; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    color:#fff; min-height:100dvh;
  }
  .app {
    max-width:480px; margin:0 auto; min-height:100dvh; position:relative; overflow:hidden;
    background:
      radial-gradient(2px 2px at 24px 38px, #fff 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 130px 90px, #ffe9a8 50%, transparent 51%),
      radial-gradient(2px 2px at 300px 30px, #fff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 390px 120px, #fff 50%, transparent 51%),
      radial-gradient(1.8px 1.8px at 70px 170px, #dfe9ff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 210px 150px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 440px 200px, #ffe9a8 50%, transparent 51%),
      linear-gradient(180deg, #1b2650 0%, #2c3a6e 52%, #46548c 100%);
    background-size:480px 260px,480px 260px,480px 260px,480px 260px,480px 260px,480px 260px,480px 260px,100% 100%;
    padding:14px 8px 30px;
  }
  .screen { display:none; }
  .screen.active { display:block; animation:fadein .25s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }

  /* ---------- タイトル ---------- */
  .title-scene { width:100%; max-width:430px; margin:2px auto 0; display:block; }
  h1.game-title {
    text-align:center; font-size:34px; letter-spacing:.04em; margin-top:2px;
    background:linear-gradient(180deg,#fff3b0,#ffc93c 60%,#f5a623);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 rgba(90,50,0,.45));
  }
  .subtitle { text-align:center; font-size:14px; color:#dfe7ff; margin:6px 0 14px; }
  .btn {
    display:block; width:100%; max-width:340px; margin:10px auto; padding:14px 18px;
    font-family:inherit; font-size:18px; font-weight:700; color:#5a3a00;
    background:linear-gradient(180deg,#ffe082,#ffc93c); border:none; border-radius:999px;
    box-shadow:0 4px 0 #c47f17, 0 8px 16px rgba(0,0,0,.3); cursor:pointer;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #c47f17; }
  .btn.sub {
    background:linear-gradient(180deg,#ffffff,#dfe7ff); color:#33406e;
    box-shadow:0 4px 0 #8b99c4, 0 8px 16px rgba(0,0,0,.3); font-size:16px;
  }
  .howto {
    max-width:400px; margin:16px auto 0; background:rgba(255,255,255,.94); color:#3a3450;
    border-radius:16px; padding:14px 16px; font-size:14px; line-height:1.65;
  }
  .howto h2 { font-size:16px; color:#7a4d00; margin-bottom:6px; }
  .howto ul { padding-left:1.2em; }
  .mini-board { display:grid; grid-template-columns:repeat(4,34px); gap:0; margin:10px auto 4px; width:fit-content;
    border:3px solid #6b5878; border-radius:8px; overflow:hidden; }
  .mini-board div { width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:19px; }
  .mini-cap { text-align:center; font-size:12px; color:#8a7f9d; }

  /* ---------- ステージ選択 ---------- */
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .icon-btn {
    font-family:inherit; font-size:15px; font-weight:700; border:none; cursor:pointer;
    background:rgba(255,255,255,.92); color:#33406e; border-radius:999px; padding:9px 16px;
    box-shadow:0 3px 0 rgba(20,28,60,.45);
  }
  .icon-btn:active { transform:translateY(2px); box-shadow:none; }
  .topbar .spacer { flex:1; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab {
    flex:1; font-family:inherit; font-size:14px; font-weight:700; padding:10px 2px; border-radius:12px;
    border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#dfe7ff; cursor:pointer;
  }
  .tab small { display:block; font-size:11px; font-weight:400; opacity:.85; }
  .tab.on { background:linear-gradient(180deg,#ffe082,#ffc93c); color:#5a3a00; border-color:#ffc93c; }
  .stage-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .stage-btn {
    font-family:inherit; background:rgba(255,255,255,.95); border:none; border-radius:14px;
    padding:10px 2px 8px; cursor:pointer; color:#33406e; box-shadow:0 3px 0 rgba(20,28,60,.4);
    min-height:64px;
  }
  .stage-btn:active { transform:translateY(2px); box-shadow:none; }
  .stage-btn .no { font-size:19px; font-weight:800; display:block; }
  .stage-btn .st { font-size:12px; color:#f5a623; letter-spacing:1px; display:block; min-height:15px; }
  .stage-btn .st.none { color:#c6cde4; }
  .daily-note { text-align:center; font-size:13px; color:#dfe7ff; margin-bottom:10px; }

  /* ---------- プレイ ---------- */
  .comment-bar {
    display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.95);
    border-radius:16px; padding:6px 12px 6px 6px; margin:10px 0 12px; min-height:64px;
  }
  .comment-bar .face {
    width:52px; height:52px; flex:0 0 52px; border-radius:50%; overflow:hidden;
    background:linear-gradient(180deg,#bcd8ff,#e8f2ff); border:2px solid #ffc93c;
  }
  .comment-bar .face svg { width:100%; height:100%; }
  .comment-bar p { color:#3a3450; font-size:14px; line-height:1.5; }
  .board-wrap {
    background:linear-gradient(180deg,#fff8ec,#ffedcb); border-radius:18px; padding:6px;
    box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 2px 0 #fff;
    width:fit-content; margin:0 auto;
  }
  .board { display:grid; gap:0; touch-action:manipulation; }
  .cell {
    position:relative; border:0; padding:0; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
  }
  .cell .star-svg { width:82%; height:82%; pointer-events:none; filter:drop-shadow(0 2px 2px rgba(120,70,0,.45)); }
  .cell .cross { font-size:1.5em; color:rgba(90,74,106,.55); font-weight:700; pointer-events:none; line-height:1; }
  .cell.locked { cursor:default; }
  .cell.locked::after {
    content:""; position:absolute; right:4%; top:4%; width:22%; height:22%;
    background:#fff3b0; clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%);
    filter:drop-shadow(0 0 2px #f5a623);
  }
  .cell.bad { animation:shake .3s ease; }
  .cell.bad::before {
    content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 3px #ff5252; border-radius:4px;
    background:rgba(255,60,60,.18); pointer-events:none;
  }
  @keyframes shake { 0%,100%{transform:none;} 25%{transform:translateX(-2px);} 75%{transform:translateX(2px);} }
  .play-tools { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .tool-btn {
    font-family:inherit; font-size:15px; font-weight:700; border:none; cursor:pointer; border-radius:999px;
    padding:11px 18px; background:rgba(255,255,255,.92); color:#33406e; box-shadow:0 3px 0 rgba(20,28,60,.45);
    min-height:46px;
  }
  .tool-btn:active { transform:translateY(2px); box-shadow:none; }
  .tool-btn.hint { background:linear-gradient(180deg,#ffe082,#ffc93c); color:#5a3a00; box-shadow:0 3px 0 #c47f17; }
  .tool-btn:disabled { opacity:.45; }
  .progress-line { text-align:center; margin-top:10px; font-size:15px; color:#ffe9a8; font-weight:700; }

  /* ---------- クリア ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(10,14,34,.72); display:none;
    align-items:center; justify-content:center; z-index:20; padding:18px;
  }
  .overlay.show { display:flex; }
  .clear-card {
    background:linear-gradient(180deg,#fffdf4,#ffedcb); border-radius:22px; padding:18px 18px 20px;
    max-width:400px; width:100%; text-align:center; color:#3a3450;
    box-shadow:0 18px 40px rgba(0,0,0,.5); animation:pop .35s ease; position:relative; overflow:hidden;
  }
  @keyframes pop { from { transform:scale(.85); opacity:0;} to { transform:scale(1); opacity:1;} }
  .clear-card h2 { font-size:26px; color:#7a4d00; margin:4px 0 2px; }
  .clear-stars { font-size:34px; color:#f5a623; letter-spacing:6px; margin:2px 0 6px; text-shadow:0 2px 0 rgba(196,127,23,.35); }
  .clear-scene { width:100%; max-width:340px; margin:0 auto; display:block; }
  .confetti { position:absolute; inset:0; pointer-events:none; }
  .confetti i {
    position:absolute; top:-14px; width:11px; height:11px; display:block;
    background:#ffc93c; clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%);
    animation:fall linear forwards;
  }
  @keyframes fall { to { transform:translateY(560px) rotate(340deg); opacity:.4; } }
  .footer-note { text-align:center; font-size:11px; color:rgba(223,231,255,.6); margin-top:22px; }
</style>
</head>

const SAVE_KEY = 'mizu-hoshioki-v1';
const AREA_COLORS = ['#ffd9d4','#ffedbe','#d7efc2','#c9e7f8','#e2d8f8','#ffe3c2','#c9f0e4','#fbd7e8'];
const DIFF_LABEL = { easy:'かんたん', normal:'ふつう', hard:'むずかしい', daily:'デイリー' };
const START_COMMENTS = {
  easy:'各エリアに星は1つずつ。まずは大きめのエリアから見てみよう！',
  normal:'行と列も忘れずに。星同士はななめでも隣り合わないよ。',
  hard:'8×8の大きな星空だ。×メモをうまく使ってね！',
  daily:'今日の星空だよ。全部のエリアに星を置こう！'
};

/* ---------- 保存 ---------- */
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') return Object.assign({ stars:{}, daily:{}, sound:true }, s);
  } catch (e) {}
  return { stars:{}, daily:{}, sound:true };
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- デイリー ---------- */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function hashStr(s) { let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dailyStages(dateStr) {
  const rnd = mulberry32(hashStr('hoshioki-' + dateStr));
  const idxs = DATA.dailyPool.map((_, i) => i);
  for (let i = idxs.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  return idxs.slice(0, 10).map(i => DATA.dailyPool[i]);
}

/* ---------- サウンド ---------- */
let audioCtx = null;
function tone(freq, dur, type, vol, delay) {
  if (!save.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const sndTap   = () => tone(520, 0.06, 'triangle', 0.06);
const sndStar  = () => { tone(880, 0.12, 'sine', 0.12); tone(1318, 0.16, 'sine', 0.1, 0.07); };
const sndCross = () => tone(320, 0.05, 'square', 0.04);
const sndErr   = () => tone(150, 0.16, 'sawtooth', 0.06);
const sndClear = () => { [523,659,784,1046,1318].forEach((f,i)=>tone(f, 0.22, 'sine', 0.11, i*0.09)); };

/* ---------- 画面遷移 ---------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}

/* ---------- ステージ選択 ---------- */
let currentTab = 'easy';
function renderSelect() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.diff === currentTab));
  const note = document.getElementById('daily-note');
  const grid = document.getElementById('stage-grid');
  grid.innerHTML = '';
  let stages, getStars;
  if (currentTab === 'daily') {
    const d = todayStr();
    note.style.display = 'block';
    note.textContent = '📅 ' + d.replace(/-/g,'/') + ' の10面（毎日かわるよ）';
    stages = dailyStages(d);
    getStars = i => save.daily[d + ':' + i] || 0;
  } else {
    note.style.display = 'none';
    stages = DATA[currentTab];
    getStars = i => save.stars[currentTab + ':' + i] || 0;
  }
  stages.forEach((st, i) => {
    const b = document.createElement('button');
    b.className = 'stage-btn';
    const got = getStars(i);
    b.innerHTML = '<span class="no">' + (i + 1) + '</span>' +
      (got ? '<span class="st">' + '★'.repeat(got) + '☆'.repeat(3 - got) + '</span>'
           : '<span class="st none">☆☆☆</span>');
    b.addEventListener('click', () => { sndTap(); startStage(currentTab, i); });
    grid.appendChild(b);
  });
}

/* ---------- プレイ ---------- */
let cur = null; // {mode, idx, stage, grid, locked, hintsLeft, hintsUsed, finished}
function startStage(mode, idx) {
  const stage = mode === 'daily' ? dailyStages(todayStr())[idx] : DATA[mode][idx];
  cur = {
    mode, idx, stage,
    grid: new Array(stage.n * stage.n).fill(0),
    locked: new Set(), hintsLeft: 3, hintsUsed: 0, finished: false
  };
  document.getElementById('play-title').textContent =
    DIFF_LABEL[mode] + ' ' + (idx + 1) + '面（' + stage.n + '×' + stage.n + '）';
  setComment(START_COMMENTS[mode]);
  buildBoard();
  updateTools();
  showScreen('screen-play');
}
function setComment(t) { document.getElementById('comment').textContent = t; }

function buildBoard() {
  const { n, regions } = cur.stage;
  const board = document.getElementById('board');
  board.innerHTML = '';
  const boardPx = Math.min(window.innerWidth - 28, 440);
  const cell = Math.floor(boardPx / n);
  board.style.gridTemplateColumns = 'repeat(' + n + ',' + cell + 'px)';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.dataset.r = r; b.dataset.c = c;
    b.style.width = cell + 'px'; b.style.height = cell + 'px';
    b.style.background = AREA_COLORS[regions[r][c] % AREA_COLORS.length];
    b.style.fontSize = Math.round(cell * 0.55) + 'px';
    const reg = regions[r][c];
    const thin = '1px solid rgba(107,88,120,.28)', thick = '3px solid #6b5878';
    b.style.borderTop    = (r === 0 || regions[r-1][c] !== reg) ? thick : thin;
    b.style.borderLeft   = (c === 0 || regions[r][c-1] !== reg) ? thick : thin;
    b.style.borderBottom = (r === n-1 || regions[r+1][c] !== reg) ? thick : thin;
    b.style.borderRight  = (c === n-1 || regions[r][c+1] !== reg) ? thick : thin;
    b.addEventListener('click', () => onCell(r, c));
    board.appendChild(b);
  }
  refreshCells();
}

function starPositions() {
  const { n } = cur.stage;
  const out = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (cur.grid[r * n + c] === 1) out.push([r, c]);
  return out;
}
function conflictSet() {
  const { regions } = cur.stage;
  const stars = starPositions();
  const bad = new Set();
  for (let i = 0; i < stars.length; i++) for (let j = i + 1; j < stars.length; j++) {
    const [r1, c1] = stars[i], [r2, c2] = stars[j];
    if (r1 === r2 || c1 === c2 || regions[r1][c1] === regions[r2][c2] ||
        (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1)) {
      bad.add(r1 + ',' + c1); bad.add(r2 + ',' + c2);
    }
  }
  return bad;
}

    const r = +el.dataset.r, c = +el.dataset.c;
    const v = cur.grid[r * n + c];
    el.classList.toggle('locked', cur.locked.has(r * n + c));
    el.classList.toggle('bad', bad.has(r + ',' + c));
    if (v === 1) el.innerHTML = '<svg class="star-svg" viewBox="-12 -12 24 24"><use href="#starShape" fill="url(#starGold)" stroke="#cf8a0a" stroke-width="1.1"/></svg>';
    else if (v === 2) el.innerHTML = '<span class="cross">×</span>';
    else el.innerHTML = '';
  });
  const placed = starPositions().length;
  document.getElementById('progress').textContent = '⭐ 星 ' + placed + ' / ' + n;
  return bad;
}

function onCell(r, c) {
  if (!cur || cur.finished) return;
  const { n } = cur.stage;
  const k = r * n + c;
  if (cur.locked.has(k)) { setComment('その星はヒントで置いた星だよ。動かせないんだ。'); return; }
  const before = conflictSet().size;
  cur.grid[k] = (cur.grid[k] + 1) % 3;
  const v = cur.grid[k];
  if (v === 1) sndStar(); else if (v === 2) sndCross(); else sndTap();
  const bad = refreshCells();
  if (v === 1 && bad.has(r + ',' + c) && bad.size > before) {
    sndErr();
    setComment('あっ、その星はルール違反だよ。赤い星同士が近すぎたり、同じ行・列・エリアにいるよ。');
  } else if (bad.size === 0 && v === 1) {
    const placed = starPositions().length;
    if (placed === Math.ceil(n / 2)) setComment('半分まできたよ。その調子！');
    else if (placed === n - 1) setComment('あと1つ！最後の星はどこかな？');
    else setComment('いい感じ！そのまま置いていこう。');
  }
  checkWin(bad);
}

function checkWin(bad) {
  const { n } = cur.stage;
  if (starPositions().length === n && bad.size === 0) {
    cur.finished = true;
    sndClear();
    const earned = Math.max(1, 3 - cur.hintsUsed);
    if (cur.mode === 'daily') {
      const key = todayStr() + ':' + cur.idx;
      save.daily[key] = Math.max(save.daily[key] || 0, earned);
    } else {
      const key = cur.mode + ':' + cur.idx;
      save.stars[key] = Math.max(save.stars[key] || 0, earned);
    }
    persist();
    setTimeout(() => showClear(earned), 450);
  }
}

function showClear(earned) {
  document.getElementById('clear-stars').textContent = '★'.repeat(earned) + '☆'.repeat(3 - earned);
  document.getElementById('clear-msg').textContent =
    cur.hintsUsed === 0 ? 'ヒントなしで星を全部置けたね。すごい！' :
    '星空が完成したよ！一家みんなで大喜び。';
  const conf = document.getElementById('confetti');
  conf.innerHTML = '';
  const colors = ['#ffc93c','#ff8fa3','#7fd4ff','#b5e48c','#e2b8ff'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('i');
    el.style.left = (Math.random() * 96) + '%';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (1.4 + Math.random() * 1.6) + 's';
    el.style.animationDelay = (Math.random() * 0.7) + 's';
    conf.appendChild(el);
  }
  const hasNext = cur.idx < 9;
  document.getElementById('btn-next').style.display = hasNext ? 'block' : 'none';
  document.getElementById('clear-overlay').classList.add('show');
}

function updateTools() {
  const b = document.getElementById('btn-hint');
  b.textContent = '💡 ヒント（あと' + cur.hintsLeft + '）';
  b.disabled = cur.hintsLeft <= 0 || cur.finished;
}

function useHint() {
  if (!cur || cur.finished || cur.hintsLeft <= 0) return;
  const { n, sol } = cur.stage;
  const solSet = new Set(sol.map(([r, c]) => r * n + c));
  const missing = [...solSet].filter(k => cur.grid[k] !== 1);
  if (missing.length) {
    const k = missing[Math.floor(Math.random() * missing.length)];
    cur.grid[k] = 1;
    cur.locked.add(k);
    cur.hintsLeft--; cur.hintsUsed++;
    sndStar();
    setComment('ヒント！光っている星の場所が正解だよ。');
    const bad = refreshCells();
    updateTools();
    checkWin(bad);
    return;
  }
  // 正解の星は全部あるのに完成していない = 余分な間違い星がある
  const wrong = [];
  for (let k = 0; k < n * n; k++)
    if (cur.grid[k] === 1 && !solSet.has(k) && !cur.locked.has(k)) wrong.push(k);
  if (wrong.length) {
    cur.grid[wrong[0]] = 0;
    cur.hintsLeft--; cur.hintsUsed++;
    sndCross();
    setComment('ヒント！間違っていた星を1つ消したよ。');
    refreshCells();
    updateTools();
  } else {
    setComment('ヒントは必要なさそうだよ。もう完成間近！');
  }
}

/* ---------- イベント ---------- */
document.getElementById('btn-play').addEventListener('click', () => { sndTap(); renderSelect(); showScreen('screen-select'); });
document.getElementById('btn-back-title').addEventListener('click', () => { sndTap(); showScreen('screen-title'); });
document.getElementById('btn-back-select').addEventListener('click', () => { sndTap(); renderSelect(); showScreen('screen-select'); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  sndTap(); currentTab = t.dataset.diff; renderSelect();
}));
document.getElementById('btn-hint').addEventListener('click', useHint);
document.getElementById('btn-restart').addEventListener('click', () => {
  if (!cur) return;
  sndTap();
  cur.grid.fill(0); cur.locked.clear(); cur.hintsLeft = 3; cur.hintsUsed = 0; cur.finished = false;
  setComment(START_COMMENTS[cur.mode]);
  refreshCells(); updateTools();
});
document.getElementById('btn-next').addEventListener('click', () => {
  document.getElementById('clear-overlay').classList.remove('show');
  startStage(cur.mode, cur.idx + 1);
});
document.getElementById('btn-to-select').addEventListener('click', () => {
  document.getElementById('clear-overlay').classList.remove('show');
  currentTab = cur.mode;
  renderSelect();
  showScreen('screen-select');
});
const soundBtn = document.getElementById('btn-sound');
function syncSoundBtn() { soundBtn.textContent = 'おと：' + (save.sound ? 'ON' : 'OFF'); }
soundBtn.addEventListener('click', () => { save.sound = !save.sound; persist(); syncSoundBtn(); if (save.sound) sndStar(); });
syncSoundBtn();
</script>
</body>
