<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ミズー一家のねじはずし</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:#f7ead2;
    color:#3a2c1c;
    overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  #app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  /* ---------- 共通 ---------- */
  .screen { display:none; flex-direction:column; flex:1; padding:12px 12px 24px; }
  .screen.active { display:flex; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .big-btn {
    display:block; width:100%; max-width:320px; margin:10px auto; padding:15px 10px;
    background:#e2483d; color:#fff; font-size:20px; font-weight:bold; border-radius:999px;
    box-shadow:0 4px 0 #b02a20; letter-spacing:.05em;
  }
  .big-btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b02a20; }
  .sub-btn {
    display:inline-block; padding:10px 18px; background:#fff; color:#3a2c1c; font-size:15px; font-weight:bold;
    border-radius:999px; border:2px solid #d8c39a; box-shadow:0 2px 0 #d8c39a;
  }
  .sub-btn:active { transform:translateY(2px); box-shadow:none; }

  /* ---------- タイトル ---------- */
  #scr-title { text-align:center; background:linear-gradient(#fdeed3,#f7ead2); }
  .title-band {
    background:#8a5a2b; color:#ffe9bd; border-radius:14px; padding:6px 10px; margin:2px auto 0;
    font-size:13px; letter-spacing:.25em; display:inline-block;
  }
  h1.game-title {
    font-size:34px; line-height:1.25; margin:12px 0 2px; color:#7c4a16;
    text-shadow:0 2px 0 #fff3d6;
  }
  h1.game-title .accent { color:#e2483d; }
  .title-sub { font-size:14px; color:#8a6a3d; margin-bottom:6px; }
  .title-chars { display:flex; justify-content:center; align-items:flex-end; gap:2px; margin:4px 0 0; min-height:170px; }
  .title-chars img { height:150px; width:auto; filter:drop-shadow(0 3px 3px rgba(90,55,10,.25)); }
  .title-chars img.small { height:118px; }
  .workbench {
    margin:10px auto 4px; max-width:360px; background:#a9743a; border-radius:12px; padding:10px 12px;
    color:#fff7e6; font-size:13.5px; line-height:1.7; box-shadow:inset 0 0 0 3px #8a5a2b;
    text-align:left;
  }
  .workbench b { color:#ffd76e; }
  .title-progress { font-size:13px; color:#8a6a3d; margin-top:8px; }

  /* ---------- ステージ選択 ---------- */
  .sel-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sel-head .ttl { font-size:20px; font-weight:bold; color:#7c4a16; }
  .back-btn {
    width:44px; height:44px; border-radius:50%; background:#fff; border:2px solid #d8c39a;
    font-size:20px; font-weight:bold; color:#7c4a16; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab {
    flex:1; padding:11px 2px; border-radius:12px; background:#fff; border:2px solid #d8c39a;
    font-size:14.5px; font-weight:bold; color:#8a6a3d; min-height:48px;
  }
  .tab.on { background:#e2483d; border-color:#b02a20; color:#fff; }
  .stage-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .stage-btn {
    position:relative; aspect-ratio:1; border-radius:14px; background:#fff; border:2px solid #d8c39a;
    font-size:19px; font-weight:bold; color:#5a4020; min-height:52px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .stage-btn .screw-dot { width:16px; height:16px; margin-bottom:2px; }
  .stage-btn.cleared { background:#fff3cf; border-color:#e8a812; }
  .stage-btn .clear-badge {
    position:absolute; top:-7px; right:-5px; background:#35a852; color:#fff; font-size:10px; font-weight:bold;
    border-radius:999px; padding:2px 6px; box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .stage-btn .daily-date { font-size:10px; color:#8a6a3d; font-weight:normal; }
  .sel-note { font-size:12.5px; color:#8a6a3d; margin-top:12px; line-height:1.6; }

  /* ---------- プレイ ---------- */
  #scr-play { padding-top:8px; }
  .play-head { display:flex; align-items:center; gap:6px; }
  .play-head .stage-name { font-size:17px; font-weight:bold; color:#7c4a16; flex:1; text-align:center; }
  .icon-btn {
    width:44px; height:44px; border-radius:50%; background:#fff; border:2px solid #d8c39a; flex:none;
    font-size:18px; display:flex; align-items:center; justify-content:center; color:#7c4a16; font-weight:bold;
  }
  .comment-bar { display:flex; align-items:center; gap:8px; margin:8px 0 10px; min-height:56px; }
  .comment-bar img { width:52px; height:52px; border-radius:50%; background:#ffe9bd; border:2px solid #d8a94e; flex:none; object-fit:cover; }
  .bubble {
    position:relative; background:#fff; border:2px solid #d8c39a; border-radius:14px; padding:8px 12px;
    font-size:14px; line-height:1.5; flex:1;
  }
  .bubble::before {
    content:""; position:absolute; left:-9px; top:50%; margin-top:-6px;
    border:6px solid transparent; border-right:8px solid #d8c39a; border-left:none;
  }
  #board-wrap {
    position:relative; width:100%; max-width:392px; margin:0 auto;
    background:linear-gradient(#b98a4e,#a9743a); border-radius:16px;
    box-shadow:inset 0 0 0 4px #8a5a2b, inset 0 0 34px rgba(60,35,5,.35);
    overflow:hidden;
  }
  #board { position:absolute; left:0; top:0; transform-origin:0 0; width:352px; height:384px; }
  .plate {
    position:absolute; border-radius:12px; box-shadow:0 3px 6px rgba(40,20,0,.45), inset 0 0 0 2px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.35);
    transition:transform .5s ease-in, opacity .5s ease-in;
  }
  .plate.falling { transform:translateY(150px) rotate(10deg) !important; opacity:0; }
  .plate .hole {
    position:absolute; width:14px; height:14px; border-radius:50%;
    background:rgba(0,0,0,.28); box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
    transform:translate(-50%,-50%);
  }
  .screw {
    position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .16s ease, opacity .16s ease, filter .2s;
    touch-action:manipulation;
  }
  .screw .head {
    width:36px; height:36px; border-radius:50%; pointer-events:none;
    box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .screw .head svg { width:22px; height:22px; display:block; }
  .screw.accessible:active .head { transform:scale(.9); }
  .screw.blocked { filter:brightness(.62) saturate(.55); }
  .screw.hint-glow { animation:hintGlow .55s ease-in-out infinite alternate; z-index:999 !important; }
  @keyframes hintGlow {
    from { filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #ffd76e); transform:scale(1); }
    to   { filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 13px #ffd76e); transform:scale(1.18); }
  }
  .screw.gone { transform:scale(.2); opacity:0; pointer-events:none; }

  .tray-wrap { max-width:392px; width:100%; margin:12px auto 0; }
  .tray-label { font-size:12.5px; color:#8a6a3d; font-weight:bold; margin-bottom:4px; display:flex; justify-content:space-between; }
  #tray {
    display:flex; gap:7px; justify-content:center; background:#8a5a2b; border-radius:14px; padding:10px 8px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
    min-height:64px;
  }
  .tray-slot {
    width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.25);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .tray-slot .mini-head {
    width:34px; height:34px; border-radius:50%;
    box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center;
    animation:pop .18s ease;
  }
  .tray-slot .mini-head svg { width:20px; height:20px; display:block; }
  .tray-slot.clearing .mini-head { animation:clearPop .34s ease forwards; }
  @keyframes pop { from { transform:scale(.4); } to { transform:scale(1); } }
  @keyframes clearPop { 0% { transform:scale(1); } 40% { transform:scale(1.3); } 100% { transform:scale(0); opacity:0; } }
  #tray.danger { animation:dangerShake .3s ease; background:#a03a2b; }
  @keyframes dangerShake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }

  .play-btns { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .play-btns .sub-btn { min-height:48px; min-width:104px; }
  .play-btns .sub-btn:disabled { opacity:.45; }

  /* ---------- オーバーレイ ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(43,28,8,.55); display:none;
    align-items:center; justify-content:center; z-index:2000; padding:18px;
  }
  .overlay.active { display:flex; }
  .card {
    background:#fffaf0; border-radius:20px; padding:20px 18px 16px; max-width:360px; width:100%;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.35); border:3px solid #d8a94e;
    max-height:92vh; overflow-y:auto;
  }
  .card h2 { font-size:25px; color:#7c4a16; margin:4px 0 6px; }
  .card p { font-size:14.5px; line-height:1.65; }
  .card .family-img { display:flex; justify-content:center; align-items:flex-end; gap:0; margin:6px 0 2px; }
  .card .family-img img { height:104px; width:auto; }
  .card .family-img img.tall { height:118px; }
  .card .result-line { font-size:14px; color:#8a6a3d; margin:6px 0 2px; }
  .card .papa-img { height:110px; width:auto; margin:4px 0; }
  .howto-screws { display:flex; justify-content:center; gap:10px; margin:10px 0; }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <div class="screen active" id="scr-title">
    <div><span class="title-band">パパの工作コーナー</span></div>
    <h1 class="game-title">ミズー一家の<br><span class="accent">ねじはずし</span></h1>
    <p class="title-sub">ネジを外して、板を全部はずそう！</p>
    <div class="title-chars">
      <img id="title-onii" alt="お兄ちゃん">
      <img id="title-papa" alt="パパ">
      <img id="title-mizu" alt="ミズー">
      <img id="title-mama" class="small" alt="ママ">
    </div>
    <div class="workbench">
      <b>あそびかた</b><br>
      ネジをタップすると、手もとの<b>トレイ</b>に移ります。<br>
      <b>同じ色のネジが3本</b>そろうと消えます。<br>
      板のネジを全部外すと、その板が落ちます。<br>
      トレイがいっぱいになる前に、全部の板を外せばクリア！<br>
      上の板に隠れたネジは、その板が落ちるまで外せません。
    </div>
    <button class="big-btn" id="btn-to-select">あそぶ</button>
    <button class="sub-btn" id="btn-sound-title">おと：オン</button>
    <p class="title-progress" id="title-progress"></p>
  </div>

  <!-- ステージ選択 -->
  <div class="screen" id="scr-select">
    <div class="sel-head">
      <button class="back-btn" id="btn-sel-back">←</button>
      <span class="ttl">ステージをえらぶ</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-diff="easy">かんたん</button>
      <button class="tab" data-diff="normal">ふつう</button>
      <button class="tab" data-diff="hard">むずかしい</button>
      <button class="tab" data-diff="daily">デイリー</button>
    </div>
    <div class="stage-grid" id="stage-grid"></div>
    <p class="sel-note" id="sel-note"></p>
  </div>

  <!-- プレイ -->
  <div class="screen" id="scr-play">
    <div class="play-head">
      <button class="icon-btn" id="btn-play-back">←</button>
      <span class="stage-name" id="stage-name"></span>
      <button class="icon-btn" id="btn-sound-play">♪</button>
    </div>
    <div class="comment-bar">
      <img id="papa-face" alt="パパ">
      <div class="bubble" id="comment">いくよ！</div>
    </div>
    <div id="board-wrap"><div id="board"></div></div>
    <div class="tray-wrap">
      <div class="tray-label"><span>手もとトレイ（同じ色3本で消えるよ）</span><span id="move-count"></span></div>
      <div id="tray"></div>
    </div>
    <div class="play-btns">
      <button class="sub-btn" id="btn-hint">ヒント（のこり3）</button>
      <button class="sub-btn" id="btn-retry">やりなおし</button>
    </div>
  </div>

</div>

<!-- クリア -->
<div class="overlay" id="ov-clear">
  <div class="card">
    <div class="family-img">
      <img id="clear-onii" alt="お兄ちゃん">
      <img id="clear-papa" class="tall" alt="パパ">
      <img id="clear-mizu" class="tall" alt="ミズー">
      <img id="clear-mama" alt="ママ">
    </div>
    <h2>クリア！</h2>
    <p>全部の板をはずせたね。<br>パパの工作、かんせい！</p>
    <p class="result-line" id="clear-result"></p>
    <button class="big-btn" id="btn-next">つぎのステージ</button>
    <button class="sub-btn" id="btn-clear-select">ステージをえらぶ</button>
  </div>
</div>

<!-- 詰み -->
<div class="overlay" id="ov-stuck">
  <div class="card">
    <img class="papa-img" id="stuck-papa" alt="パパ">
    <h2>つまっちゃった…</h2>
    <p>トレイがいっぱいになってしまった。<br>外す順番を変えて、もう一度やってみよう！</p>
    <button class="big-btn" id="btn-stuck-retry">もう一度やる</button>
    <button class="sub-btn" id="btn-stuck-select">ステージをえらぶ</button>
  </div>
</div>

function tryGen(rng, P){
  // 色ごとの本数（各3の倍数）
  const counts = new Array(P.nColors).fill(3);
  let total = 3 * P.nColors;
  const target = P.total[0] + Math.floor(rng() * ((P.total[1] - P.total[0]) / 3 + 1)) * 3;
  while (total < target){ counts[Math.floor(rng() * P.nColors)] += 3; total += 3; }
  // 板の枚数と各板のネジ数（3〜6本）
  const nPlates = P.plates[0] + Math.floor(rng() * (P.plates[1] - P.plates[0] + 1));
  const per = new Array(nPlates).fill(3);
  let rest = total - 3 * nPlates;
  if (rest < 0) return null;
  let guard = 0;
  while (rest > 0 && guard++ < 200){
    const i = Math.floor(rng() * nPlates);
    if (per[i] < 6){ per[i]++; rest--; }
  }
  if (rest > 0) return null;
  // 板の配置
  const plates = [];
  for (let i = 0; i < nPlates; i++){
    const w = 136 + Math.floor(rng() * 62);          // 136..197
    const h = 94 + Math.floor(rng() * 44);           // 94..137
    const x = 4 + Math.floor(rng() * (BOARD_W - w - 8));
    const y = 4 + Math.floor(rng() * (BOARD_H - h - 8));
    plates.push({ x, y, w, h, z: i, mat: Math.floor(rng() * PLATE_MATS.length) });
  }
  // z順をシャッフル
  const zperm = plates.map((_, i) => i);
  for (let i = zperm.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = zperm[i]; zperm[i] = zperm[j]; zperm[j] = t; }
  plates.forEach((p, i) => { p.z = zperm[i]; });
  // ネジ位置（板内グリッド、中心間隔47px以上）
  const screws = [];
  const colorBag = [];
  counts.forEach((c, ci) => { for (let k = 0; k < c; k++) colorBag.push(ci); });
  for (let i = colorBag.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = colorBag[i]; colorBag[i] = colorBag[j]; colorBag[j] = t; }
  let bagIdx = 0;
  for (let pi = 0; pi < nPlates; pi++){
    const p = plates[pi];
    const xs = [], ys = [];
    for (let gx = p.x + 26; gx <= p.x + p.w - 26; gx += 47) xs.push(gx);
    for (let gy = p.y + 26; gy <= p.y + p.h - 26; gy += 47) ys.push(gy);
    const cells = [];
    xs.forEach(gx => ys.forEach(gy => cells.push([gx, gy])));
    if (cells.length < per[pi]) return null;
    for (let i = cells.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = cells[i]; cells[i] = cells[j]; cells[j] = t; }
    for (let k = 0; k < per[pi]; k++){
      screws.push({ x: cells[k][0], y: cells[k][1], plate: pi, color: colorBag[bagIdx++] });
    }
  }
  // 異なる板のネジ同士が近すぎると下のネジが隠れてしまうので避ける
  for (let i = 0; i < screws.length; i++){
    for (let j = i + 1; j < screws.length; j++){
      if (screws[i].plate === screws[j].plate) continue;
      const dx = screws[i].x - screws[j].x, dy = screws[i].y - screws[j].y;
      if (dx * dx + dy * dy < 26 * 26) return null;
    }
  }
  const stage = { tray: P.tray, plates, screws };
  finishStage(stage);
  // 品質ゲート
  let covered = 0, startAcc = 0; const startColors = new Set();
  screws.forEach((s, i) => {
    if (stage.blockerMask[i] !== 0) covered++;
    if (stage.blockerMask[i] === 0){ startAcc++; startColors.add(s.color); }
  });
  if (covered < P.minCovered) return null;
  if (startAcc < 4) return null;
  if (startColors.size < P.minStartColors) return null;
  return stage;
}

/* 派生データ（ブロッカー・板マスク等）を計算 */
function finishStage(stage){
  const n = stage.screws.length;
  stage.n = n;
  stage.allMask = (n >= 31) ? 0x7fffffff : ((1 << n) - 1);
  stage.plateMask = stage.plates.map(() => 0);
  stage.screws.forEach((s, i) => { stage.plateMask[s.plate] |= (1 << i); });
  stage.blockerMask = stage.screws.map((s, i) => {
    const my = stage.plates[s.plate];
    let m = 0;
    stage.plates.forEach((u, ui) => {
      if (u.z > my.z && s.x > u.x && s.x < u.x + u.w && s.y > u.y && s.y < u.y + u.h){
        m |= stage.plateMask[ui];
      }
    });
    return m & ~stage.plateMask[s.plate];
  });
  stage.colorMask = COLOR_DEFS.map((_, ci) => {
    let m = 0;
    stage.screws.forEach((s, i) => { if (s.color === ci) m |= (1 << i); });
    return m;
  });
}
function bitCount(x){ let c = 0; while (x){ x &= x - 1; c++; } return c; }
function trayCounts(stage, removed){
  return stage.colorMask.map(cm => bitCount(removed & cm) % 3);
}
function trayOccupancy(stage, removed){
  return trayCounts(stage, removed).reduce((a, b) => a + b, 0);
}
function isAccessible(stage, removed, i){
  if (removed & (1 << i)) return false;
  return (removed & stage.blockerMask[i]) === stage.blockerMask[i];
}

/* 構成的証明：貪欲シミュレーションで解の存在を示す（生成時の関門） */
function witness(stage, seed){
  const rng = RNG(seed);
  for (let restart = 0; restart < 30; restart++){
    let removed = 0; const order = [];
    let ok = true;
    while (removed !== stage.allMask){
      if (trayOccupancy(stage, removed) >= stage.tray){ ok = false; break; }
      const tc = trayCounts(stage, removed);
      let best = -1, bestScore = 1e9;
      for (let i = 0; i < stage.n; i++){
        if (!isAccessible(stage, removed, i)) continue;
        const s = stage.screws[i];
        let score = tc[s.color] === 2 ? 0 : (tc[s.color] === 1 ? 2 : 4);
        const plateRemain = bitCount(stage.plateMask[s.plate] & ~removed);
        if (plateRemain === 1) score -= 1;         // 板が落ちる手は優先
        score += rng() * 0.9;                       // ばらつき
        if (score < bestScore){ bestScore = score; best = i; }
      }
      if (best < 0){ ok = false; break; }
      removed |= (1 << best); order.push(best);
    }
    if (ok && removed === stage.allMask) return order;
  }
  return null;
}

/* 汎用ソルバー（DFS＋メモ化）。ヒント用＆検証用。
   生成の witness とは別系統の探索で、状態から解を1つ返す。 */
function solveStage(stage, fromMask, nodeBudget){
  const budget = nodeBudget || 400000;
  let nodes = 0;
  const dead = new Set();
  const path = [];
  function dfs(mask){
    if (mask === stage.allMask) return true;
    if (dead.has(mask)) return false;
    if (++nodes > budget) return false;
    if (trayOccupancy(stage, mask) >= stage.tray){ dead.add(mask); return false; }
    const tc = trayCounts(stage, mask);
    const cand = [];
    for (let i = 0; i < stage.n; i++){
      if (!isAccessible(stage, mask, i)) continue;
      const s = stage.screws[i];
      let score = tc[s.color] === 2 ? 0 : (tc[s.color] === 1 ? 2 : 4);
      const plateRemain = bitCount(stage.plateMask[s.plate] & ~mask);
      if (plateRemain === 1) score -= 1;
      cand.push([score, i]);
    }
    cand.sort((a, b) => a[0] - b[0]);
    for (const c of cand){
      path.push(c[1]);
      if (dfs(mask | (1 << c[1]))) return true;
      path.pop();
      if (nodes > budget) return false;
    }
    dead.add(mask);
    return false;
  }
  return dfs(fromMask || 0) ? path.slice() : null;
}

/* ステージ生成（決定的：同じseedなら同じ面） */
function genStage(seed, diffKey){
  const P = DIFF_PARAMS[diffKey];
  for (let attempt = 0; attempt < 6000; attempt++){
    const rng = RNG((seed * 100003 + attempt * 7919) >>> 0);
    const st = tryGen(rng, P);
    if (st && witness(st, seed * 31 + attempt)) return st;
  }
  return null;
}
const STAGE_SEEDS = {
  easy:   [1101,1102,1103,1104,1105,1106,1107,1108,1109,1110],
  normal: [2201,2202,2203,2204,2205,2206,2207,2208,2209,2210],
  hard:   [3301,3302,3303,3304,3305,3306,3307,3308,3309,3310]
};
function dailySeed(dateStr, idx){
  let h = 0;
  for (let i = 0; i < dateStr.length; i++) h = (h * 31 + dateStr.charCodeAt(i)) >>> 0;
  return (h % 100000) * 10 + idx + 500000;
}
function getStage(diffKey, idx, dateStr){
  if (diffKey === "daily") return genStage(dailySeed(dateStr, idx), "daily");
  return genStage(STAGE_SEEDS[diffKey][idx], diffKey);
}
/* ==CORE-END== */
</script>
<script>
"use strict";
/* ================= UI ================= */
const $ = id => document.getElementById(id);
const SAVE_KEY = "mizu-neji-v1";
let save = { cleared:{}, sound:true, lastDiff:"easy" };
try { const s = localStorage.getItem(SAVE_KEY); if (s) save = Object.assign(save, JSON.parse(s)); } catch(e){}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

/* ---------- 音（WebAudio） ---------- */
let actx = null;
function tone(f0, f1, dur, type, vol, delay){
  if (!save.sound) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
function sfx(name){
  if (!save.sound) return;
  if (name === "tap"){ tone(1400, 700, 0.06, "square", 0.06); tone(2400, 1800, 0.04, "sine", 0.05, 0.03); }
  else if (name === "triple"){ [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, "triangle", 0.14, i * 0.07)); }
  else if (name === "fall"){ tone(170, 55, 0.28, "sine", 0.22); tone(90, 45, 0.3, "triangle", 0.12, 0.02); }
  else if (name === "clear"){ [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.16, "triangle", 0.15, i * 0.1)); tone(1318, 1318, 0.3, "triangle", 0.12, 0.42); }
  else if (name === "stuck"){ tone(300, 140, 0.35, "sawtooth", 0.06); }
  else if (name === "deny"){ tone(200, 160, 0.09, "square", 0.05); }
  else if (name === "click"){ tone(880, 880, 0.05, "sine", 0.08); }
}

/* ---------- 画像セット ---------- */
$("title-papa").src = IMG.papa; $("title-mizu").src = IMG.mizu;
$("title-mama").src = IMG.mama; $("title-onii").src = IMG.onii;
$("clear-papa").src = IMG.papa; $("clear-mizu").src = IMG.mizu;
$("clear-mama").src = IMG.mama; $("clear-onii").src = IMG.onii;
$("papa-face").src = IMG.facePapa; $("stuck-papa").src = IMG.papa;

/* ---------- 画面遷移 ---------- */
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* ---------- 日付 ---------- */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function todayLabel(){ const d = new Date(); return (d.getMonth() + 1) + "/" + d.getDate(); }

/* ---------- ステージ選択 ---------- */
const DIFF_LABEL = { easy:"かんたん", normal:"ふつう", hard:"むずかしい", daily:"デイリー" };
const DIFF_NOTE = {
  easy: "板は3〜4枚、ネジは12〜15本。トレイは6枠。まずはここからどうぞ。",
  normal: "板は4〜5枚、ネジは18〜24本。色は4色、トレイは6枠です。",
  hard: "板は5〜6枚、ネジは24〜30本。色は5色でトレイは5枠。外す順番が大事です。",
  daily: "今日の10面です。毎日0時に新しい面になります（前半はふつう、後半は少し難しめ）。"
};
let curDiff = save.lastDiff || "easy";
function stageId(diffKey, idx){
  return diffKey === "daily" ? ("daily-" + todayStr() + "-" + idx) : (diffKey + "-" + idx);
}
function renderSelect(){
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("on", t.dataset.diff === curDiff));
  const grid = $("stage-grid"); grid.innerHTML = "";
  for (let i = 0; i < 10; i++){
    const b = document.createElement("button");
    b.className = "stage-btn";
    const done = !!save.cleared[stageId(curDiff, i)];
    if (done) b.classList.add("cleared");
    b.innerHTML = "<span>" + (i + 1) + "</span>" +
      (curDiff === "daily" ? '<span class="daily-date">' + todayLabel() + "</span>" : "") +
      (done ? '<span class="clear-badge">クリア</span>' : "");
    b.addEventListener("click", () => { sfx("click"); startStage(curDiff, i); });
    grid.appendChild(b);
  }
  $("sel-note").textContent = DIFF_NOTE[curDiff];
  updateTitleProgress();
}
function clearedCount(){
  let n = 0;
  ["easy", "normal", "hard"].forEach(d => { for (let i = 0; i < 10; i++) if (save.cleared[d + "-" + i]) n++; });
  for (let i = 0; i < 10; i++) if (save.cleared["daily-" + todayStr() + "-" + i]) n++;
  return n;
}
function updateTitleProgress(){
  $("title-progress").textContent = "クリアしたステージ：" + clearedCount() + " / 40";
}
document.querySelectorAll("#tabs .tab").forEach(t => {
  t.addEventListener("click", () => { curDiff = t.dataset.diff; save.lastDiff = curDiff; persist(); sfx("click"); renderSelect(); });
});
$("btn-to-select").addEventListener("click", () => { sfx("click"); renderSelect(); show("scr-select"); });
$("btn-sel-back").addEventListener("click", () => { sfx("click"); updateTitleProgress(); show("scr-title"); });

/* ---------- おとボタン ---------- */
function refreshSoundBtns(){
  $("btn-sound-title").textContent = "おと：" + (save.sound ? "オン" : "オフ");
  const b = $("btn-sound-play");
  b.textContent = "♪";
  b.style.opacity = save.sound ? "1" : ".35";
  b.style.textDecoration = save.sound ? "none" : "line-through";
}
function toggleSound(){ save.sound = !save.sound; persist(); refreshSoundBtns(); if (save.sound) sfx("click"); }
$("btn-sound-title").addEventListener("click", toggleSound);
$("btn-sound-play").addEventListener("click", toggleSound);

/* ---------- ネジのマーク ---------- */
function markSVG(mark){
  const col = "rgba(50,25,0,.55)";
  if (mark === "plus") return '<svg viewBox="0 0 22 22"><path d="M11 4v14M4 11h14" stroke="' + col + '" stroke-width="4.4" stroke-linecap="round" fill="none"/></svg>';
  if (mark === "minus") return '<svg viewBox="0 0 22 22"><path d="M4 11h14" stroke="' + col + '" stroke-width="4.4" stroke-linecap="round" fill="none"/></svg>';
  if (mark === "star") return '<svg viewBox="0 0 22 22"><polygon points="11,2.8 13.1,8.5 19.2,8.7 14.5,12.3 16,18.2 11,14.9 6,18.2 7.5,12.3 2.8,8.7 8.9,8.5" fill="' + col + '"/></svg>';
  if (mark === "dot") return '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="4.6" fill="' + col + '"/></svg>';
  if (mark === "tri") return '<svg viewBox="0 0 22 22"><polygon points="11,3.8 18.4,17.4 3.6,17.4" fill="' + col + '"/></svg>';
  return '<svg viewBox="0 0 22 22"><polygon points="11,3.2 17.8,11 11,18.8 4.2,11" fill="' + col + '"/></svg>';
}
function headHTML(colorIdx){
  const c = COLOR_DEFS[colorIdx];
  return '<div class="head" style="background:radial-gradient(circle at 35% 30%, ' + c.css + ', ' + c.css + ' 55%, rgba(0,0,0,.22) 130%)">' + markSVG(c.mark) + "</div>";
}

/* ---------- コメント ---------- */
const COMMENTS = {
  start: [
    "パパの工作コーナーだよ。ネジをタップして板をはずそう！",
    "同じ色のネジが3本そろうと消えるよ。順番を考えて外してね。",
    "上の板に隠れたネジは、その板が落ちるまで外せないよ。"
  ],
  triple: ["3本そろった！いい感じ！", "そろったそろった！その調子！", "きれいに消えたね！"],
  fall: ["お、板がはずれた！", "板が落ちた！下のネジが見えてきたよ。", "いいぞいいぞ！"],
  deny: ["そのネジは上の板に隠れてるよ。先に上の板をはずそう。"],
  danger: ["トレイがいっぱいになってきた…そろえられそうな色から外そう。"],
  hint: ["光っているネジを外してみて！"]
};
let commentSeed = 0;
function say(kind){
  const arr = COMMENTS[kind]; if (!arr) return;
  $("comment").textContent = arr[(commentSeed++) % arr.length];
}

/* ---------- プレイ ---------- */
let G = null;
function layoutBoard(){
  if (!G) return;
  const wrap = $("board-wrap");
  const w = wrap.clientWidth;
  const s = w / BOARD_W;
  const board = $("board");
  board.style.transform = "scale(" + s + ")";
  board.style.left = "0px";
  wrap.style.height = (BOARD_H * s) + "px";
}
window.addEventListener("resize", layoutBoard);

function startStage(diffKey, idx){
  let stage = getStage(diffKey, idx, todayStr());
  if (!stage) stage = genStage(987654 + idx * 131, diffKey === "daily" ? "daily" : diffKey);
  G = {
    diffKey, idx, stage,
    removed: 0, trayList: [], hints: 3, moves: 0,
    busy: false, over: false, fallen: new Set(), screwEls: [], plateEls: []
  };
  $("stage-name").textContent = diffKey === "daily"
    ? "デイリー（" + todayLabel() + "） " + (idx + 1)
    : DIFF_LABEL[diffKey] + " " + (idx + 1);
  buildBoard();
  renderTray();
  updateHintBtn();
  $("move-count").textContent = "";
  say("start");
  show("scr-play");
  layoutBoard();
}
function buildBoard(){
  const board = $("board"); board.innerHTML = "";
  G.plateEls = []; G.screwEls = [];
  const st = G.stage;
  st.plates.forEach((p, pi) => {
    const el = document.createElement("div");
    el.className = "plate";
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.width = p.w + "px"; el.style.height = p.h + "px";
    el.style.zIndex = p.z * 2;
    const mat = PLATE_MATS[p.mat];
    el.style.background = mat.bg;
    el.style.boxShadow = "0 3px 6px rgba(40,20,0,.45), inset 0 0 0 3px " + mat.edge + ", inset 0 2px 3px rgba(255,255,255,.35)";
    board.appendChild(el);
    G.plateEls[pi] = el;
  });
  st.screws.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "screw";
    b.style.left = s.x + "px"; b.style.top = s.y + "px";
    b.style.zIndex = st.plates[s.plate].z * 2 + 2;
    b.innerHTML = headHTML(s.color);
    b.setAttribute("aria-label", COLOR_DEFS[s.color].name + "のネジ");
    b.addEventListener("click", () => onScrewTap(i));
    board.appendChild(b);
    G.screwEls[i] = b;
  });
  refreshScrewStates();
}
function refreshScrewStates(){
  const st = G.stage;
  st.screws.forEach((s, i) => {
    if (G.removed & (1 << i)) return;
    const acc = isAccessible(st, G.removed, i);
    G.screwEls[i].classList.toggle("blocked", !acc);
    G.screwEls[i].classList.toggle("accessible", acc);
  });
}
function renderTray(){
  const tray = $("tray"); tray.innerHTML = "";
  for (let i = 0; i < G.stage.tray; i++){
    const slot = document.createElement("div");
    slot.className = "tray-slot";
    if (i < G.trayList.length){
      const c = COLOR_DEFS[G.trayList[i]];
      slot.innerHTML = '<div class="mini-head" style="background:radial-gradient(circle at 35% 30%, ' + c.css + ", " + c.css + ' 55%, rgba(0,0,0,.22) 130%)">' + markSVG(c.mark) + "</div>";
    }
    tray.appendChild(slot);
  }
}
function updateHintBtn(){
  $("btn-hint").textContent = "ヒント（のこり" + G.hints + "）";
  $("btn-hint").disabled = G.hints <= 0;
}
function addHole(s){
  const st = G.stage;
  const h = document.createElement("div");
  h.className = "hole";
  h.style.left = s.x + "px"; h.style.top = s.y + "px";
  h.style.position = "absolute";
  h.style.width = "14px"; h.style.height = "14px"; h.style.borderRadius = "50%";
  h.style.background = "rgba(0,0,0,.30)"; h.style.boxShadow = "inset 0 1px 3px rgba(0,0,0,.55)";
  h.style.transform = "translate(-50%,-50%)";
  h.style.zIndex = st.plates[s.plate].z * 2 + 1;
  $("board").appendChild(h);
}

function onScrewTap(i){
  if (!G || G.busy || G.over) return;
  const st = G.stage;
  if (G.removed & (1 << i)) return;
  if (!isAccessible(st, G.removed, i)){ sfx("deny"); say("deny"); return; }
  G.busy = true;
  G.moves++;
  $("move-count").textContent = G.moves + "手";
  sfx("tap");
  const s = st.screws[i];
  const el = G.screwEls[i];
  el.classList.add("gone");
  setTimeout(() => {
    G.removed |= (1 << i);
    addHole(s);
    G.trayList.push(s.color);
    renderTray();
    resolveAfterMove(s);
  }, 150);
}

function resolveAfterMove(s){
  const st = G.stage;
  const steps = [];
  // 3本そろった？
  const colorCount = G.trayList.filter(c => c === s.color).length;
  if (colorCount === 3){
    steps.push(done => {
      sfx("triple"); say("triple");
      const slots = $("tray").children;
      for (let k = 0; k < G.trayList.length; k++) if (G.trayList[k] === s.color) slots[k].classList.add("clearing");
      setTimeout(() => {
        G.trayList = G.trayList.filter(c => c !== s.color);
        renderTray(); done();
      }, 350);
    });
  }
  // 板が落ちる？
  const fallingNow = [];
  st.plates.forEach((p, pi) => {
    if (!G.fallen.has(pi) && (st.plateMask[pi] & ~G.removed) === 0) fallingNow.push(pi);
  });
  if (fallingNow.length){
    steps.push(done => {
      sfx("fall"); say("fall");
      fallingNow.forEach(pi => { G.fallen.add(pi); G.plateEls[pi].classList.add("falling"); });
      setTimeout(() => {
        fallingNow.forEach(pi => { G.plateEls[pi].style.display = "none"; });
        done();
      }, 520);
    });
  }
  // 順に実行してから終了判定
  let k = 0;
  const next = () => {
    if (k < steps.length){ steps[k++](next); return; }
    refreshScrewStates();
    if (G.removed === st.allMask){ onClear(); return; }
    if (trayOccupancy(st, G.removed) >= st.tray){ onStuck(); return; }
    if (trayOccupancy(st, G.removed) >= st.tray - 1) say("danger");
    G.busy = false;
  };
  next();
}

function onClear(){
  G.over = true;
  G.busy = false;
  sfx("clear");
  const id = stageId(G.diffKey, G.idx);
  const prev = save.cleared[id];
  save.cleared[id] = { moves: prev ? Math.min(prev.moves, G.moves) : G.moves, hints: 3 - G.hints };
  persist();
  $("clear-result").textContent = G.moves + "手でクリア" + (G.hints === 3 ? "（ノーヒント！）" : "（ヒント " + (3 - G.hints) + "回）");
  setTimeout(() => $("ov-clear").classList.add("active"), 350);
}
function onStuck(){
  G.over = true;
  G.busy = false;
  sfx("stuck");
  const tray = $("tray");
  tray.classList.remove("danger"); void tray.offsetWidth; tray.classList.add("danger");
  setTimeout(() => $("ov-stuck").classList.add("active"), 450);
}

/* ヒント */
$("btn-hint").addEventListener("click", () => {
  if (!G || G.busy || G.over || G.hints <= 0) return;
  const sol = solveStage(G.stage, G.removed, 600000);
  if (!sol || !sol.length){
    $("comment").textContent = "うーん、今の状態だと詰まりそう…「やりなおし」がおすすめだよ。";
    return;
  }
  G.hints--;
  updateHintBtn();
  say("hint");
  const el = G.screwEls[sol[0]];
  el.classList.add("hint-glow");
  setTimeout(() => el.classList.remove("hint-glow"), 1700);
});
$("btn-retry").addEventListener("click", () => {
  if (!G) return;
  sfx("click");
  startStage(G.diffKey, G.idx);
});
$("btn-play-back").addEventListener("click", () => { sfx("click"); renderSelect(); show("scr-select"); });

/* オーバーレイ */
$("btn-next").addEventListener("click", () => {
  $("ov-clear").classList.remove("active");
  sfx("click");
  if (G.idx < 9) startStage(G.diffKey, G.idx + 1);
  else { renderSelect(); show("scr-select"); }
});
$("btn-clear-select").addEventListener("click", () => {
  $("ov-clear").classList.remove("active");
  sfx("click"); renderSelect(); show("scr-select");
});
$("btn-stuck-retry").addEventListener("click", () => {
  $("ov-stuck").classList.remove("active");
  sfx("click"); startStage(G.diffKey, G.idx);
});
$("btn-stuck-select").addEventListener("click", () => {
  $("ov-stuck").classList.remove("active");
  sfx("click"); renderSelect(); show("scr-select");
});

/* 初期化 */
refreshSoundBtns();
updateTitleProgress();
renderSelect();
</script>
</body>
