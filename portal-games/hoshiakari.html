<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ミズーのほしあかり</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#070d24 0%,#101b40 52%,#1a2c5c 100%);
    color:#eef2ff; min-height:100vh; touch-action:manipulation; overflow-x:hidden;
  }
  #app { max-width:480px; margin:0 auto; padding:14px 14px 30px; position:relative; }
  .screen { display:none; }
  .screen.active { display:block; animation:fadein .25s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }

  /* ---------- 共通ボタン ---------- */
  button { font-family:inherit; cursor:pointer; border:none; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 26px; border-radius:999px; font-size:17px; font-weight:700;
    color:#3a2703; background:linear-gradient(180deg,#ffe066,#f5a623);
    box-shadow:0 4px 0 #b97a0e, 0 8px 18px rgba(0,0,0,.35);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b97a0e, 0 4px 10px rgba(0,0,0,.3); }
  .btn.sub {
    background:rgba(255,255,255,.1); color:#dfe8ff; box-shadow:none;
    border:1.5px solid rgba(255,255,255,.35); font-size:15px; padding:11px 20px;
  }
  .btn.sub:active { transform:translateY(1px); }
  .btn:disabled { opacity:.38; pointer-events:none; }
  .icon-btn {
    width:44px; height:44px; border-radius:50%; flex:0 0 auto;
    background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.3);
    color:#fff; font-size:19px; display:inline-flex; align-items:center; justify-content:center;
  }

  /* ---------- タイトル ---------- */
  .title-scene {
    border-radius:22px; overflow:hidden; position:relative;
    background:radial-gradient(ellipse at 78% 12%, #2b3f7d 0%, transparent 55%),
               linear-gradient(180deg,#0a1332 0%,#15234e 62%,#1d3168 100%);
    border:1.5px solid rgba(160,185,255,.25);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .title-scene svg { display:block; width:100%; height:auto; }
  h1.game-title {
    text-align:center; font-size:34px; letter-spacing:.06em; margin:16px 0 2px;
    color:#fff3bf; text-shadow:0 0 18px rgba(255,205,60,.55), 0 3px 0 #8a5c00;
  }
  .subtitle { text-align:center; color:#b9c8f2; font-size:14px; margin-bottom:14px; }
  .title-btns { display:flex; flex-direction:column; gap:12px; align-items:center; margin-top:16px; }
  .title-btns .btn { min-width:240px; }
  .title-meta { text-align:center; color:#93a5d8; font-size:13px; margin-top:14px; }
  .twinkle { animation:tw 2.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  .twinkle.t2 { animation-delay:.7s; } .twinkle.t3 { animation-delay:1.3s; } .twinkle.t4 { animation-delay:1.9s; }
  @keyframes tw { 0%,100% { opacity:.25; transform:scale(.8);} 50% { opacity:1; transform:scale(1.12);} }
  .glowstar { animation:glowp 3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes glowp { 0%,100% { transform:scale(1);} 50% { transform:scale(1.05);} }

  /* ---------- 画面ヘッダ ---------- */
  .head { display:flex; align-items:center; gap:10px; margin:4px 0 12px; }
  .head h2 { font-size:20px; flex:1; text-align:center; color:#ffe9a8; letter-spacing:.04em; }
  .head .spacer { width:44px; flex:0 0 auto; }

  /* ---------- ステージ選択 ---------- */
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab {
    flex:1; padding:10px 2px; border-radius:12px; font-size:14.5px; font-weight:700;
    background:rgba(255,255,255,.08); color:#b9c8f2; border:1.5px solid rgba(255,255,255,.16);
  }
  .tab.on { background:linear-gradient(180deg,#ffe066,#f5a623); color:#3a2703; border-color:#f5a623; }
  .stage-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:9px; }
  .stage-btn {
    aspect-ratio:.92; border-radius:14px; background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,255,255,.18); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-size:19px; font-weight:700; padding:4px 0;
  }
  .stage-btn:active { background:rgba(255,255,255,.16); }
  .stage-btn .st { font-size:11px; color:#ffd94d; letter-spacing:1px; min-height:14px; }
  .stage-btn .st.none { color:#5f6f9d; }
  .daily-note { color:#93a5d8; font-size:13px; text-align:center; margin:0 0 12px; }
  .total-line { text-align:center; color:#ffd94d; font-size:14px; margin-bottom:12px; }

  /* ---------- プレイ画面 ---------- */
  .talk { display:flex; align-items:flex-end; gap:8px; margin-bottom:12px; }
  .talk .face {
    width:64px; height:64px; flex:0 0 auto; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 50% 35%, #ffe9c9, #ffd3a6);
    border:2.5px solid rgba(255,255,255,.5);
  }
  .talk .face svg { width:100%; height:100%; display:block; }
  .bubble {
    position:relative; flex:1; background:#fff; color:#2c3550; border-radius:14px;
    padding:10px 13px; font-size:14.5px; line-height:1.45; min-height:62px;
    display:flex; align-items:center;
  }
  .bubble::before {
    content:""; position:absolute; left:-9px; bottom:16px; border:6px solid transparent;
    border-right:10px solid #fff; border-left:0;
  }
  .status {
    display:flex; justify-content:center; gap:22px; margin:10px 0 4px;
    color:#cdd9ff; font-size:15px;
  }
  .status b { color:#ffe066; font-size:18px; }
  .board-wrap {
    position:relative; border-radius:22px; padding:13px;
    background:radial-gradient(ellipse at 50% 22%, #263a75 0%, #16224d 58%, #101a3a 100%);
    border:1.5px solid rgba(160,185,255,.28);
    box-shadow:inset 0 0 40px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .board-specks { position:absolute; inset:0; pointer-events:none; }
  .board {
    position:relative; display:grid; gap:8px; margin:0 auto;
  }
  .board.g6 { gap:6px; }
  .cell {
    aspect-ratio:1; border-radius:18%; position:relative;
    background:rgba(255,255,255,.045); border:1.5px solid rgba(150,175,235,.16);
    display:flex; align-items:center; justify-content:center;
    transition:background .25s, border-color .25s, box-shadow .25s;
  }
  .cell svg { width:84%; height:84%; display:block; transition:transform .22s ease, filter .25s; }
  .cell .star-main { fill:#33436b; stroke:#54679c; stroke-width:1.6; transition:fill .25s, stroke .25s; }
  .cell .star-spark { opacity:0; transition:opacity .25s; }
  .cell.on {
    background:radial-gradient(circle at 50% 42%, rgba(255,236,160,.4), rgba(255,190,60,.13) 62%, rgba(255,190,60,.04));
    border-color:rgba(255,214,90,.65);
    box-shadow:0 0 16px rgba(255,200,60,.4), inset 0 0 12px rgba(255,220,110,.35);
  }
  .cell.on .star-main { fill:url(#starGold); stroke:#e8930c; }
  .cell.on svg { filter:drop-shadow(0 0 6px rgba(255,205,70,.85)); }
  .cell.on .star-spark { opacity:1; }
  .cell:active svg { transform:scale(.88); }
  .cell.pop svg { animation:pop .28s ease; }
  @keyframes pop { 0% { transform:scale(.8);} 55% { transform:scale(1.14);} 100% { transform:scale(1);} }
  .cell.hint { animation:hintring 0.55s ease-in-out 3; z-index:2; }
  @keyframes hintring {
    0%,100% { box-shadow:0 0 0 0 rgba(120,255,170,0); }
    50% { box-shadow:0 0 0 4px rgba(120,255,170,.95), 0 0 22px rgba(120,255,170,.8); }
  }
  .play-btns { display:flex; gap:9px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .play-btns .btn { padding:11px 18px; font-size:15px; }
  .play-btns .btn.sub { padding:11px 16px; }

  /* ---------- オーバーレイ ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(4,8,24,.72); display:none;
    align-items:center; justify-content:center; padding:18px; z-index:50;
  }
  .overlay.show { display:flex; animation:fadein .2s ease; }
  .card {
    background:linear-gradient(180deg,#1b2a58,#131f45); border:1.5px solid rgba(160,185,255,.35);
    border-radius:22px; padding:20px 18px; max-width:420px; width:100%;
    max-height:92vh; overflow-y:auto; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .card h3 { color:#ffe9a8; font-size:22px; margin-bottom:8px; }
  .card p { color:#cdd9ff; font-size:14.5px; line-height:1.6; }
  .clear-stars { font-size:42px; letter-spacing:8px; margin:6px 0 2px; color:#3d4a75; }
  .clear-stars .lit { color:#ffd94d; text-shadow:0 0 16px rgba(255,205,60,.8); display:inline-block; animation:starpop .5s ease backwards; }
  .clear-stars .lit:nth-child(2) { animation-delay:.15s; } .clear-stars .lit:nth-child(3) { animation-delay:.3s; }
  @keyframes starpop { from { transform:scale(0) rotate(-40deg); opacity:0;} to { transform:scale(1) rotate(0); opacity:1;} }
  .card .scene { border-radius:16px; overflow:hidden; margin:10px 0 4px; border:1.5px solid rgba(160,185,255,.25); }
  .card .scene svg { display:block; width:100%; height:auto; }
  .card-btns { display:flex; gap:9px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .howto-diagram { display:flex; justify-content:center; margin:12px 0; }
  .confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .confetti span {
    position:absolute; top:-24px; color:#ffd94d; animation:fall linear forwards;
    text-shadow:0 0 8px rgba(255,205,60,.8);
  }
  @keyframes fall { to { transform:translateY(105vh) rotate(320deg); opacity:.4; } }
</style>
</head>

<div id="app">
  <!-- ================= TITLE ================= -->
  <section id="screen-title" class="screen active">
    <div class="title-scene">
      <svg viewBox="0 0 460 300" role="img" aria-label="夜空の星を見上げるミズー一家のイラスト"><use href="#family-night-title"/></svg>
    </div>
    <h1 class="game-title">ミズーのほしあかり</h1>
    <p class="subtitle">ほしをタップして、ぜんぶに あかりを ともそう！</p>
    <div class="title-btns">
      <button class="btn" id="btn-to-select">▶ あそぶ</button>
      <button class="btn sub" id="btn-to-daily">📅 きょうのデイリー</button>
      <button class="btn sub" id="btn-howto">❓ あそびかた</button>
    </div>
    <p class="title-meta" id="title-total"></p>
  </section>

  <!-- ================= SELECT ================= -->
  <section id="screen-select" class="screen">
    <div class="head">
      <button class="icon-btn" id="btn-back-title" aria-label="タイトルへもどる">←</button>
      <h2>ステージをえらぶ</h2>
      <div class="spacer"></div>
    </div>
    <div class="total-line" id="select-total"></div>
    <div class="tabs">
      <button class="tab" data-diff="easy">かんたん</button>
      <button class="tab" data-diff="normal">ふつう</button>
      <button class="tab" data-diff="hard">むずかしい</button>
      <button class="tab" data-diff="daily">デイリー</button>
    </div>
    <p class="daily-note" id="daily-note" style="display:none"></p>
    <div class="stage-grid" id="stage-grid"></div>
  </section>

  <!-- ================= PLAY ================= -->
  <section id="screen-play" class="screen">
    <div class="head">
      <button class="icon-btn" id="btn-back-select" aria-label="いちらんへもどる">←</button>
      <h2 id="play-title">かんたん 1</h2>
      <button class="icon-btn" id="btn-sound" aria-label="おとの オン・オフ">🔊</button>
    </div>
    <div class="talk">
      <div class="face"><svg viewBox="36 2 128 132" aria-hidden="true"><use href="#ch-mizu"/></svg></div>
      <div class="bubble" id="talk-text">ほしを タップしてみて！</div>
    </div>
    <div class="board-wrap">
      <div class="board-specks" id="board-specks"></div>
      <div class="board" id="board"></div>
    </div>
    <div class="status">
      <span>てかず <b id="stat-moves">0</b></span>
      <span>さいたん <b id="stat-min">0</b></span>
      <span>ついてる ほし <b id="stat-lit">0/0</b></span>
    </div>
    <div class="play-btns">
      <button class="btn" id="btn-hint">💡 ヒント（のこり3）</button>
      <button class="btn sub" id="btn-undo">↩ もどす</button>
      <button class="btn sub" id="btn-reset">🔄 さいしょから</button>
    </div>
  </section>
</div>

<!-- ================= CLEAR ================= -->
<div class="overlay" id="clear-overlay">
  <div class="confetti" id="confetti"></div>
  <div class="card">

    <div class="scene">

      <button class="btn sub" id="btn-replay">もういちど</button>
      <button class="btn sub" id="btn-tolist">いちらんへ</button>
    </div>
  </div>
</div>

</div>

<script>
'use strict';
/* ================= データ ================= */
const STAGES = {"easy":[{"rows":4,"cols":4,"bits":"1101001011101001","min":4},{"rows":4,"cols":4,"bits":"0000100110000011","min":5},{"rows":4,"cols":4,"bits":"0100100111010011","min":4},{"rows":4,"cols":4,"bits":"0001011001001001","min":4},{"rows":4,"cols":4,"bits":"0010011110111111","min":3},{"rows":4,"cols":4,"bits":"0101001111101011","min":6},{"rows":4,"cols":4,"bits":"0001010011101010","min":6},{"rows":4,"cols":4,"bits":"0001100000110000","min":4},{"rows":4,"cols":4,"bits":"1100100100110001","min":4},{"rows":4,"cols":4,"bits":"1111100001011000","min":3}],"normal":[{"rows":5,"cols":5,"bits":"0110010110011001101011100","min":7},{"rows":5,"cols":5,"bits":"1101100100001111001100100","min":8},{"rows":5,"cols":5,"bits":"1011010001011101001000100","min":8},{"rows":5,"cols":5,"bits":"1110001110011011001110010","min":8},{"rows":5,"cols":5,"bits":"0000001111100001011100110","min":7},{"rows":5,"cols":5,"bits":"1011000001011010100100000","min":8},{"rows":5,"cols":5,"bits":"1000001100101110000110101","min":8},{"rows":5,"cols":5,"bits":"0110010101001111100001100","min":8},{"rows":5,"cols":5,"bits":"0101001000101111110000010","min":8},{"rows":5,"cols":5,"bits":"1111001000001011011011100","min":8}],"hard":[{"rows":6,"cols":6,"bits":"001100111011111010010001000100110110","min":12},{"rows":6,"cols":6,"bits":"010001011001000010011011001000001111","min":10},{"rows":6,"cols":6,"bits":"101011111011111100100111111010001111","min":12},{"rows":6,"cols":6,"bits":"011101000010011001110111101000011000","min":10},{"rows":6,"cols":6,"bits":"111111011110001000100011101110001001","min":11},{"rows":6,"cols":6,"bits":"000011101001001100000100001100011110","min":11},{"rows":6,"cols":6,"bits":"010100010100010110100111001000101001","min":10},{"rows":6,"cols":6,"bits":"010111110010110010001100011110111010","min":11},{"rows":6,"cols":6,"bits":"001101000100001100101011100011011111","min":12},{"rows":6,"cols":6,"bits":"101001011111000010011100111101101010","min":10}]};
const SAVE_KEY = 'mizu-hoshiakari-v1';
const DIFF_LABEL = { easy:'かんたん', normal:'ふつう', hard:'むずかしい', daily:'デイリー' };
const STAR_PATH = 'M24 3 L29 17.1 L44 17.5 L32.1 26.6 L36.3 41 L24 32.5 L11.7 41 L15.9 26.6 L4 17.5 L19 17.1 Z';
const SPARK_PATH = 'M38.5 2 L40.1 8.4 L46.5 10 L40.1 11.6 L38.5 18 L36.9 11.6 L30.5 10 L36.9 8.4 Z';

/* ================= ユーティリティ ================= */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function todayStr(d) {
  d = d || new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function applyTap(board, rows, cols, idx) {
  const r = Math.floor(idx / cols), c = idx % cols;
  const flip = (rr, cc) => { if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) board[rr * cols + cc] ^= 1; };
  flip(r, c); flip(r - 1, c); flip(r + 1, c); flip(r, c - 1); flip(r, c + 1);
}

/* ============ GF(2) ソルバー（ヒント・デイリー最短手数用） ============ */
function solveMin(rows, cols, board) {
  const n = rows * cols;
  const mat = [];
  for (let cell = 0; cell < n; cell++) {
    const row = new Array(n + 1).fill(0);
    const r = Math.floor(cell / cols), c = cell % cols;
    const nb = [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
    for (const [rr, cc] of nb) if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) row[rr * cols + cc] = 1;
    row[n] = board[cell] ^ 1; // 目標は全点灯(1)
    mat.push(row);
  }
  const pivotOf = new Array(n).fill(-1);
  let rank = 0;
  for (let col = 0; col < n && rank < n; col++) {
    let sel = -1;
    for (let i = rank; i < n; i++) if (mat[i][col] === 1) { sel = i; break; }
    if (sel === -1) continue;
    const tmp = mat[rank]; mat[rank] = mat[sel]; mat[sel] = tmp;
    for (let i = 0; i < n; i++) {
      if (i !== rank && mat[i][col] === 1) {
        for (let j = col; j <= n; j++) mat[i][j] ^= mat[rank][j];
      }
    }
    pivotOf[col] = rank;
    rank++;
  }
  for (let i = 0; i < n; i++) {
    let allZero = true;
    for (let j = 0; j < n; j++) if (mat[i][j] === 1) { allZero = false; break; }
    if (allZero && mat[i][n] === 1) return null;
  }
  const freeCols = [];
  for (let c = 0; c < n; c++) if (pivotOf[c] === -1) freeCols.push(c);
  const particular = new Array(n).fill(0);
  for (let c = 0; c < n; c++) if (pivotOf[c] !== -1) particular[c] = mat[pivotOf[c]][n];
  if (freeCols.length > 20) return { min: particular.reduce((a, v) => a + v, 0), solution: particular };
  let best = particular, bestW = particular.reduce((a, v) => a + v, 0);
  const total = 1 << freeCols.length;
  for (let s = 1; s < total; s++) {
    const x = particular.slice();
    for (let b = 0; b < freeCols.length; b++) {
      if ((s >> b) & 1) {
        const fc = freeCols[b];
        x[fc] ^= 1;
        for (let c = 0; c < n; c++) {
          if (pivotOf[c] !== -1 && mat[pivotOf[c]][fc] === 1) x[c] ^= 1;
        }
      }
    }
    const w = x.reduce((a, v) => a + v, 0);
    if (w < bestW) { bestW = w; best = x; }
  }
  return { min: bestW, solution: best };
}

/* ================= デイリー生成 ================= */
const DAILY_PLAN = [
  { s: 4, taps: [4, 8],  lo: 3, hi: 6  }, { s: 4, taps: [4, 8],  lo: 3, hi: 6  }, { s: 4, taps: [5, 9],  lo: 4, hi: 6  },
  { s: 5, taps: [7, 13], lo: 5, hi: 9  }, { s: 5, taps: [7, 13], lo: 5, hi: 9  }, { s: 5, taps: [8, 14], lo: 6, hi: 9  }, { s: 5, taps: [8, 14], lo: 6, hi: 9  },
  { s: 6, taps: [10, 18], lo: 7, hi: 12 }, { s: 6, taps: [10, 18], lo: 7, hi: 12 }, { s: 6, taps: [11, 19], lo: 8, hi: 12 },
];
function genDailyStage(rnd, plan) {
  const n = plan.s * plan.s;
  for (let attempt = 0; attempt < 4000; attempt++) {
    const k = plan.taps[0] + Math.floor(rnd() * (plan.taps[1] - plan.taps[0] + 1));
    const taps = new Set();
    while (taps.size < k) taps.add(Math.floor(rnd() * n));
    const board = new Array(n).fill(1);
    for (const t of taps) applyTap(board, plan.s, plan.s, t);
    const lit = board.reduce((a, v) => a + v, 0);
    const frac = lit / n;
    if (lit === n || frac < 0.2 || frac > 0.85) continue;
    const sol = solveMin(plan.s, plan.s, board);
    if (!sol || sol.min < plan.lo || sol.min > plan.hi) continue;
    return { rows: plan.s, cols: plan.s, bits: board.join(''), min: sol.min };
  }
  throw new Error('daily generation failed');
}
function dailyStages(dateStr) {
  const rnd = mulberry32(hashStr('hoshiakari-' + dateStr));
  return DAILY_PLAN.map((p) => genDailyStage(rnd, p));
}

/* ================= セーブ ================= */
let save = { stars: { easy: [], normal: [], hard: [] }, daily: {}, sound: true };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.stars) save = Object.assign(save, p); }
} catch (e) { /* localStorage不可の環境では素通り */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function starsOf(diff, idx, dateStr) {
  if (diff === 'daily') { const d = save.daily[dateStr || todayStr()]; return (d && d[idx]) || 0; }
  return save.stars[diff][idx] || 0;
}
function setStars(diff, idx, s, dateStr) {
  if (diff === 'daily') {
    const key = dateStr || todayStr();
    if (!save.daily[key]) save.daily[key] = [];
    if ((save.daily[key][idx] || 0) < s) save.daily[key][idx] = s;
  } else if ((save.stars[diff][idx] || 0) < s) save.stars[diff][idx] = s;
  persist();
}
function totalStars() {
  let t = 0;
  for (const d of ['easy', 'normal', 'hard']) for (const s of save.stars[d]) t += s || 0;
  for (const key of Object.keys(save.daily)) for (const s of save.daily[key]) t += s || 0;
  return t;
}

/* ================= サウンド (WebAudio) ================= */
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay, slideTo) {
  if (!actx || save.sound === false) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sndTapOn  = () => { tone(1174, 0.16, 'sine', 0.16); tone(1760, 0.22, 'sine', 0.07, 0.02); };
const sndTapOff = () => { tone(523, 0.13, 'triangle', 0.11); };
const sndClick  = () => { tone(880, 0.06, 'sine', 0.06); };
const sndHint   = () => { tone(1568, 0.14, 'sine', 0.1); tone(2093, 0.2, 'sine', 0.08, 0.07); };
const sndClear  = () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'sine', 0.13, i * 0.09)); tone(2637, 0.4, 'sine', 0.05, 0.48); };

/* ================= 画面遷移 ================= */
const $ = (id) => document.getElementById(id);
function showScreen(name) {
  for (const s of document.querySelectorAll('.screen')) s.classList.remove('active');
  $('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

/* ================= ステージ選択 ================= */
let selectDiff = 'easy';
function stageList(diff) { return diff === 'daily' ? dailyStages(todayStr()) : STAGES[diff]; }
function renderSelect() {
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.diff === selectDiff);
  const isDaily = selectDiff === 'daily';
  $('daily-note').style.display = isDaily ? 'block' : 'none';
  if (isDaily) {
    const d = new Date();
    const wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    $('daily-note').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + wd + '）のデイリー・全10面（毎日0時に更新）';
  }
  const list = stageList(selectDiff);
  const grid = $('stage-grid');
  grid.innerHTML = '';
  list.forEach((s, i) => {
    const st = starsOf(selectDiff, i);
    const b = document.createElement('button');
    b.className = 'stage-btn';
    b.setAttribute('aria-label', DIFF_LABEL[selectDiff] + ' ステージ' + (i + 1));
    b.innerHTML = '<span>' + (i + 1) + '</span><span class="st' + (st ? '' : ' none') + '">' +
      '★'.repeat(st) + '☆'.repeat(3 - st) + '</span>';
    b.addEventListener('click', () => { ensureAudio(); sndClick(); startStage(selectDiff, i); });
    grid.appendChild(b);
  });
  $('select-total').textContent = 'あつめた ⭐ ' + totalStars();
}

/* ================= プレイ ================= */
let cur = null; // {diff, idx, stage, board, initial, moves, history, hintsLeft, cleared}
const TALKS_START = [
  'ほしを タップすると、じぶんと まわりの ほしが かわるよ！',
  'ぜんぶの ほしに あかりを ともせるかな？',
  'タップする ほしを よく かんがえてね。',
];
function startStage(diff, idx) {
  const stage = stageList(diff)[idx];
  const board = stage.bits.split('').map(Number);
  cur = {
    diff, idx, stage,
    board: board.slice(), initial: board.slice(),
    moves: 0, history: [], hintsLeft: 3, cleared: false,
  };
  $('play-title').textContent = DIFF_LABEL[diff] + ' ' + (idx + 1);
  buildBoard();
  updatePlayUI();
  setTalk(TALKS_START[Math.floor(Math.random() * TALKS_START.length)]);
  showScreen('play');
}
function buildBoard() {
  const { rows, cols } = cur.stage;
  const boardEl = $('board');
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  boardEl.style.width = cols <= 4 ? 'min(100%, 320px)' : '100%';
  boardEl.classList.toggle('g6', cols >= 6);
  for (let i = 0; i < rows * cols; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.dataset.i = i;
    b.setAttribute('aria-label', 'ほし ' + (i + 1));
    b.innerHTML = '<svg viewBox="0 0 48 48"><path class="star-main" d="' + STAR_PATH + '"/><path class="star-spark" d="' + SPARK_PATH + '" fill="#fff8d6"/></svg>';
    b.addEventListener('click', () => onTap(i));
    boardEl.appendChild(b);
  }
  // 盤面の小さな星くず
  const specks = $('board-specks');
  specks.innerHTML = '';
  const rnd = mulberry32(hashStr('specks-' + cur.stage.bits));
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span');
    const sz = 1.5 + rnd() * 2.2;
    s.style.cssText = 'position:absolute;border-radius:50%;background:#dbe7ff;left:' + (rnd() * 98) +
      '%;top:' + (rnd() * 98) + '%;width:' + sz + 'px;height:' + sz + 'px;opacity:' + (0.15 + rnd() * 0.4);
    specks.appendChild(s);
  }
  refreshCells();
}
function refreshCells() {
  const cells = $('board').children;
  for (let i = 0; i < cells.length; i++) cells[i].classList.toggle('on', cur.board[i] === 1);
}
function litCount() { return cur.board.reduce((a, v) => a + v, 0); }
function updatePlayUI() {
  $('stat-moves').textContent = cur.moves;
  $('stat-min').textContent = cur.stage.min;
  $('stat-lit').textContent = litCount() + '/' + cur.board.length;
  $('btn-hint').textContent = '💡 ヒント（のこり' + cur.hintsLeft + '）';
  $('btn-hint').disabled = cur.hintsLeft <= 0 || cur.cleared;
  $('btn-undo').disabled = cur.history.length === 0 || cur.cleared;
  $('btn-sound').textContent = save.sound === false ? '🔇' : '🔊';
}
function setTalk(t) { $('talk-text').textContent = t; }
function progressTalk() {
  const f = litCount() / cur.board.length;
  if (f >= 0.92) setTalk('もうちょっと！ あと すこしだよ！');
  else if (f >= 0.75) setTalk('あと すこし！ その ちょうし！');
  else if (f >= 0.5) setTalk('ついた ほしが ふえてきたね！');
}
function onTap(i) {
  if (!cur || cur.cleared) return;
  ensureAudio();
  applyTap(cur.board, cur.stage.rows, cur.stage.cols, i);
  cur.history.push(i);
  cur.moves++;
  if (cur.board[i] === 1) sndTapOn(); else sndTapOff();
  const cells = $('board').children;
  const r = Math.floor(i / cur.stage.cols), c = i % cur.stage.cols;
  const nb = [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
  for (const [rr, cc] of nb) {
    if (rr >= 0 && rr < cur.stage.rows && cc >= 0 && cc < cur.stage.cols) {
      const el = cells[rr * cur.stage.cols + cc];
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }
  }
  refreshCells();
  updatePlayUI();
  if (litCount() === cur.board.length) { onClear(); return; }
  progressTalk();
}
function onClear() {
  cur.cleared = true;
  const s = cur.moves <= cur.stage.min ? 3 : (cur.moves <= cur.stage.min + 3 ? 2 : 1);
  setStars(cur.diff, cur.idx, s);
  sndClear();
  setTalk('やったー！ ぜんぶ ついたね！');
  updatePlayUI();
  $('clear-stars').innerHTML = [1, 2, 3].map((k) =>
    '<span class="' + (k <= s ? 'lit' : '') + '">★</span>').join('');
  $('clear-msg').textContent = 'てかず ' + cur.moves + '（さいたん ' + cur.stage.min + '）' +
    (s === 3 ? '　さいたんで クリア！すごい！' : s === 2 ? '　あと すこしで さいたん！' : '');
  const list = stageList(cur.diff);
  $('btn-next').style.display = cur.idx + 1 < list.length ? '' : 'none';
  spawnConfetti();
  setTimeout(() => $('clear-overlay').classList.add('show'), 550);
}
function spawnConfetti() {
  const box = $('confetti');
  box.innerHTML = '';
  const colors = ['#ffd94d', '#fff3bf', '#a8c6ff', '#ffb59d'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span');
    s.textContent = '★';
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (11 + Math.random() * 15) + 'px';
    s.style.color = colors[i % colors.length];
    s.style.animationDuration = (1.7 + Math.random() * 1.6) + 's';
    s.style.animationDelay = (Math.random() * 0.7) + 's';
    box.appendChild(s);
  }
}

/* ================= ボタン類 ================= */
$('btn-hint').addEventListener('click', () => {
  if (!cur || cur.cleared || cur.hintsLeft <= 0) return;
  ensureAudio();
  const sol = solveMin(cur.stage.rows, cur.stage.cols, cur.board);
  if (!sol) return;
  const targets = [];
  sol.solution.forEach((v, i) => { if (v === 1) targets.push(i); });
  if (!targets.length) return;
  const pick = targets[Math.floor(Math.random() * targets.length)];
  cur.hintsLeft--;
  sndHint();
  const el = $('board').children[pick];
  el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint');
  setTalk('みどりに ひかった ほしが ヒントだよ！');
  updatePlayUI();
});
$('btn-undo').addEventListener('click', () => {
  if (!cur || cur.cleared || !cur.history.length) return;
  ensureAudio(); sndClick();
  const last = cur.history.pop();
  applyTap(cur.board, cur.stage.rows, cur.stage.cols, last);
  cur.moves--;
  refreshCells(); updatePlayUI();
});
$('btn-reset').addEventListener('click', () => {
  if (!cur || cur.cleared) return;
  ensureAudio(); sndClick();
  cur.board = cur.initial.slice();
  cur.history = []; cur.moves = 0;
  refreshCells(); updatePlayUI();
  setTalk('さいしょから やりなおし！');
});
$('btn-sound').addEventListener('click', () => {
  save.sound = save.sound === false ? true : false;
  persist(); ensureAudio(); if (save.sound) sndClick();
  updatePlayUI();
});
$('btn-back-select').addEventListener('click', () => { ensureAudio(); sndClick(); selectDiff = cur ? cur.diff : selectDiff; renderSelect(); showScreen('select'); });
$('btn-back-title').addEventListener('click', () => { ensureAudio(); sndClick(); renderTitle(); showScreen('title'); });
$('btn-to-select').addEventListener('click', () => { ensureAudio(); sndClick(); selectDiff = 'easy'; renderSelect(); showScreen('select'); });
$('btn-to-daily').addEventListener('click', () => { ensureAudio(); sndClick(); selectDiff = 'daily'; renderSelect(); showScreen('select'); });
$('btn-howto').addEventListener('click', () => { ensureAudio(); sndClick(); $('howto-overlay').classList.add('show'); });
$('btn-howto-close').addEventListener('click', () => { ensureAudio(); sndClick(); $('howto-overlay').classList.remove('show'); });
for (const t of document.querySelectorAll('.tab')) {
  t.addEventListener('click', () => { ensureAudio(); sndClick(); selectDiff = t.dataset.diff; renderSelect(); });
}
$('btn-next').addEventListener('click', () => {
  ensureAudio(); sndClick();
  $('clear-overlay').classList.remove('show');
  if (cur && cur.idx + 1 < stageList(cur.diff).length) startStage(cur.diff, cur.idx + 1);
});
$('btn-replay').addEventListener('click', () => {
  ensureAudio(); sndClick();
  $('clear-overlay').classList.remove('show');
  if (cur) startStage(cur.diff, cur.idx);
});
$('btn-tolist').addEventListener('click', () => {
  ensureAudio(); sndClick();
  $('clear-overlay').classList.remove('show');
  selectDiff = cur ? cur.diff : 'easy';
  renderSelect(); showScreen('select');
});
function renderTitle() {
  const t = totalStars();
  $('title-total').textContent = t > 0 ? 'あつめた ⭐ ' + t : '';
}
document.body.style.userSelect = 'none';
document.addEventListener('gesturestart', (e) => e.preventDefault());
renderTitle();

/* テスト・検証用フック */
window.HoshiAkari = { STAGES, dailyStages, solveMin, getCur: () => cur, startStage, todayStr };
</script>
